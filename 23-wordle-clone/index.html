<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Clone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }
  h1 {
    font-size: 2.2rem;
    letter-spacing: 4px;
    margin-bottom: 4px;
    color: #e94560;
    text-shadow: 0 2px 8px rgba(233, 69, 96, .4);
  }
  .subtitle { color: #8a8fa8; margin-bottom: 18px; font-size: .9rem; }

  #toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #eee;
    color: #1a1a2e;
    font-weight: 700;
    font-size: .95rem;
    padding: 10px 18px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
    z-index: 20;
  }
  #toast.show { opacity: 1; }

  .board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    width: min(340px, 92vw);
    margin-bottom: 24px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .tile {
    aspect-ratio: 1;
    border: 2px solid #3a3a52;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.9rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #fff;
  }
  .tile.filled { border-color: #56567a; animation: pop .1s ease; }
  @keyframes pop { 0% { transform: scale(.8); } 100% { transform: scale(1); } }

  .tile.flip { animation: flip .5s ease forwards; }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .tile.correct { background: #3e9e57; border-color: #3e9e57; }
  .tile.present { background: #b59f3b; border-color: #b59f3b; }
  .tile.absent  { background: #3a3a4a; border-color: #3a3a4a; }

  .row.shake { animation: shake .5s ease; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  .tile.win { animation: bounce 1s ease; }
  @keyframes bounce {
    0%, 20% { transform: translateY(0); }
    40% { transform: translateY(-24px); }
    60% { transform: translateY(0); }
    80% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(500px, 96vw);
    align-items: center;
  }
  .krow { display: flex; gap: 6px; width: 100%; justify-content: center; }
  .key {
    flex: 0 1 44px;
    height: 56px;
    font-size: .95rem;
    font-weight: 700;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    background: #56567a;
    color: #eee;
    cursor: pointer;
    transition: transform .08s, background .15s;
  }
  .key.wide { flex-basis: 68px; font-size: .75rem; }
  .key:hover { background: #6a6a95; transform: translateY(-2px); }
  .key.correct { background: #3e9e57; }
  .key.present { background: #b59f3b; }
  .key.absent  { background: #2c2c40; }

  .restart {
    margin-top: 20px;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: #fff;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
  }
  .restart:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(233,69,96,.4); }
  .stats { margin-top: 10px; font-size: .85rem; color: #8a8fa8; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,10,25,.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #22223c;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 36px 48px;
    text-align: center;
    animation: popIn .25s ease;
  }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } }
  .panel h2 { font-size: 2rem; margin-bottom: 8px; }
  .panel.win h2 { color: #4ecb71; }
  .panel.lose h2 { color: #e94560; }
  .panel p { color: #aab; margin-bottom: 20px; }
  .panel b { color: #f0c75e; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>
<h1>WORDLE</h1>
<div class="subtitle">Guess the 5-letter word in 6 tries</div>

<div id="toast"></div>
<div class="board" id="board"></div>

<button class="restart" id="restart">New Game</button>
<div class="stats" id="stats">Wins: 0 &nbsp;·&nbsp; Losses: 0</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <button class="restart" id="overlayRestart">Play Again</button>
  </div>
</div>

'SOAPY','SOBER','SOGGY','SONAR','SONIC','SOOTH','SOOTY','SOWER','SPADE','SPANK',
'SPARK','SPASM','SPAWN','SPEAR','SPECK','SPELT','SPICE','SPICY','SPIED','SPIEL',
'SPILL','SPILT','SPINE','SPINY','SPIRE','SPITE','SPLAT','SPOIL','SPOOF','SPOOK',
'SPOOL','SPOON','SPORE','SPOUT','SPRAY','SPREE','SPRIG','SPUNK','SPURN','SQUAD',
'SQUAT','SQUID','STAIR','STAKE','STALE','STALK','STALL','STAMP','STANK','STARE',
'STARK','STASH','STAVE','STEAD','STEAK','STEAL','STEED','STEEP','STEER','STEIN',
'STERN','STIFF','STILT','STING','STINK','STINT','STOAT','STOIC','STOKE','STOMP',
'STOOP','STOUT','STOVE','STRAP','STRAW','STRAY','STRUM','STRUT','STUMP','STUNG',
'STUNT','SUAVE','SUEDE','SULKY','SUNNY','SURGE','SURLY','SUSHI','SWAMI','SWAMP',
'SWARM','SWASH','SWATH','SWEAR','SWEAT','SWEEP','SWELL','SWEPT','SWIFT','SWINE',
'SWING','SWIRL','SWISH','SWOOP','SWORD','SWORE','SWORN','SWUNG','SYRUP','TABBY',
'TACIT','TACKY','TAFFY','TAINT','TALLY','TALON','TAMER','TANGO','TANGY','TAPER',
'TAPIR','TARDY','TAROT','TASTY','TATTY','TAUNT','TAWNY','TEARY','TEASE','TEDDY',
'TEMPO','TENOR','TENSE','TENTH','TEPEE','TEPID','TERRA','TERSE','TESTY','TEXAN',
'THETA','THIGH','THINE','THORN','THUMB','THUMP','THYME','TIARA','TIBIA','TIDAL',
'TIGER','TILDE','TIMER','TIMID','TIPSY','TITAN','TITHE','TOAST','TOKEN','TONAL',
'TONIC','TOOTH','TOPAZ','TORCH','TORSO','TORUS','TOTEM','TOXIC','TOXIN','TRACE',
'TRACT','TRAIL','TRAIT','TRAMP','TRASH','TRAWL','TREAD','TRIAD','TRICE','TRILL',
'TRIPE','TRITE','TROLL','TROOP','TROPE','TROUT','TROVE','TRUCE','TRUNK','TRUSS',
'TRYST','TUBER','TULIP','TUMOR','TUNIC','TURBO','TUTOR','TWANG','TWEAK','TWEED',
'TWEET','TWERP','TWINE','TWIRL','TWIST','UDDER','ULCER','ULTRA','UNCLE','UNDUE',
'UNFIT','UNIFY','UNITE','UNSET','UNWED','URINE','USHER','UTTER','VAGUE','VALET',
'VALOR','VALVE','VAPID','VAPOR','VAULT','VAUNT','VEGAN','VENOM','VENUE','VERGE',
'VERSE','VERVE','VICAR','VIGIL','VIGOR','VILLA','VINYL','VIOLA','VIPER','VIRAL',
'VISTA','VIVID','VIXEN','VOCAL','VODKA','VOGUE','VOMIT','VOTER','VOUCH','VOWEL',
'VYING','WACKY','WAFER','WAGON','WAIST','WAIVE','WALTZ','WARTY','WASPY','WEARY',
'WEAVE','WEDGE','WEEDY','WEIGH','WEIRD','WELSH','WENCH','WHACK','WHALE','WHARF',
'WHEAT','WHELP','WHIFF','WHINE','WHINY','WHIRL','WHISK','WHOOP','WIDEN','WIDER',
'WIDOW','WIDTH','WIELD','WIGHT','WILLY','WIMPY','WINCE','WINCH','WINDY','WIPER',
'WIRED','WISPY','WITCH','WITTY','WOKEN','WOOZY','WORDY','WOVEN','WRACK','WRATH',
'WREAK','WRECK','WREST','WRING','WRIST','YACHT','YEAST','YODEL','YOKEL','ZEBRA',
'ZESTY','ZONAL'
];
const VALID = new Set([...ANSWERS, ...EXTRA]);

const ROWS = 6, COLS = 5;
const WIN_MSGS = ['Genius!', 'Magnificent!', 'Impressive!', 'Splendid!', 'Great!', 'Phew!'];
const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];

const boardEl = document.getElementById('board');
const keyboardEl = document.getElementById('keyboard');
const toastEl = document.getElementById('toast');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const resultTitle = document.getElementById('resultTitle');
const resultText = document.getElementById('resultText');
const statsEl = document.getElementById('stats');

let answer, guesses, current, over, busy, wins = 0, losses = 0;
let tiles = [], keyEls = {}, toastTimer;

// ---- Setup ----
function buildBoard() {
  boardEl.innerHTML = '';
  tiles = [];
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const rowTiles = [];
    for (let c = 0; c < COLS; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
      rowTiles.push(t);
    }
    boardEl.appendChild(row);
    tiles.push(rowTiles);
  }
}

function buildKeyboard() {
  keyboardEl.innerHTML = '';
  keyEls = {};
  KB_ROWS.forEach((letters, i) => {
    const row = document.createElement('div');
    row.className = 'krow';
    if (i === 2) row.appendChild(makeKey('Enter', 'ENTER', true));
    for (const ch of letters) row.appendChild(makeKey(ch, ch, false));
    if (i === 2) row.appendChild(makeKey('⌫', 'BACKSPACE', true));
    keyboardEl.appendChild(row);
  });
}

function makeKey(label, code, wide) {
  const b = document.createElement('button');
  b.className = 'key' + (wide ? ' wide' : '');
  b.textContent = label;
  b.addEventListener('click', () => handleInput(code));
  keyEls[code] = b;
  return b;
}

function newGame() {
  answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
  guesses = [];
  current = '';
  over = false;
  busy = false;
  overlay.classList.remove('show');
  buildBoard();
  buildKeyboard();
  updateStats();
}

// ---- Input ----
function handleInput(key) {
  if (over || busy) return;
  if (key === 'ENTER') return submitGuess();
  if (key === 'BACKSPACE') {
    if (current.length) {
      current = current.slice(0, -1);
      paintRow();
    }
    return;
  }
  if (/^[A-Z]$/.test(key) && current.length < COLS) {
    current += key;
    paintRow();
  }
}

function paintRow() {
  const rowTiles = tiles[guesses.length];
  for (let c = 0; c < COLS; c++) {
    const t = rowTiles[c];
    t.textContent = current[c] || '';
    t.classList.toggle('filled', !!current[c]);
  }
}

// ---- Guess evaluation ----
function evaluate(guess) {
  const res = Array(COLS).fill('absent');
  const counts = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === answer[i]) res[i] = 'correct';
    else counts[answer[i]] = (counts[answer[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (res[i] !== 'correct' && counts[guess[i]] > 0) {
      res[i] = 'present';
      counts[guess[i]]--;
    }
  }
  return res;
}

function submitGuess() {
  if (current.length < COLS) {
    shakeRow(guesses.length);
    toast('Not enough letters');
    return;
  }
  if (!VALID.has(current)) {
    shakeRow(guesses.length);
    toast('Not in word list');
    return;
  }
  busy = true;
  const guess = current;
  const res = evaluate(guess);
  const rowIdx = guesses.length;
  const rowTiles = tiles[rowIdx];

  rowTiles.forEach((t, i) => {
    t.style.animationDelay = (i * 280) + 'ms';
    t.classList.add('flip');
    setTimeout(() => t.classList.add(res[i]), i * 280 + 250);
  });

  setTimeout(() => {
    updateKeyboard(guess, res);
    guesses.push(guess);
    current = '';
    busy = false;
    if (guess === answer) {
      over = true;
      wins++;
      rowTiles.forEach((t, i) => {
        t.style.animationDelay = (i * 100) + 'ms';
        t.classList.add('win');
      });
      endPanel('win', WIN_MSGS[rowIdx], `Solved in ${rowIdx + 1} of ${ROWS} guesses`);
      setTimeout(() => overlay.classList.add('show'), 1200);
    } else if (guesses.length >= ROWS) {
      over = true;
      losses++;
      endPanel('lose', 'Game Over', `The word was <b>${answer}</b>`);
      setTimeout(() => overlay.classList.add('show'), 600);
    }
    updateStats();
  }, COLS * 280 + 400);
}

function updateKeyboard(guess, res) {
  const rank = { absent: 0, present: 1, correct: 2 };
  for (let i = 0; i < COLS; i++) {
    const k = keyEls[guess[i]];
    const cur = rank[res[i]];
    const prev = ['absent', 'present', 'correct'].findIndex(c => k.classList.contains(c));
    if (cur > prev) {
      k.classList.remove('absent', 'present', 'correct');
      k.classList.add(res[i]);
    }
  }
}

function shakeRow(rowIdx) {
  const row = boardEl.children[rowIdx];
  row.classList.add('shake');
  setTimeout(() => row.classList.remove('shake'), 500);
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
}

function updateStats() {
  statsEl.innerHTML = `Wins: ${wins} &nbsp;·&nbsp; Losses: ${losses}`;
}

function endPanel(cls, title, html) {
  panel.className = 'panel ' + cls;
  resultTitle.textContent = title;
  resultText.innerHTML = html;
}

// Physical keyboard support
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (overlay.classList.contains('show')) {
    if (e.key === 'Enter') newGame();
    return;
  }
  if (e.key === 'Enter') handleInput('ENTER');
  else if (e.key === 'Backspace') handleInput('BACKSPACE');
  else {
    const ch = e.key.toUpperCase();
    if (/^[A-Z]$/.test(ch)) handleInput(ch);
  }
});

document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('overlayRestart').addEventListener('click', newGame);

newGame();
</script>
