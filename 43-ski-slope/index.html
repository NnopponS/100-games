<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ski Slope</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #dfeaf4; }
  canvas { display: block; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);

let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const playerY = () => H * 0.32;

let best = 0;
try { best = parseFloat(localStorage.getItem('skiSlopeBest')) || 0; } catch (e) {}

let state = 'ready'; // 'ready' | 'play' | 'over'
let t = 0, overT = 0, scroll = 0;
let player, obstacles, tracks, puffs;
let dist, speed, gapAcc, nextGap;

function reset() {
  player = { x: W / 2, vx: 0, angle: 0 };
  obstacles = []; tracks = []; puffs = [];
  dist = 0; speed = 240; gapAcc = 0; nextGap = 220;
}
reset();

const flakes = [];
for (let i = 0; i < 80; i++)
  flakes.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 2.6), s: rand(18, 55), ph: rand(0, TAU) });

const keys = {};
const pointer = { down: false, x: 0 };
const isSteer = c => c === 'ArrowLeft' || c === 'ArrowRight' || c === 'KeyA' || c === 'KeyD';
const isGo = c => c === 'Space' || c === 'Enter' || c === 'KeyR';

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((state === 'ready' && (isSteer(e.code) || isGo(e.code))) ||
      (state === 'over' && isGo(e.code) && overT > 0.6)) {
    reset(); state = 'play';
  }
  if (isSteer(e.code) || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown')
    e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });

canvas.addEventListener('pointerdown', e => {
  if (state === 'ready' || (state === 'over' && overT > 0.6)) { reset(); state = 'play'; }
  pointer.down = true; pointer.x = e.clientX;
});
window.addEventListener('pointermove', e => { if (pointer.down) pointer.x = e.clientX; });
window.addEventListener('pointerup', () => { pointer.down = false; });
window.addEventListener('pointercancel', () => { pointer.down = false; });

function crash() {
  state = 'over'; overT = 0;
  if (dist > best) {
    best = dist;
    try { localStorage.setItem('skiSlopeBest', String(best)); } catch (e) {}
  }
  const py = playerY();
  for (let i = 0; i < 24; i++)
    puffs.push({ x: player.x + rand(-10, 10), y: py + rand(-8, 8),
      vx: rand(-140, 140), vy: rand(-180, 20), life: rand(0.4, 0.9), r: rand(2, 5) });
}

function update(dt) {
  t += dt;
  for (const f of flakes) {
    f.y += f.s * dt;
    f.x += Math.sin(t * 1.4 + f.ph) * 14 * dt;
    if (f.y > H + 5) { f.y = -5; f.x = rand(0, W); }
    if (f.x < -5) f.x = W + 5; else if (f.x > W + 5) f.x = -5;
  }
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.life -= dt;
    if (p.life <= 0) puffs.splice(i, 1);
  }
  if (state === 'over') { overT += dt; return; }
  scroll += (state === 'play' ? speed : 40) * dt;
  if (state !== 'play') return;

  const py = playerY();

  let steer = 0;
  if (keys.ArrowLeft || keys.KeyA) steer -= 1;
  if (keys.ArrowRight || keys.KeyD) steer += 1;
  if (pointer.down) steer += clamp((pointer.x - player.x) / 90, -1, 1);
  steer = clamp(steer, -1, 1);

  player.vx = clamp((player.vx + steer * 2400 * dt) * Math.exp(-5 * dt), -440, 440);
  player.x = clamp(player.x + player.vx * dt, 16, W - 16);
  if (player.x === 16 || player.x === W - 16) player.vx = 0;
  player.angle += ((player.vx / 440) * 0.5 - player.angle) * Math.min(1, dt * 10);

  speed = Math.min(240 + dist * 0.85, 720);
  dist += speed * dt * 0.045;

  gapAcc += speed * dt;
  if (gapAcc >= nextGap) {
    gapAcc = 0;
    nextGap = rand(140, 280) + speed * 0.18;
    const type = Math.random() < 0.68 ? 'tree' : 'rock';
    obstacles.push({ x: rand(28, W - 28), y: H + 60, type: type,
      r: type === 'tree' ? rand(15, 22) : rand(10, 16) });
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.y -= speed * dt;
    if (o.y < -80) { obstacles.splice(i, 1); continue; }
    const dx = o.x - player.x, dy = o.y - py;
    const rr = 9 + o.r * (o.type === 'tree' ? 0.55 : 0.7);
    if (dx * dx + dy * dy < rr * rr) { crash(); return; }
  }

  const last = tracks[tracks.length - 1];
  if (!last || (player.x - last.x) * (player.x - last.x) + (py - last.y) * (py - last.y) > 36)
    tracks.push({ x: player.x, y: py });
  for (let i = tracks.length - 1; i >= 0; i--) {
    tracks[i].y -= speed * dt;
    if (tracks[i].y < -20) tracks.splice(i, 1);
  }
}

function tri(cx, top, halfW, h) {
  ctx.beginPath();
  ctx.moveTo(cx, top);
  ctx.lineTo(cx - halfW, top + h);
  ctx.lineTo(cx + halfW, top + h);
  ctx.closePath(); ctx.fill();
}

function drawTree(o) {
  const x = o.x, y = o.y, r = o.r;
  ctx.fillStyle = 'rgba(60,80,110,0.16)';
  ctx.beginPath(); ctx.ellipse(x + 3, y + 4, r * 1.1, r * 0.32, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(x - r * 0.12, y - r * 0.55, r * 0.24, r * 0.6);
  ctx.fillStyle = '#2c7a45'; tri(x, y - r * 1.15, r * 1.05, r * 1.3);
  ctx.fillStyle = '#256b3c'; tri(x, y - r * 1.85, r * 0.85, r * 1.2);
  ctx.fillStyle = '#1e5c33'; tri(x, y - r * 2.5, r * 0.62, r * 1.1);
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; tri(x, y - r * 2.5, r * 0.26, r * 0.45);
}

function drawRock(o) {
  const x = o.x, y = o.y, r = o.r;
  ctx.fillStyle = 'rgba(60,80,110,0.16)';
  ctx.beginPath(); ctx.ellipse(x + 2, y + r * 0.35, r * 1.1, r * 0.4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#8d99a8';
  ctx.beginPath();
  ctx.moveTo(x - r, y + r * 0.35);
  ctx.lineTo(x - r * 0.65, y - r * 0.55);
  ctx.lineTo(x, y - r * 0.85);
  ctx.lineTo(x + r * 0.75, y - r * 0.45);
  ctx.lineTo(x + r, y + r * 0.35);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#aeb9c6';
  ctx.beginPath();
  ctx.moveTo(x - r * 0.65, y - r * 0.55);
  ctx.lineTo(x, y - r * 0.85);
  ctx.lineTo(x + r * 0.35, y - r * 0.5);
  ctx.lineTo(x - r * 0.15, y - r * 0.3);
  ctx.closePath(); ctx.fill();
}

function drawPlayer() {
  const x = player.x, y = playerY();
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(60,80,110,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 8, 11, 4.5, 0, 0, TAU); ctx.fill();
  ctx.rotate(state === 'over' ? 1.45 : player.angle);
  ctx.strokeStyle = '#2c3542'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-6, -16); ctx.lineTo(-6, 14); ctx.quadraticCurveTo(-6, 20, -3, 21);
  ctx.moveTo(6, -16); ctx.lineTo(6, 14); ctx.quadraticCurveTo(6, 20, 3, 21);
  ctx.stroke();
  ctx.strokeStyle = '#5a6472'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-11, -2); ctx.lineTo(-15, 12); ctx.moveTo(11, -2); ctx.lineTo(15, 12); ctx.stroke();
  ctx.strokeStyle = '#d8402f'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(-6, -5); ctx.lineTo(-11, -2); ctx.moveTo(6, -5); ctx.lineTo(11, -2); ctx.stroke();
  ctx.fillStyle = '#e0452f';
  ctx.beginPath(); ctx.ellipse(0, -2, 7, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#23364e';
  ctx.beginPath(); ctx.arc(0, -13, 5, 0, TAU); ctx.fill();
  ctx.restore();

  if (state === 'over') {
    ctx.fillStyle = '#f2b134';
    for (let i = 0; i < 4; i++) {
      const a = t * 5 + i * TAU / 4;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * 15, y - 16 + Math.sin(a) * 7, 2.2, 0, TAU);
      ctx.fill();
    }
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#d7e6f3');
  g.addColorStop(1, '#eef5fb');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(150,175,205,0.35)'; ctx.lineWidth = 1.5;
  const sp = 90, off = scroll % sp;
  for (let y = -sp + off; y < H + sp; y += sp) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 40) {
      const yy = y + Math.sin(x * 0.008 + y * 0.05) * 6;
      if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    }
    ctx.stroke();
  }

  if (tracks.length > 1) {
    ctx.strokeStyle = 'rgba(120,145,175,0.55)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    for (const so of [-4.5, 4.5]) {
      ctx.beginPath();
      ctx.moveTo(tracks[0].x + so, tracks[0].y);
      for (let i = 1; i < tracks.length; i++) ctx.lineTo(tracks[i].x + so, tracks[i].y);
      ctx.stroke();
    }
  }

  const sorted = obstacles.slice().sort((a, b) => a.y - b.y);
  for (const o of sorted) o.type === 'tree' ? drawTree(o) : drawRock(o);

  drawPlayer();

  for (const p of puffs) {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.max(0, p.life) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#16304e';
  ctx.font = '700 30px system-ui, -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(Math.floor(dist) + ' m', W / 2, 46);
  ctx.font = '600 13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(22,48,78,0.55)';
  ctx.fillText('BEST ' + Math.floor(Math.max(best, dist)) + ' m', W / 2, 66);
  ctx.textAlign = 'left';
  ctx.fillText(Math.round(speed * 0.162) + ' km/h', 14, 26);

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const f of flakes) { ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); }

  if (state !== 'play') {
    const pw = Math.min(430, W - 40), ph = state === 'ready' ? 200 : 180;
    const px = (W - pw) / 2, py = (H - ph) / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRect(px, py, pw, ph, 16); ctx.fill();
    ctx.strokeStyle = 'rgba(60,90,130,0.3)'; ctx.lineWidth = 1;
    roundRect(px, py, pw, ph, 16); ctx.stroke();
    ctx.textAlign = 'center';
    const blink = Math.floor(t * 2) % 2 === 0;
    if (state === 'ready') {
      ctx.fillStyle = '#16304e';
      ctx.font = '800 38px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('SKI SLOPE', W / 2, py + 56);
      ctx.font = '500 15px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(22,48,78,0.75)';
      ctx.fillText('Steer with \u2190 \u2192 or A / D \u2014 dodge trees and rocks.', W / 2, py + 94);
      ctx.fillText('Touch: hold and drag to steer.', W / 2, py + 118);
      if (blink) {
        ctx.fillStyle = '#d8402f';
        ctx.font = '700 16px system-ui, sans-serif';
        ctx.fillText('Press SPACE or tap to start', W / 2, py + 160);
      }
    } else {
      ctx.fillStyle = '#16304e';
      ctx.font = '800 32px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('WIPEOUT!', W / 2, py + 52);
      ctx.font = '700 20px system-ui, sans-serif';
      ctx.fillText(Math.floor(dist) + ' m', W / 2, py + 86);
      ctx.font = '500 14px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(22,48,78,0.7)';
      ctx.fillText('Best ' + Math.floor(best) + ' m', W / 2, py + 110);
      if (blink) {
        ctx.fillStyle = '#d8402f';
        ctx.font = '700 15px system-ui, sans-serif';
        ctx.fillText('Press R or tap to ski again', W / 2, py + 148);
      }
    }
  }
}

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
