<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etch A Sketch</title>
<style>
  :root {
    --toy-w: min(92vw, 720px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #3a4b5c 0%, #1d2731 70%);
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(40% 50% at 20% 25%, rgba(226,59,59,.12), transparent 70%),
      radial-gradient(45% 55% at 80% 25%, rgba(255,200,80,.08), transparent 70%),
      radial-gradient(50% 55% at 50% 85%, rgba(120,160,220,.10), transparent 70%);
    animation: aurora 22s ease-in-out infinite alternate;
  }
  @keyframes aurora { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(2deg) scale(1.07); } }
  .toy {
    width: var(--toy-w);
    background: linear-gradient(160deg, #e23b3b 0%, #c21f1f 55%, #a11414 100%);
    border-radius: 18px;
    padding: 3.2% 4% 4.5%;
    box-shadow:
      inset 0 2px 6px rgba(255,255,255,.35),
      inset 0 -6px 12px rgba(0,0,0,.35),
      0 18px 40px rgba(0,0,0,.55);
    position: relative;
  }
  .brand {
    text-align: center;
    color: #fff;
    font-style: italic;
    font-weight: 700;
    letter-spacing: 2px;
    font-size: calc(var(--toy-w) * 0.035);
    text-shadow: 0 -1px 1px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.25);
    margin-bottom: 3%;
    text-transform: uppercase;
  }
  .screen-frame {
    background: #8f8f8f;
    border-radius: 8px;
    padding: 2.5%;
    box-shadow:
      inset 0 2px 8px rgba(0,0,0,.5),
      0 1px 0 rgba(255,255,255,.3);
  }
  .screen-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #c9c9c9;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 22px rgba(0,0,0,.18);
  }
  .screen-wrap.shaking {
    animation: shake .5s ease-in-out;
  }
  @keyframes shake {
    0%,100% { transform: translate(0,0) rotate(0deg); }
    15% { transform: translate(-8px,4px) rotate(-1.2deg); }
    30% { transform: translate(7px,-5px) rotate(1.2deg); }
    45% { transform: translate(-6px,5px) rotate(-1deg); }
    60% { transform: translate(6px,-4px) rotate(1deg); }
    75% { transform: translate(-4px,2px) rotate(-.6deg); }
    90% { transform: translate(3px,-2px) rotate(.4deg); }
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #ui { touch-action: none; cursor: crosshair; }
  .clear-btn {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 18px;
    font: inherit;
    font-size: calc(var(--toy-w) * 0.024);
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background .15s;
  }
  .clear-btn:active { background: rgba(0,0,0,.45); }
  .knobs {
    display: flex;
    justify-content: space-between;
    margin-top: 5%;
    padding: 0 8%;
  }
  .knob {
    width: calc(var(--toy-w) * 0.14);
    height: calc(var(--toy-w) * 0.14);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e8e4da 45%, #b8b2a4 100%);
    box-shadow:
      0 5px 10px rgba(0,0,0,.45),
      inset 0 -4px 6px rgba(0,0,0,.2),
      inset 0 3px 4px rgba(255,255,255,.8);
    position: relative;
  }
  .knob::after {
    content: "";
    position: absolute;
    width: 12%;
    height: 12%;
    border-radius: 50%;
    background: #7a7468;
    top: 22%;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.4);
  }
  .hint {
    text-align: center;
    margin-top: 3.5%;
    color: rgba(255,255,255,.75);
    font-size: calc(var(--toy-w) * 0.022);
    letter-spacing: .5px;
  }
  .hint kbd {
    background: rgba(0,0,0,.25);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
    border: 1px solid rgba(255,255,255,.2);
  }
</style>
</head>
<body>
<div class="toy" id="toy">
  <div class="brand">Etch A Sketch</div>
  <div class="screen-frame">
    <div class="screen-wrap" id="screenWrap">
      <canvas id="art"></canvas>
      <canvas id="ui"></canvas>
    </div>
  </div>
  <div class="knobs">
    <div class="knob" id="knobL"></div>
    <div class="knob" id="knobR"></div>
  </div>
  <div class="hint"><kbd>&larr;&uarr;&darr;&rarr;</kbd> or drag on screen to draw &nbsp;&middot;&nbsp; <kbd>Space</kbd> or shake to clear<br>
    <button class="clear-btn" id="clearBtn">Shake to Clear</button>
  </div>
</div>

<script>
(function () {
  /* ---------- procedural SFX (respects the overlay's speaker preference) ---------- */
  var Sfx = (function () {
    var actx = null;
    function ac() {
      if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
      return actx;
    }
    function on() { try { return localStorage.getItem('aaa_sfx') !== '0'; } catch (e) { return true; } }
    function tone(f, d, type, vol, slide, delay) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var t = c.currentTime + (delay || 0);
        var o = c.createOscillator(), g = c.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(Math.max(30, f), t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        o.connect(g); g.connect(c.destination);
        o.start(t); o.stop(t + d + 0.05);
      } catch (e) {}
    }
    function noise(d, vol, freq) {
      if (!on()) return;
      var c = ac(); if (!c) return;
      try {
        var n = Math.max(64, (c.sampleRate * d) | 0);
        var buf = c.createBuffer(1, n, c.sampleRate);
        var ch = buf.getChannelData(0);
        for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
        var src = c.createBufferSource(); src.buffer = buf;
        var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200;
        var g = c.createGain(); g.gain.value = vol || 0.06;
        src.connect(f); f.connect(g); g.connect(c.destination);
        src.start();
      } catch (e) {}
    }
    return {
      unlock: ac,
      whir: function (speedPx) {
        // stylus scratch — tiny filtered blip pitched by speed, caller throttles
        tone(1400 + speedPx * 1.2, .03, 'square', .012);
      },
      clear: function () { noise(.4, .09, 900); tone(300, .3, 'sine', .04, 140); }
    };
  })();

  var wrap = document.getElementById('screenWrap');
  var art = document.getElementById('art');
  var ui = document.getElementById('ui');
  var actx = art.getContext('2d');
  var uctx = ui.getContext('2d');
  var knobL = document.getElementById('knobL');
  var knobR = document.getElementById('knobR');

  var W = 640, H = 480; // logical screen size
  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  [art, ui].forEach(function (c) {
    c.width = W * dpr;
    c.height = H * dpr;
  });
  actx.scale(dpr, dpr);
  uctx.scale(dpr, dpr);

  // aluminum-powder screen background
  function paintScreen(ctx) {
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, W*0.7);
    g.addColorStop(0, 'rgba(255,255,255,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0.10)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  paintScreen(actx);

  var x = W / 2, y = H / 2;
  var keys = {};
  var SPEED = 170; // px/sec
  var rotL = 0, rotR = 0;
  var clearing = false;

  actx.strokeStyle = '#3c3c3c';
  actx.lineWidth = 2.4;
  actx.lineCap = 'round';
  actx.lineJoin = 'round';

  function mark(px, py) {
    actx.beginPath();
    actx.arc(px, py, 1.3, 0, Math.PI * 2);
    actx.fillStyle = '#3c3c3c';
    actx.fill();
  }
  mark(x, y);

  var KEYMAP = {
    ArrowLeft:  [-1, 0], ArrowRight: [1, 0],
    ArrowUp:    [0, -1], ArrowDown:  [0, 1],
    a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1]
  };

  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      clearScreen();
      return;
    }
    var k = KEYMAP[e.key] || KEYMAP[e.key.toLowerCase ? e.key.toLowerCase() : e.key];
    if (k) {
      e.preventDefault();
      keys[e.key] = true;
      if (e.key.length === 1) keys[e.key.toLowerCase()] = true;
    }
  });
  window.addEventListener('keyup', function (e) {
    delete keys[e.key];
    if (e.key.length === 1) delete keys[e.key.toLowerCase()];
  });
  window.addEventListener('blur', function () { keys = {}; });

  function held() {
    var dx = 0, dy = 0;
    for (var k in keys) {
      var m = KEYMAP[k];
      if (m) { dx += m[0]; dy += m[1]; }
    }
    return [dx, dy];
  }

  function clearScreen() {
    if (clearing) return;
    clearing = true;
    Sfx.clear();
    if (window.AAA) AAA.flash(0.15);
    wrap.classList.remove('shaking');
    void wrap.offsetWidth; // restart animation
    wrap.classList.add('shaking');
    var start = performance.now();
    (function fade(now) {
      var t = (now - start) / 450;
      if (t >= 1) {
        paintScreen(actx);
        clearing = false;
        mark(x, y);
        return;
      }
      actx.fillStyle = 'rgba(201,201,201,' + (0.16 + t * 0.10) + ')';
      actx.fillRect(0, 0, W, H);
      requestAnimationFrame(fade);
    })(start);
  }

  // shake-to-clear on devices with motion sensors
  var lastAccel = null, lastShake = 0;
  window.addEventListener('devicemotion', function (e) {
    var a = e.accelerationIncludingGravity;
    if (!a) return;
    if (lastAccel) {
      var delta = Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
      var now = Date.now();
      if (delta > 25 && now - lastShake > 800) {
        lastShake = now;
        clearScreen();
      }
    }
    lastAccel = { x: a.x, y: a.y, z: a.z };
  });

  // touch / mouse drag: stylus chases the pointer
  var pointerActive = false, pointerX = 0, pointerY = 0;
  function toLogical(e) {
    var r = ui.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) / r.width * W,
      y: (e.clientY - r.top) / r.height * H
    };
  }
  ui.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    Sfx.unlock();
    ui.setPointerCapture(e.pointerId);
    var p = toLogical(e);
    pointerActive = true; pointerX = p.x; pointerY = p.y;
  });
  ui.addEventListener('pointermove', function (e) {
    if (!pointerActive) return;
    var p = toLogical(e);
    pointerX = p.x; pointerY = p.y;
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    ui.addEventListener(ev, function () { pointerActive = false; });
  });
  document.getElementById('clearBtn').addEventListener('click', clearScreen);

  var whirAcc = 0;
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (!clearing) {
      var dx = 0, dy = 0;
      if (pointerActive) {
        var tx = pointerX - x, ty = pointerY - y;
        var td = Math.sqrt(tx * tx + ty * ty);
        if (td > 2) { dx = tx / td; dy = ty / td; }
      } else {
        var d = held();
        dx = d[0]; dy = d[1];
      }
      if (dx || dy) {
        var len = Math.sqrt(dx * dx + dy * dy);
        var stepLen = SPEED * dt;
        if (pointerActive) stepLen = Math.min(stepLen, Math.hypot(pointerX - x, pointerY - y));
        var nx = x + (dx / len) * stepLen;
        var ny = y + (dy / len) * stepLen;
        nx = Math.max(2, Math.min(W - 2, nx));
        ny = Math.max(2, Math.min(H - 2, ny));
        if (nx !== x || ny !== y) {
          actx.beginPath();
          actx.moveTo(x, y);
          actx.lineTo(nx, ny);
          actx.stroke();
          rotL += (nx - x) * 0.06;
          rotR += (ny - y) * 0.06;
          knobL.style.transform = 'rotate(' + rotL + 'rad)';
          knobR.style.transform = 'rotate(' + rotR + 'rad)';
          var moved = Math.hypot(nx - x, ny - y);
          whirAcc += moved;
          if (whirAcc > 7) { whirAcc = 0; Sfx.whir(moved / dt); }
          x = nx; y = ny;
        }
      }
    }

    // blinking stylus cursor on overlay layer
    uctx.clearRect(0, 0, W, H);
    if (Math.floor(now / 500) % 2 === 0 && !clearing) {
      uctx.beginPath();
      uctx.arc(x, y, 3.2, 0, Math.PI * 2);
      uctx.fillStyle = 'rgba(60,60,60,0.9)';
      uctx.fill();
      uctx.beginPath();
      uctx.arc(x, y, 5.5, 0, Math.PI * 2);
      uctx.strokeStyle = 'rgba(60,60,60,0.35)';
      uctx.lineWidth = 1.4;
      uctx.stroke();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
