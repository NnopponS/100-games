<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asteroids</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

var TAU = Math.PI * 2;
var TURN = 4.6;          // rad/s
var THRUST = 300;        // px/s^2
var MAXV = 450;          // px/s
var BULLET_V = 520;
var BULLET_LIFE = 1.0;
var FIRE_CD = 0.18;
var AST_R = { 3: 48, 2: 26, 1: 13 };
var AST_SCORE = { 3: 20, 2: 50, 1: 100 };

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ---------- audio (tiny WebAudio synth, no assets) ----------
var AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo) {
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function boom(size) {
  var ac = audio(); if (!ac) return;
  var dur = 0.25 + (3 - size) * 0.15;
  var buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  var src = ac.createBufferSource(); src.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
  var g = ac.createGain(); g.gain.value = 0.18;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

// ---------- state ----------
var state = 'title'; // 'title' | 'playing' | 'gameover'
var paused = false;
var score = 0, lives = 0, level = 0, nextLifeAt = 10000;
var ship = null;          // null while dead / waiting to respawn
var respawnT = 0;
var bullets = [], asteroids = [], particles = [];
var fireT = 0, hyperT = 0;
var keys = {};

function newShip() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, invuln: 2.5, thrust: false };
}

function randEdgePoint() {
  var side = (Math.random() * 4) | 0, m = 60;
  if (side === 0) return { x: -m, y: Math.random() * H };
  if (side === 1) return { x: W + m, y: Math.random() * H };
  if (side === 2) return { x: Math.random() * W, y: -m };
  return { x: Math.random() * W, y: H + m };
}

function makeAsteroid(size, x, y) {
  var r = AST_R[size];
  var sp = size === 3 ? 30 + Math.random() * 50
         : size === 2 ? 50 + Math.random() * 70
         : 80 + Math.random() * 90;
  var a = Math.random() * TAU;
  var n = 8 + ((Math.random() * 5) | 0);
  var verts = [];
  for (var i = 0; i < n; i++) verts.push(r * (0.7 + Math.random() * 0.6));
  return { x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
           r: r, size: size, rot: Math.random() * TAU,
           rotV: (Math.random() - 0.5) * 2, verts: verts };
}

function explode(x, y, n, sp) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * TAU, s = (0.3 + Math.random() * 0.7) * sp;
    var l = 0.4 + Math.random() * 0.6;
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l });
  }
}

function splitAsteroid(ast) {
  score += AST_SCORE[ast.size];
  if (score >= nextLifeAt) { lives++; nextLifeAt += 10000; tone(660, 0.2, 'square', 0.06, 1320); }
  explode(ast.x, ast.y, ast.size * 7, 160);
  boom(ast.size);
  if (ast.size > 1) {
    for (var i = 0; i < 2; i++) {
      var child = makeAsteroid(ast.size - 1, ast.x, ast.y);
      child.vx += ast.vx * 0.5; child.vy += ast.vy * 0.5;
      asteroids.push(child);
    }
  }
}

function nextLevel() {
  level++;
  var n = 3 + level;
  for (var i = 0; i < n; i++) {
    var p;
    do { p = randEdgePoint(); }
    while (ship && Math.hypot(p.x - ship.x, p.y - ship.y) < 220);
    asteroids.push(makeAsteroid(3, p.x, p.y));
  }
  tone(330, 0.12, 'square', 0.05, 660);
}

function startGame() {
  audio();
  score = 0; lives = 3; level = 0; nextLifeAt = 10000;
  bullets = []; particles = []; asteroids = [];
  respawnT = 0; paused = false;
  ship = newShip();
  nextLevel();
  state = 'playing';
}

function shoot() {
  fireT = FIRE_CD;
  bullets.push({
    x: ship.x + Math.cos(ship.a) * 16,
    y: ship.y + Math.sin(ship.a) * 16,
    vx: Math.cos(ship.a) * BULLET_V + ship.vx * 0.5,
    vy: Math.sin(ship.a) * BULLET_V + ship.vy * 0.5,
    life: BULLET_LIFE
  });
  tone(880, 0.07, 'square', 0.04, 220);
}

function killShip() {
  explode(ship.x, ship.y, 45, 240);
  boom(0);
  ship = null;
  lives--;
  respawnT = 1.6;
}

function centerSafe() {
  for (var i = 0; i < asteroids.length; i++) {
    var a = asteroids[i];
    var dx = a.x - W / 2, dy = a.y - H / 2;
    if (dx * dx + dy * dy < (a.r + 90) * (a.r + 90)) return false;
  }
  return true;
}

function wrap(o, m) {
  if (o.x < -m) o.x += W + 2 * m; else if (o.x > W + m) o.x -= W + 2 * m;
  if (o.y < -m) o.y += H + 2 * m; else if (o.y > H + m) o.y -= H + 2 * m;
}

// ---------- input ----------
window.addEventListener('keydown', function (e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (state === 'title' && (e.code === 'Enter' || e.code === 'Space')) { startGame(); return; }
  if (state === 'gameover' && (e.code === 'Enter' || e.code === 'KeyR' || e.code === 'Space')) { startGame(); return; }
  if (e.code === 'KeyP' && state === 'playing') { paused = !paused; return; }
  if ((e.code === 'ShiftLeft' || e.code === 'ShiftRight') &&
      state === 'playing' && !paused && ship && hyperT <= 0) {
    hyperT = 1.2;
    explode(ship.x, ship.y, 15, 120);
    ship.x = Math.random() * W; ship.y = Math.random() * H;
    ship.vx *= 0.3; ship.vy *= 0.3;
    explode(ship.x, ship.y, 15, 120);
    tone(200, 0.2, 'sine', 0.06, 900);
  }
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { for (var k in keys) keys[k] = false; });

// ---------- update ----------
function update(dt) {
  fireT -= dt; hyperT -= dt;

  var i, a, b;
  for (i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(function (q) { return q.life > 0; });

  for (i = 0; i < asteroids.length; i++) {
    a = asteroids[i];
    a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.rotV * dt;
    wrap(a, a.r);
  }

  if (state !== 'playing' || paused) return;

  if (ship) {
    if (keys.ArrowLeft || keys.KeyA) ship.a -= TURN * dt;
    if (keys.ArrowRight || keys.KeyD) ship.a += TURN * dt;
    ship.thrust = !!(keys.ArrowUp || keys.KeyW);
    if (ship.thrust) {
      ship.vx += Math.cos(ship.a) * THRUST * dt;
      ship.vy += Math.sin(ship.a) * THRUST * dt;
    }
    var damp = Math.pow(0.998, dt * 60);
    ship.vx *= damp; ship.vy *= damp;
    var v = Math.hypot(ship.vx, ship.vy);
    if (v > MAXV) { ship.vx *= MAXV / v; ship.vy *= MAXV / v; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    wrap(ship, 0);
    if (ship.invuln > 0) ship.invuln -= dt;
    if (keys.Space && fireT <= 0) shoot();
  } else {
    respawnT -= dt;
    if (respawnT <= 0) {
      if (lives <= 0) state = 'gameover';
      else if (centerSafe()) ship = newShip();
      else respawnT = 0.3;
    }
  }

  for (i = 0; i < bullets.length; i++) {
    b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    wrap(b, 0);
  }
  bullets = bullets.filter(function (q) { return q.life > 0; });

  // bullets vs asteroids
  for (i = asteroids.length - 1; i >= 0; i--) {
    a = asteroids[i];
    var hit = false;
    for (var j = bullets.length - 1; j >= 0; j--) {
      b = bullets[j];
      var dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < a.r * a.r) { bullets.splice(j, 1); hit = true; break; }
    }
    if (hit) { asteroids.splice(i, 1); splitAsteroid(a); }
  }

  // ship vs asteroids
  if (ship && ship.invuln <= 0) {
    for (i = asteroids.length - 1; i >= 0; i--) {
      a = asteroids[i];
      var ddx = a.x - ship.x, ddy = a.y - ship.y;
      var rr = a.r + 9;
      if (ddx * ddx + ddy * ddy < rr * rr) { killShip(); break; }
    }
  }

  if (asteroids.length === 0) nextLevel();
}

// ---------- draw ----------
function shipPath() {
  ctx.beginPath();
  ctx.moveTo(0, -15); ctx.lineTo(10, 11); ctx.lineTo(4, 7);
  ctx.lineTo(-4, 7); ctx.lineTo(-10, 11); ctx.closePath();
}

function centerText(t, y, size) {
  ctx.font = size + 'px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(t, W / 2, y);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.4;

  var i;
  for (i = 0; i < asteroids.length; i++) {
    var a = asteroids[i];
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    ctx.beginPath();
    var n = a.verts.length;
    for (var k = 0; k < n; k++) {
      var ang = k / n * TAU;
      var px = Math.cos(ang) * a.verts[k], py = Math.sin(ang) * a.verts[k];
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = '#fff';
  for (i = 0; i < bullets.length; i++) {
    var b = bullets[i];
    ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3);
  }

  for (i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }
  ctx.globalAlpha = 1;

  if (ship && state === 'playing') {
    var blink = ship.invuln > 0 && (((ship.invuln * 12) | 0) % 2 === 0);
    if (!blink) {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.a + Math.PI / 2);
      shipPath();
      ctx.stroke();
      if (ship.thrust) {
        ctx.beginPath();
        ctx.moveTo(-4, 9);
        ctx.lineTo(0, 15 + Math.random() * 7);
        ctx.lineTo(4, 9);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '22px "Courier New", monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('SCORE ' + score, 20, 16);
  ctx.textAlign = 'right';
  ctx.fillText('LEVEL ' + Math.max(level, 1), W - 20, 16);
  ctx.textAlign = 'left';
  for (i = 0; i < lives; i++) {
    ctx.save();
    ctx.translate(32 + i * 26, 60);
    ctx.scale(0.6, 0.6);
    shipPath();
    ctx.stroke();
    ctx.restore();
  }

  if (state === 'title') {
    centerText('ASTEROIDS', H / 2 - 80, 64);
    centerText('ARROWS / WASD: ROTATE + THRUST', H / 2 + 10, 18);
    centerText('SPACE: FIRE    SHIFT: HYPERSPACE    P: PAUSE', H / 2 + 40, 18);
    centerText('PRESS ENTER TO START', H / 2 + 95, 22);
  } else if (state === 'gameover') {
    centerText('GAME OVER', H / 2 - 40, 56);
    centerText('SCORE ' + score, H / 2 + 15, 24);
    centerText('PRESS ENTER TO PLAY AGAIN', H / 2 + 60, 18);
  } else if (paused) {
    centerText('PAUSED', H / 2, 48);
  }
}

// title-screen attract mode: a few drifting asteroids
for (var t = 0; t < 5; t++) {
  asteroids.push(makeAsteroid(3, Math.random() * W, Math.random() * H));
}

var last = performance.now();
function frame(now) {
  var dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
