<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doodle Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,220,180,.14), transparent 55%),
      linear-gradient(160deg, #14231d 0%, #0a120e 75%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    letter-spacing: 4px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #7de8b8;
    text-shadow: 0 0 22px rgba(120,220,180,.45);
  }

  .hud { display: flex; gap: 10px; margin-bottom: 8px; }
  .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    padding: 5px 14px;
    min-width: 84px;
    text-align: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .58rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8fd8b8; }
  .stat .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  #best { color: #ffd166; }

  #wrap { position: relative; width: min(96vw, 420px); }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(120,220,180,.1);
    touch-action: none;
  }

  #screen {
    position: absolute; inset: 0;
    border-radius: 12px;
    background: rgba(8,16,12,.87);
    backdrop-filter: blur(3px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; text-align: center; padding: 18px;
  }
  #screen.hidden { display: none; }
  #screen h2 { font-size: clamp(1.5rem, 6vw, 2.1rem); color: #7de8b8; text-shadow: 0 0 24px rgba(120,232,184,.6); margin-bottom: 10px; }
  #screen p { color: #b8d8c8; margin-bottom: 8px; line-height: 1.55; font-size: .95rem; }
  #screen .best-line { color: #ffd166; font-size: .88rem; margin-bottom: 18px; }
  #screen button {
    background: linear-gradient(135deg, #7de8b8, #4fc890);
    color: #0a1a12; border: none; border-radius: 999px;
    padding: 13px 36px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 0 22px rgba(120,232,184,.45), 0 3px 0 #389a6a;
    transition: transform .12s;
  }
  #screen button:hover { transform: scale(1.05); }

  .hint { margin-top: 8px; font-size: .78rem; color: #6a8a78; text-align: center; }
 .hint .karr { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; }
</style>
</head>
<body>

<h1>DOODLE JUMP</h1>
<div class="hud">
  <div class="stat"><span class="label">Height</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
</div>
<div id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="screen">
    <h2>DOODLE JUMP</h2>
    <p>Bounce forever upward.<br>Green springs launch you sky-high.<br>Watch out — cracked platforms break!</p>
    <p class="best-line" id="screenBest"></p>
    <button id="startBtn">JUMP (Space)</button>
  </div>
</div>
<div class="hint"><span class="kb"><svg class="karr" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><svg class="karr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg> or A/D to steer</span><span class="tc">Touch &amp; hold left/right side to steer</span></div>
<style>
  @media (pointer: coarse) { .hint .kb { display: none; } }
  @media (pointer: fine) { .hint .tc { display: none; } }
</style>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  if (!ctx.roundRect) {
    ctx.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
      this.closePath(); return this;
    };
  }
  var W = canvas.width, H = canvas.height;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var screen = document.getElementById('screen');
  var screenBest = document.getElementById('screenBest');

  var best = 0;
  try { best = parseInt(localStorage.getItem('doodle_best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;
  screenBest.textContent = best > 0 ? 'Best: ' + best + 'm' : '';

  var doodle, plats, camY, score, playing, parts, springs;
  var keys = {}, steerTouch = 0;
  var GRAV = 1400, JUMP = 780, SPRING_JUMP = 1450;

  // ---------- audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, f) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var len = Math.floor(c.sampleRate * d);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f || 800;
    var g = c.createGain(); g.gain.setValueAtTime(v || 0.06, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(c.destination); src.start(t);
  }
  var sfx = {
    jump:   function () { tone(300, 0.09, 'sine', 0.05, 560); },
    spring: function () { tone(220, 0.24, 'triangle', 0.07, 1100); tone(880, 0.16, 'sine', 0.04, null, 0.06); },
    break_: function () { noiseSfx(0.18, 0.08, 700); tone(200, 0.12, 'sawtooth', 0.04, 90); },
    land:   function () { noiseSfx(0.05, 0.03, 900); },
    fall:   function () { tone(500, 0.5, 'sine', 0.06, 120); },
    start:  function () { [392, 523, 659].forEach(function (f, i) { tone(f, 0.1, 'triangle', 0.06, null, i * 0.07); }); }
  };
  var bgm = {
    t: null, step: 0,
    seq: [262, 0, 330, 0, 392, 330, 0, 262, 294, 0, 349, 0, 440, 392, 330, 0],
    start: function () { this.stop(); var s = this; this.t = setInterval(function () { s.tickB(); }, 380); },
    tickB: function () {
      var c = ac(); if (!c || c.state !== 'running') return;
      try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
      var n = this.seq[this.step++ % 16];
      if (n) tone(n, 0.28, 'sine', 0.024);
    },
    stop: function () { if (this.t) clearInterval(this.t); this.t = null; }
  };

  var clouds = [];
  for (var i = 0; i < 8; i++) {
    clouds.push({ x: Math.random() * W, y: Math.random() * H, s: 20 + Math.random() * 30, depth: 0.3 + Math.random() * 0.5 });
  }

  function addPlat(y) {
    // difficulty: more moving/cracked platforms higher up
    var diff = Math.min(1, score / 4000);
    var kind = 'normal';
    var r = Math.random();
    if (r < 0.12 + diff * 0.18) kind = 'moving';
    else if (r < 0.12 + diff * 0.18 + 0.08 + diff * 0.14) kind = 'cracked';
    var p = { x: 30 + Math.random() * (W - 100), y: y, w: 74, h: 16, kind: kind, vx: 0, broken: false, spring: false };
    if (kind === 'moving') p.vx = (Math.random() < .5 ? -1 : 1) * (50 + diff * 70);
    if (kind === 'normal' && Math.random() < 0.09) p.spring = true;
    plats.push(p);
  }

  function reset() {
    doodle = { x: W / 2, y: H - 120, vx: 0, vy: -JUMP * 0.8, w: 34, h: 34, face: 1, squash: 0 };
    plats = []; parts = [];
    camY = 0; score = 0;
    // base platform
    plats.push({ x: W / 2 - 40, y: H - 60, w: 80, h: 16, kind: 'normal', vx: 0, broken: false, spring: false });
    var y = H - 60;
    while (y > -200) {
      y -= 60 + Math.random() * 40;
      addPlat(y);
    }
    scoreEl.textContent = '0';
  }

  function poof(x, y, color) {
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 90;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: .35 + Math.random() * .3, color: color, r: 1.5 + Math.random() * 2 });
    }
  }

  function addScore() {
    var s = Math.floor(-camY / 10);
    if (s > score) { score = s; scoreEl.textContent = score; }
    if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('doodle_best', String(best)); } catch (e) {} }
  }

  function gameOver() {
    playing = false;
    bgm.stop();
    sfx.fall();
    screen.querySelector('h2').textContent = 'GAME OVER';
    screen.querySelector('p').innerHTML = 'You climbed <b style="color:#7de8b8">' + score + 'm</b>';
    screenBest.textContent = score >= best && score > 0 ? 'NEW BEST!' : 'Best: ' + best + 'm';
    screen.querySelector('button').textContent = 'RETRY (Space)';
    screen.classList.remove('hidden');
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.035, (now - last) / 1000);
    last = now;
    requestAnimationFrame(loop);
    if (playing) update(dt);
    draw();
  }

  function update(dt) {
    var steer = 0;
    if (keys.ArrowLeft || keys.a) steer -= 1;
    if (keys.ArrowRight || keys.d) steer += 1;
    steer += steerTouch;
    doodle.vx = steer * 320;
    if (steer !== 0) doodle.face = steer > 0 ? 1 : -1;

    doodle.vy += GRAV * dt;
    doodle.x += doodle.vx * dt;
    doodle.y += doodle.vy * dt;
    doodle.squash = Math.max(0, doodle.squash - dt * 6);

    // wrap horizontally
    if (doodle.x < -20) doodle.x = W + 20;
    if (doodle.x > W + 20) doodle.x = -20;

    // camera follows upward
    var target = doodle.y - H * 0.42;
    if (target < camY) camY = target;
    addScore();

    // landing on platforms (only while falling)
    if (doodle.vy > 0) {
      for (var i = 0; i < plats.length; i++) {
        var p = plats[i];
        if (p.broken) continue;
        var py = p.y - camY;
        var prevBottom = doodle.y - doodle.vy * dt + doodle.h / 2;
        var bottom = doodle.y + doodle.h / 2;
        if (prevBottom <= p.y && bottom >= p.y &&
            doodle.x + 14 > p.x && doodle.x - 14 < p.x + p.w) {
          if (p.kind === 'cracked') {
            p.broken = true;
            sfx.break_();
            poof(doodle.x, p.y, '#a8907a');
            continue;
          }
          var jv = p.spring ? SPRING_JUMP : JUMP;
          doodle.vy = -jv;
          doodle.squash = 1;
          if (p.spring) { sfx.spring(); poof(doodle.x, p.y, '#ffd166'); }
          else sfx.jump();
        }
      }
    }

    // moving platforms
    plats.forEach(function (p) {
      if (p.kind === 'moving') {
        p.x += p.vx * dt;
        if (p.x < 0 || p.x + p.w > W) p.vx *= -1;
      }
    });

    // generate + cull platforms
    var topY = plats.reduce(function (m, p) { return Math.min(m, p.y); }, Infinity);
    while (topY > camY - 120) {
      topY -= 60 + Math.random() * 40;
      addPlat(topY);
    }
    plats = plats.filter(function (p) { return p.y - camY < H + 60; });

    for (var i = parts.length - 1; i >= 0; i--) {
      var pt = parts[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 300 * dt; pt.life -= dt;
      if (pt.life <= 0) parts.splice(i, 1);
    }

    if (doodle.y - camY > H + 60) gameOver();
  }

  function drawDoodle(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(doodle.face, 1);
    var sq = 1 - doodle.squash * 0.22;
    ctx.scale(1 / sq, sq);
    // body
    ctx.fillStyle = '#7de8b8';
    ctx.shadowColor = '#7de8b8'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 17, 0, 0, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    // belly
    ctx.fillStyle = '#baf5d8';
    ctx.beginPath(); ctx.ellipse(2, 5, 9, 9, 0, 0, 7); ctx.fill();
    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5, -8, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#0a1a12';
    ctx.beginPath(); ctx.arc(6.5, -8, 2.4, 0, 7); ctx.fill();
    // feet
    ctx.fillStyle = '#4fc890';
    ctx.beginPath(); ctx.ellipse(-5, 16, 5, 3, 0, 0, 7); ctx.ellipse(7, 16, 5, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function draw() {
    // sky gradient shifts with height
    var t = Math.min(1, score / 3000);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(' + (16 - t * 8) + ',' + (30 - t * 14) + ',' + (46 + t * 10) + ')');
    g.addColorStop(1, 'rgb(' + (10 - t * 5) + ',' + (18 - t * 8) + ',' + (30 + t * 16) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // parallax clouds/stars
    clouds.forEach(function (c) {
      var cy = ((c.y + camY * c.depth) % (H + 80) + H + 80) % (H + 80) - 40;
      ctx.fillStyle = 'rgba(255,255,255,.07)';
      ctx.beginPath();
      ctx.ellipse(c.x, cy, c.s, c.s * 0.5, 0, 0, 7);
      ctx.ellipse(c.x - c.s * .6, cy + 4, c.s * .6, c.s * .35, 0, 0, 7);
      ctx.ellipse(c.x + c.s * .6, cy + 4, c.s * .6, c.s * .35, 0, 0, 7);
      ctx.fill();
    });

    // platforms
    plats.forEach(function (p) {
      if (p.broken) return;
      var y = p.y - camY;
      if (p.kind === 'moving') { ctx.fillStyle = '#5aa8e8'; ctx.shadowColor = '#5aa8e8'; }
      else if (p.kind === 'cracked') { ctx.fillStyle = '#a8907a'; ctx.shadowColor = '#a8907a'; }
      else { ctx.fillStyle = '#7de8b8'; ctx.shadowColor = '#7de8b8'; }
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.roundRect(p.x, y, p.w, p.h, 8); ctx.fill();
      ctx.shadowBlur = 0;
      if (p.kind === 'cracked') {
        ctx.strokeStyle = 'rgba(60,40,20,.6)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(p.x + p.w * .3, y + 2); ctx.lineTo(p.x + p.w * .45, y + 13);
        ctx.moveTo(p.x + p.w * .6, y + 1); ctx.lineTo(p.x + p.w * .5, y + 14);
        ctx.stroke();
      }
      if (p.spring) {
        ctx.fillStyle = '#ffd166';
        ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.roundRect(p.x + p.w / 2 - 10, y - 12, 20, 12, 4); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#a87820';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (var k = 0; k < 3; k++) {
          ctx.moveTo(p.x + p.w / 2 - 8, y - 2 - k * 4);
          ctx.lineTo(p.x + p.w / 2 + 8, y - 4 - k * 4);
        }
        ctx.stroke();
      }
    });

    // particles
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.min(1, p.life * 2.4);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.r, p.y - camY - p.r, p.r * 2, p.r * 2);
    });
    ctx.globalAlpha = 1;

    if (doodle) drawDoodle(doodle.x, doodle.y - camY);
  }

  document.addEventListener('keydown', function (e) {
    keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && !playing && !screen.classList.contains('hidden')) { startGame(); e.preventDefault(); }
    if (e.key === ' ') e.preventDefault();
  });
  document.addEventListener('keyup', function (e) { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault(); ac();
    var r = canvas.getBoundingClientRect();
    steerTouch = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (steerTouch === 0) return;
    var r = canvas.getBoundingClientRect();
    steerTouch = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
  });
  canvas.addEventListener('pointerup', function () { steerTouch = 0; });
  canvas.addEventListener('pointercancel', function () { steerTouch = 0; });

  function startGame() {
    ac();
    reset();
    playing = true;
    bgm.start();
    sfx.start();
    screen.classList.add('hidden');
  }
  screen.querySelector('button').addEventListener('click', startGame);

  reset();
  requestAnimationFrame(loop);

  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":15,"label":"Height reached","goals":[400,1000,2000],"note":"Climb by chaining platform landings; only your highest altitude counts."}, { read: () => { return (score || 0); } });
})();
</script>


<script src="../assets/aaa-arcade.js?v=3" defer></script>
<script src="../assets/missions.js" defer></script>
</body>
</html>
