<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #e0e0ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .wrap {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    color: #7df9ff;
    margin-bottom: 12px;
    text-align: center;
  }
  canvas {
    border: 2px solid #333;
    background: #111;
    display: block;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 150px;
  }
  .panel {
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .panel .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-bottom: 4px;
  }
  .panel .value {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
  }
  #nextCanvas {
    border: none;
    background: transparent;
    margin: 0 auto;
  }
  .controls {
    font-size: 12px;
    line-height: 1.8;
    color: #999;
  }
  .controls kbd {
    background: #2a2a44;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    color: #ccc;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 40px; color: #ff5f7a; letter-spacing: 3px; }
  #overlay p { color: #ccc; }
  #overlay button {
    background: #7df9ff;
    color: #0f0f1a;
    border: none;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #overlay button:hover { background: #b3fcff; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>TETRIS</h1>
    <canvas id="board" width="300" height="600"></canvas>
  </div>
  <div class="sidebar">
    <div class="panel">
      <div class="label">Next</div>
      <canvas id="nextCanvas" width="120" height="80"></canvas>
    </div>
    <div class="panel">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel">
      <div class="label">Level</div>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel">
      <div class="label">Lines</div>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel controls">
      <div class="label">Controls</div>
      <div style="text-align:left">
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move<br>
        <kbd>&darr;</kbd> soft drop<br>
        <kbd>&uarr;</kbd> rotate<br>
        <kbd>Space</kbd> hard drop<br>
        <kbd>R</kbd> restart
      </div>
    </div>
  </div>
</div>

<div id="overlay">
  <h2 id="overlayTitle">GAME OVER</h2>
  <p id="overlayScore"></p>
  <button id="restartBtn">RESTART</button>
</div>

<script>
(function() {
  const COLS = 10, ROWS = 20, CELL = 30;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('nextCanvas');
  const nctx = nextCanvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const overlay = document.getElementById('overlay');
  const overlayScore = document.getElementById('overlayScore');

  const SHAPES = {
    I: [[1,1,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]],
    O: [[1,1],[1,1]],
    S: [[0,1,1],[1,1,0]],
    T: [[0,1,0],[1,1,1]],
    Z: [[1,1,0],[0,1,1]]
  };
  const COLORS = {
    I:'#00f0f0', J:'#0036f0', L:'#f0a000', O:'#f0f000',
    S:'#00f000', T:'#a000f0', Z:'#f00000'
  };
  const SCORE_TABLE = [0, 100, 300, 500, 800];

  let grid, piece, nextPiece, score, level, lines, dropInterval, dropTimer, lastTime, gameOver, bag;

  function newBag() {
    const keys = Object.keys(SHAPES);
    for (let i = keys.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [keys[i], keys[j]] = [keys[j], keys[i]];
    }
    return keys;
  }

  function randomType() {
    if (bag.length === 0) bag = newBag();
    return bag.pop();
  }

  function spawn(type) {
    const matrix = SHAPES[type].map(r => r.slice());
    return {
      type,
      matrix,
      x: Math.floor((COLS - matrix[0].length) / 2),
      y: 0
    };
  }

  function collides(matrix, px, py) {
    for (let y = 0; y < matrix.length; y++) {
      for (let x = 0; x < matrix[y].length; x++) {
        if (!matrix[y][x]) continue;
        const gx = px + x, gy = py + y;
        if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
        if (gy >= 0 && grid[gy][gx]) return true;
      }
    }
    return false;
  }

  function merge() {
    piece.matrix.forEach((row, y) => row.forEach((v, x) => {
      if (v && piece.y + y >= 0) grid[piece.y + y][piece.x + x] = piece.type;
    }));
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(v => v)) {
        grid.splice(y, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared) {
      score += SCORE_TABLE[cleared] * level;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(50, 800 - (level - 1) * 70);
      updateHUD();
    }
  }

  function rotate(matrix) {
    return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
  }

  function tryRotate() {
    const rotated = rotate(piece.matrix);
    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collides(rotated, piece.x + kick, piece.y)) {
        piece.matrix = rotated;
        piece.x += kick;
        return;
      }
    }
  }

  function move(dx) {
    if (!collides(piece.matrix, piece.x + dx, piece.y)) piece.x += dx;
  }

  function softDrop() {
    if (!collides(piece.matrix, piece.x, piece.y + 1)) {
      piece.y++;
      score += 1;
      updateHUD();
    } else {
      lockPiece();
    }
    dropTimer = 0;
  }

  function hardDrop() {
    let d = 0;
    while (!collides(piece.matrix, piece.x, piece.y + 1)) { piece.y++; d++; }
    score += d * 2;
    lockPiece();
    dropTimer = 0;
  }

  function lockPiece() {
    merge();
    clearLines();
    piece = spawn(nextPiece);
    nextPiece = randomType();
    if (collides(piece.matrix, piece.x, piece.y)) {
      endGame();
    }
    drawNext();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = lines;
  }

  function drawCell(c, x, y, color) {
    c.fillStyle = color;
    c.fillRect(x * CELL, y * CELL, CELL, CELL);
    c.strokeStyle = 'rgba(0,0,0,0.4)';
    c.lineWidth = 2;
    c.strokeRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
    c.fillStyle = 'rgba(255,255,255,0.15)';
    c.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, 6);
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let x = 1; x < COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
    }
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x]) drawCell(ctx, x, y, COLORS[grid[y][x]]);

    // ghost piece
    if (piece && !gameOver) {
      let gy = piece.y;
      while (!collides(piece.matrix, piece.x, gy + 1)) gy++;
      ctx.globalAlpha = 0.2;
      piece.matrix.forEach((row, y) => row.forEach((v, x) => {
        if (v && gy + y >= 0) drawCell(ctx, piece.x + x, gy + y, COLORS[piece.type]);
      }));
      ctx.globalAlpha = 1;
      piece.matrix.forEach((row, y) => row.forEach((v, x) => {
        if (v && piece.y + y >= 0) drawCell(ctx, piece.x + x, piece.y + y, COLORS[piece.type]);
      }));
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const m = SHAPES[nextPiece];
    const bs = 20;
    const ox = (nextCanvas.width - m[0].length * bs) / 2;
    const oy = (nextCanvas.height - m.length * bs) / 2;
    m.forEach((row, y) => row.forEach((v, x) => {
      if (v) {
        nctx.fillStyle = COLORS[nextPiece];
        nctx.fillRect(ox + x * bs, oy + y * bs, bs, bs);
        nctx.strokeStyle = 'rgba(0,0,0,0.4)';
        nctx.strokeRect(ox + x * bs + 1, oy + y * bs + 1, bs - 2, bs - 2);
      }
    }));
  }

  function endGame() {
    gameOver = true;
    overlayScore.textContent = 'Score: ' + score;
    overlay.classList.add('show');
  }

  function reset() {
    grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
    bag = newBag();
    score = 0; level = 1; lines = 0;
    dropInterval = 800; dropTimer = 0; lastTime = 0;
    gameOver = false;
    nextPiece = randomType();
    piece = spawn(randomType());
    overlay.classList.remove('show');
    updateHUD();
    drawNext();
  }

  function loop(time) {
    if (!gameOver) {
      const dt = time - lastTime;
      lastTime = time;
      dropTimer += dt;
      if (dropTimer >= dropInterval) {
        dropTimer = 0;
        if (!collides(piece.matrix, piece.x, piece.y + 1)) piece.y++;
        else lockPiece();
      }
      draw();
    }
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    if (gameOver) return;
    switch (e.key) {
      case 'ArrowLeft': move(-1); break;
      case 'ArrowRight': move(1); break;
      case 'ArrowDown': softDrop(); break;
      case 'ArrowUp': tryRotate(); break;
      case ' ': hardDrop(); break;
      default: return;
    }
    e.preventDefault();
    draw();
  });

  document.getElementById('restartBtn').addEventListener('click', reset);

  reset();
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
