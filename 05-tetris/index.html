<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse at 50% -10%, rgba(125,249,255,.1), transparent 55%),
      radial-gradient(ellipse at 50% 115%, rgba(168,85,247,.1), transparent 55%),
      #08070f;
    color: #e0e0ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    touch-action: none;
    padding: 8px;
  }
  .wrap {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  h1 {
    font-size: clamp(22px, 6vw, 30px);
    letter-spacing: 6px;
    color: #7df9ff;
    margin-bottom: 10px;
    text-align: center;
    text-shadow: 0 0 22px rgba(125,249,255,.6), 0 0 50px rgba(125,249,255,.2);
  }
  canvas#board {
    border: 1px solid rgba(125,249,255,.35);
    border-radius: 8px;
    background: #0a0a14;
    display: block;
    box-shadow: 0 0 34px rgba(125,249,255,.12), inset 0 0 50px rgba(0,0,0,.55);
    touch-action: none;
    max-width: 68vw;
    max-height: 74dvh;
    width: auto;
    height: auto;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 140px;
  }
  .panel {
    background: rgba(20,20,38,.8);
    border: 1px solid rgba(125,249,255,.18);
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    box-shadow: inset 0 0 18px rgba(0,0,0,.4);
  }
  .panel .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: #6d6d94;
    margin-bottom: 4px;
  }
  .panel .value {
    font-size: 21px;
    font-weight: bold;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 10px rgba(125,249,255,.4);
  }
  #best.value { color: #ffd76a; text-shadow: 0 0 10px rgba(255,215,106,.5); }
  #nextCanvas {
    border: none;
    background: transparent;
    margin: 0 auto;
    display: block;
  }
  .controls {
    font-size: 11px;
    line-height: 1.9;
    color: #7d7d9e;
  }
  .controls kbd {
    background: #23233f;
    border: 1px solid #3a3a5a;
    border-bottom-width: 3px;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: monospace;
    color: #ccc;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,4,12,0.78);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    font-size: clamp(32px, 9vw, 44px);
    color: #ff5f7a;
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(255,95,122,.7);
  }
  #overlay p { color: #bbbcd4; font-size: 1.05rem; }
  #overlay .newbest { color: #ffd76a; font-weight: 800; letter-spacing: 2px; }
  #overlay button {
    background: linear-gradient(135deg, #7df9ff, #38bdf8);
    color: #08070f;
    border: none;
    padding: 13px 38px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(125,249,255,.45);
    transition: transform .12s;
  }
  #overlay button:hover { transform: scale(1.06); }

  /* touch controls — visible on coarse pointers */
  #touchpad {
    display: none;
    gap: 8px;
    margin-top: 10px;
    justify-content: center;
  }
  #touchpad button {
    flex: 0 0 auto;
    width: 54px; height: 54px;
    border-radius: 14px;
    border: 1px solid rgba(125,249,255,.35);
    background: rgba(20,22,44,.85);
    color: #7df9ff;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-shadow: 0 3px 0 rgba(125,249,255,.2);
  }
  #touchpad button:active { transform: translateY(2px); box-shadow: none; background: rgba(60,80,140,.9); }
  @media (pointer: coarse) {
    #touchpad { display: flex; }
    .controls { display: none; }
    .wrap { gap: 12px; }
    .sidebar { width: 104px; gap: 8px; }
    .panel { padding: 7px; }
    .panel .value { font-size: 17px; }
  }
  @media (max-width: 480px) {
    .wrap { gap: 10px; }
    .sidebar { width: 96px; }
  }
</style>
</head>
<body>
<div>
  <h1>TETRIS</h1>
  <div class="wrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="sidebar">
      <div class="panel">
        <div class="label">Next</div>
        <canvas id="nextCanvas" width="96" height="64"></canvas>
      </div>
      <div class="panel">
        <div class="label">Score</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="panel">
        <div class="label">Best</div>
        <div class="value" id="best">0</div>
      </div>
      <div class="panel">
        <div class="label">Level</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="panel">
        <div class="label">Lines</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="panel controls">
        <div class="label">Controls</div>
        <div style="text-align:left">
          <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move<br>
          <kbd>&darr;</kbd> soft drop<br>
          <kbd>&uarr;</kbd> rotate<br>
          <kbd>Space</kbd> hard drop<br>
          <kbd>R</kbd> restart
        </div>
      </div>
    </div>
  </div>
  <div id="touchpad">
    <button data-k="left" aria-label="Left">&#9664;</button>
    <button data-k="rotate" aria-label="Rotate">&#8635;</button>
    <button data-k="right" aria-label="Right">&#9654;</button>
    <button data-k="down" aria-label="Soft drop">&#9660;</button>
    <button data-k="drop" aria-label="Hard drop">&#10515;</button>
  </div>
</div>

<div id="overlay">
  <h2 id="overlayTitle">GAME OVER</h2>
  <p id="overlayScore"></p>
  <p class="newbest" id="overlayBest"></p>
  <button id="restartBtn">RESTART</button>
</div>

<script>
(function() {
'use strict';
const COLS = 10, ROWS = 20, CELL = 30;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nctx = nextCanvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const linesEl = document.getElementById('lines');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayScore = document.getElementById('overlayScore');
const overlayBest = document.getElementById('overlayBest');

const SHAPES = {
  I: [[1,1,1,1]],
  J: [[1,0,0],[1,1,1]],
  L: [[0,0,1],[1,1,1]],
  O: [[1,1],[1,1]],
  S: [[0,1,1],[1,1,0]],
  T: [[0,1,0],[1,1,1]],
  Z: [[1,1,0],[0,1,1]]
};
const COLORS = {
  I:'#22e6e6', J:'#4d7bff', L:'#ff9f2e', O:'#ffe14d',
  S:'#3ef26e', T:'#c25bff', Z:'#ff4d5e'
};
const SCORE_TABLE = [0, 100, 300, 500, 800];

let grid, piece, nextPiece, score, level, lines, dropInterval, dropTimer, lastTime, gameOver, bag;
let best = 0, clearAnim = null, particles = [], popups = [], shake = 0, animT = 0;

try { best = parseInt(localStorage.getItem('tetris_best'), 10) || 0; } catch (e) {}
bestEl.textContent = best;

// ---------- AAA audio ----------
let ACX = null;
function ac() {
  try {
    if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
    if (ACX.state === 'suspended') ACX.resume();
  } catch (e) {}
  return ACX;
}
function tone(f, d, type, v, slide, delay) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (delay || 0);
  try {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v || 0.05, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + d + 0.03);
  } catch (e) {}
}
function noiseSfx(d, v, fc) {
  const c = ac(); if (!c) return;
  try {
    const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
    const g = c.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  } catch (e) {}
}
const sfx = {
  move:   () => tone(240, 0.03, 'square', 0.02, 300),
  rotate: () => tone(340, 0.05, 'square', 0.035, 480),
  lock:   () => { tone(180, 0.06, 'triangle', 0.05, 120); noiseSfx(0.04, 0.03, 800); },
  hard:   () => { noiseSfx(0.1, 0.12, 500); tone(140, 0.1, 'triangle', 0.08, 70); },
  clear:  (n) => { const base = [523, 587, 659, 784][Math.min(n - 1, 3)]; for (let i = 0; i <= n; i++) tone(base + i * 130, 0.1, 'triangle', 0.06, null, i * 0.05); },
  tetris: () => { [784, 988, 1175, 1568, 1175, 1568].forEach((f, i) => tone(f, 0.12, 'square', 0.06, null, i * 0.07)); },
  levelup:() => { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, null, i * 0.08)); },
  over:   () => { [392, 330, 262, 196, 131].forEach((f, i) => tone(f, 0.22, 'sawtooth', 0.05, null, i * 0.13)); }
};
// chiptune loop — minor-key arp + bass, extra layer at level 5+
const bgm = {
  t: null, step: 0,
  bass: [55, 0, 55, 0, 65.4, 0, 49, 0, 55, 0, 55, 0, 73.4, 65.4, 49, 0],
  arp:  [220, 261.6, 329.6, 261.6, 220, 261.6, 329.6, 392, 220, 261.6, 329.6, 261.6, 246.9, 293.7, 392, 329.6],
  start() {
    this.stop(); this.step = 0;
    this.t = setInterval(() => this.tickB(), 150);
  },
  tickB() {
    const c = ac(); if (!c || c.state !== 'running') return;
    try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
    const st = this.step++;
    const b = this.bass[st % 16];
    if (b) tone(b, 0.24, 'triangle', 0.038);
    tone(this.arp[st % 16], 0.09, 'square', 0.014);
    if (level >= 5 && st % 4 === 0) tone(this.arp[st % 16] * 2, 0.06, 'square', 0.01);
  },
  stop() { if (this.t) clearInterval(this.t); this.t = null; }
};

function newBag() {
  const keys = Object.keys(SHAPES);
  for (let i = keys.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  return keys;
}

function randomType() {
  if (bag.length === 0) bag = newBag();
  return bag.pop();
}

function spawn(type) {
  const matrix = SHAPES[type].map(r => r.slice());
  return {
    type,
    matrix,
    x: Math.floor((COLS - matrix[0].length) / 2),
    y: 0
  };
}

function collides(matrix, px, py) {
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < matrix[y].length; x++) {
      if (!matrix[y][x]) continue;
      const gx = px + x, gy = py + y;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy >= 0 && grid[gy][gx]) return true;
    }
  }
  return false;
}

function merge() {
  piece.matrix.forEach((row, y) => row.forEach((v, x) => {
    if (v && piece.y + y >= 0) grid[piece.y + y][piece.x + x] = piece.type;
  }));
}

function clearLines() {
  const clearedRows = [];
  for (let y = ROWS - 1; y >= 0; y--) {
    if (grid[y].every(v => v)) clearedRows.push(y);
  }
  if (!clearedRows.length) return;

  const n = clearedRows.length;
  score += SCORE_TABLE[n] * level;
  lines += n;
  const newLevel = Math.floor(lines / 10) + 1;
  if (newLevel > level) { level = newLevel; sfx.levelup(); }
  dropInterval = Math.max(50, 800 - (level - 1) * 70);
  updateHUD();

  // burst particles per cleared row + animation flash
  clearedRows.forEach(ry => {
    for (let x = 0; x < COLS; x++) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x * CELL + CELL / 2, y: ry * CELL + CELL / 2,
          vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3 - 0.5,
          life: 0.5 + Math.random() * 0.4, color: COLORS[grid[ry][x]] || '#fff'
        });
      }
    }
  });
  clearAnim = { rows: clearedRows, t: 0.28 };
  if (n === 4) {
    sfx.tetris();
    popups.push({ text: 'TETRIS!', x: canvas.width / 2, y: canvas.height / 2 - 40, t: 0, color: '#7df9ff', size: 40 });
    shake = 7;
  } else {
    sfx.clear(n);
    shake = Math.min(5, 2 + n);
  }
  popups.push({ text: '+' + SCORE_TABLE[n] * level, x: canvas.width / 2, y: clearedRows[0] * CELL - 10, t: 0, color: '#ffd76a', size: 20 });

  // actually remove rows (after capturing colors for particles)
  clearedRows.sort((a, b) => a - b).forEach(ry => {
    grid.splice(ry, 1);
    grid.unshift(new Array(COLS).fill(null));
  });
}

function rotate(matrix) {
  return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
}

function tryRotate() {
  const rotated = rotate(piece.matrix);
  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collides(rotated, piece.x + kick, piece.y)) {
      piece.matrix = rotated;
      piece.x += kick;
      sfx.rotate();
      return;
    }
  }
}

function move(dx) {
  if (!collides(piece.matrix, piece.x + dx, piece.y)) { piece.x += dx; sfx.move(); }
}

function softDrop() {
  if (!collides(piece.matrix, piece.x, piece.y + 1)) {
    piece.y++;
    score += 1;
    updateHUD();
  } else {
    lockPiece();
  }
  dropTimer = 0;
}

function hardDrop() {
  let d = 0;
  while (!collides(piece.matrix, piece.x, piece.y + 1)) { piece.y++; d++; }
  score += d * 2;
  shake = 4;
  sfx.hard();
  lockPiece();
  dropTimer = 0;
}

function lockPiece() {
  merge();
  sfx.lock();
  clearLines();
  piece = spawn(nextPiece);
  nextPiece = randomType();
  if (collides(piece.matrix, piece.x, piece.y)) {
    endGame();
  }
  drawNext();
}

function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  linesEl.textContent = lines;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('tetris_best', String(best)); } catch (e) {}
  }
}

// beveled neon block
function drawCell(c, x, y, color, cellSize) {
  const S = cellSize || CELL;
  const px = x * S, py = y * S;
  c.fillStyle = color;
  c.fillRect(px, py, S, S);
  // top/left light
  c.fillStyle = 'rgba(255,255,255,0.32)';
  c.fillRect(px, py, S, 3);
  c.fillRect(px, py, 3, S);
  // bottom/right shade
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.fillRect(px, py + S - 3, S, 3);
  c.fillRect(px + S - 3, py, 3, S);
  // inner gloss
  c.fillStyle = 'rgba(255,255,255,0.1)';
  c.fillRect(px + 4, py + 4, S - 8, Math.max(3, S * 0.22));
  c.strokeStyle = 'rgba(0,0,0,0.4)';
  c.lineWidth = 1;
  c.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1);
}

function draw() {
  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(125,180,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
  }

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (grid[y][x]) drawCell(ctx, x, y, COLORS[grid[y][x]]);

  // ghost piece
  if (piece && !gameOver) {
    let gy = piece.y;
    while (!collides(piece.matrix, piece.x, gy + 1)) gy++;
    ctx.globalAlpha = 0.22;
    piece.matrix.forEach((row, y) => row.forEach((v, x) => {
      if (v && gy + y >= 0) drawCell(ctx, piece.x + x, gy + y, COLORS[piece.type]);
    }));
    ctx.globalAlpha = 1;
    // active piece with subtle glow
    ctx.save();
    ctx.shadowColor = COLORS[piece.type];
    ctx.shadowBlur = 8;
    piece.matrix.forEach((row, y) => row.forEach((v, x) => {
      if (v && piece.y + y >= 0) drawCell(ctx, piece.x + x, piece.y + y, COLORS[piece.type]);
    }));
    ctx.restore();
  }

  // line-clear flash
  if (clearAnim) {
    clearAnim.rows.forEach(ry => {
      ctx.fillStyle = 'rgba(255,255,255,' + (clearAnim.t * 2.4).toFixed(3) + ')';
      ctx.fillRect(0, ry * CELL, canvas.width, CELL);
    });
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 1.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // popups
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 1.1);
    ctx.font = '900 ' + p.size + 'px "Segoe UI", Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.t * 40);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

function drawNext() {
  nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  const m = SHAPES[nextPiece];
  const bs = 16;
  const ox = (nextCanvas.width - m[0].length * bs) / 2;
  const oy = (nextCanvas.height - m.length * bs) / 2;
  m.forEach((row, y) => row.forEach((v, x) => {
    if (v) {
      nctx.fillStyle = COLORS[nextPiece];
      nctx.fillRect(ox + x * bs, oy + y * bs, bs, bs);
      nctx.fillStyle = 'rgba(255,255,255,0.3)';
      nctx.fillRect(ox + x * bs, oy + y * bs, bs, 3);
      nctx.strokeStyle = 'rgba(0,0,0,0.4)';
      nctx.strokeRect(ox + x * bs + 0.5, oy + y * bs + 0.5, bs - 1, bs - 1);
    }
  }));
}

function endGame() {
  gameOver = true;
  sfx.over();
  bgm.stop();
  overlayScore.textContent = 'Score: ' + score + '  ·  Lines: ' + lines;
  overlayBest.textContent = (score >= best && score > 0) ? 'NEW BEST!' : 'Best: ' + best;
  setTimeout(() => overlay.classList.add('show'), 600);
}

function reset() {
  ac();
  grid = Array.from({length: ROWS}, () => new Array(COLS).fill(null));
  bag = newBag();
  score = 0; level = 1; lines = 0;
  dropInterval = 800; dropTimer = 0; lastTime = 0;
  gameOver = false;
  clearAnim = null; particles = []; popups = []; shake = 0;
  nextPiece = randomType();
  piece = spawn(randomType());
  overlay.classList.remove('show');
  updateHUD();
  drawNext();
  bgm.start();
}

function loop(time) {
  animT = time / 1000;
  if (!gameOver) {
    const dt = time - lastTime;
    lastTime = time;
    if (clearAnim) {
      clearAnim.t -= dt / 1000;
      if (clearAnim.t <= 0) clearAnim = null;
    }
    dropTimer += dt;
    if (dropTimer >= dropInterval) {
      dropTimer = 0;
      if (!collides(piece.matrix, piece.x, piece.y + 1)) piece.y++;
      else lockPiece();
    }
  }
  // fx always animate
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].t += 0.016;
    if (popups[i].t > 1.1) popups.splice(i, 1);
  }
  shake = Math.max(0, shake - 0.5);

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  draw();
  ctx.restore();
  requestAnimationFrame(loop);
}

function action(k) {
  if (gameOver) return;
  switch (k) {
    case 'left': move(-1); break;
    case 'right': move(1); break;
    case 'down': softDrop(); break;
    case 'rotate': tryRotate(); break;
    case 'drop': hardDrop(); break;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { reset(); return; }
  if (gameOver) return;
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rotate', ' ': 'drop' };
  const k = map[e.key];
  if (!k) return;
  e.preventDefault();
  action(k);
});

// touch buttons — hold to repeat for move/down
document.querySelectorAll('#touchpad button').forEach(btn => {
  const k = btn.dataset.k;
  let rep = null;
  const fire = () => action(k);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    ac();
    if (gameOver) { reset(); return; }
    fire();
    if (k === 'left' || k === 'right' || k === 'down') {
      rep = setInterval(fire, k === 'down' ? 60 : 110);
    }
  });
  const stop = () => { if (rep) { clearInterval(rep); rep = null; } };
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
});

// swipe on board: horizontal = move, up = rotate, down fling = hard drop
let tsX = 0, tsY = 0, swiping = false;
canvas.addEventListener('touchstart', e => {
  tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; swiping = true;
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!swiping || gameOver) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - tsX, dy = e.touches[0].clientY - tsY;
  const rect = canvas.getBoundingClientRect();
  const cellPx = rect.width / COLS;
  if (Math.abs(dx) > cellPx) {
    action(dx > 0 ? 'right' : 'left');
    tsX = e.touches[0].clientX;
  }
  if (dy > cellPx * 1.6) {
    action('down');
    tsY = e.touches[0].clientY;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!swiping) return;
  swiping = false;
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
  if (gameOver) { reset(); return; }
  if (dy < -40 && Math.abs(dy) > Math.abs(dx)) action('drop');
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) action('rotate');
}, { passive: false });

document.getElementById('restartBtn').addEventListener('click', reset);

reset();
requestAnimationFrame(loop);
})();
</script>
