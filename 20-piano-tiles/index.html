<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piano Tiles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #20264a 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 110%, #241a3e 0%, transparent 60%),
      #0a0d1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #eee;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  #hud {
    font-size: 30px; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px;
    color: #f4f6ff;
    text-shadow: 0 0 18px rgba(120,160,255,.55), 0 2px 6px rgba(0,0,0,.6);
    transition: transform .08s;
  }
  #hud.bump { transform: scale(1.12); }
  #best { font-size: 13px; color: #7d86ad; font-weight: 600; margin-left: 12px; text-shadow: none; }
  #board {
    position: relative;
    width: min(420px, 94vw);
    height: min(74vh, 640px);
    background:
      linear-gradient(180deg, rgba(120,140,255,0.05), rgba(120,140,255,0) 30%),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.014) 3px 4px),
      linear-gradient(180deg, #141a33, #0d1124);
    overflow: hidden;
    touch-action: none;
    border-radius: 12px;
    border: 1px solid rgba(130,150,255,.22);
    box-shadow: 0 10px 50px rgba(0,0,0,.7), 0 0 44px rgba(80,110,255,.12), inset 0 1px 0 rgba(255,255,255,.06);
    cursor: pointer;
  }
  .line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(150,170,255,.14); z-index: 1; }
  .lane-flash {
    position: absolute; top: 0; bottom: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(120,200,255,0), rgba(120,200,255,.16));
    opacity: 0; transition: opacity .12s;
    pointer-events: none;
  }
  .tile {
    position: absolute;
    top: 0;
    background: linear-gradient(180deg, #59d8ff 0%, #3a7bff 55%, #6a4dff 100%);
    box-shadow: 0 0 16px rgba(90,150,255,.55), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -8px 14px rgba(20,10,60,.45);
    z-index: 2;
    border-radius: 0 0 6px 6px;
    border: 1px solid rgba(190,220,255,.5); border-top: none;
    will-change: transform;
  }
  .tile.hit {
    background: linear-gradient(180deg, #24406a, #182344);
    box-shadow: inset 0 0 18px rgba(80,140,255,.28);
    border-color: rgba(120,150,220,.3);
    opacity: .55;
  }
  .tile.missed {
    background: linear-gradient(180deg, #ff5e5e, #c21616);
    box-shadow: 0 0 22px rgba(255,60,60,.7), inset 0 2px 0 rgba(255,255,255,.3);
    border-color: rgba(255,160,160,.6);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(6,8,20,.8);
    backdrop-filter: blur(4px);
    color: #fff;
    text-align: center;
    z-index: 5;
    pointer-events: none;
    transition: opacity .15s;
  }
  #overlay.hidden { opacity: 0; }
  #overlay h1 {
    font-size: 36px; margin-bottom: 12px; font-weight: 900; letter-spacing: .06em;
    background: linear-gradient(120deg, #7fdcff, #a78bfa);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(120,160,255,.5));
  }
  #overlay p { font-size: 15px; color: #b9c2e6; line-height: 1.7; padding: 0 28px; }
  #overlay p b { color: #8fd0ff; }
  #hint { margin-top: 10px; font-size: 13px; color: #5d6690; letter-spacing: .3em; }
  #board.shake { animation: shake .3s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
</style>
</head>
<body>
  <div id="hud"><span id="score">0</span><span id="best"></span></div>
  <div id="board">
    <div class="line" style="left:25%"></div>
    <div class="line" style="left:50%"></div>
    <div class="line" style="left:75%"></div>
    <div class="lane-flash" style="left:0;width:25%"></div>
    <div class="lane-flash" style="left:25%;width:25%"></div>
    <div class="lane-flash" style="left:50%;width:25%"></div>
    <div class="lane-flash" style="left:75%;width:25%"></div>
    <div id="overlay">
      <h1>PIANO TILES</h1>
      <p>Tap the glowing tiles.<br>Don't tap empty lanes.<br>Don't let a tile reach the bottom.<br><br>Tap or press <b>D F J K</b> to start</p>
    </div>
  </div>
  <div id="hint">D &nbsp;F &nbsp;J &nbsp;K</div>
<script>
(function () {
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var LANES = 4;
  var KEYS = { d: 0, f: 1, j: 2, k: 3 };
  var W = 0, H = 0, rowH = 0, laneW = 0;
  var tiles = [], lastTile = null;
  var score = 0, best = 0, speed = 0, combo = 0;
  var state = 'ready', lastTime = 0, overAt = 0, audio = null;
  var laneFlashes = board.querySelectorAll('.lane-flash');
  var hud = document.getElementById('hud');

  try { best = +localStorage.getItem('pianoTilesBest') || 0; } catch (e) {}
  bestEl.textContent = 'best ' + best;

  function resize() {
    var r = board.getBoundingClientRect();
    W = r.width; H = r.height; laneW = W / LANES; rowH = H / 4;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].el.style.width = laneW + 'px';
      tiles[i].el.style.height = rowH + 'px';
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function position(t) { t.el.style.transform = 'translateY(' + t.y + 'px)'; }

  function spawn(y) {
    var lane = (Math.random() * LANES) | 0;
    var el = document.createElement('div');
    el.className = 'tile';
    el.style.width = laneW + 'px';
    el.style.height = rowH + 'px';
    el.style.left = (lane * laneW) + 'px';
    board.appendChild(el);
    var t = { lane: lane, y: y, el: el, hit: false };
    tiles.push(t);
    lastTile = t;
    position(t);
  }

  function start() {
    for (var i = 0; i < tiles.length; i++) tiles[i].el.remove();
    tiles = []; lastTile = null; score = 0; combo = 0;
    speed = Math.max(240, H * 0.45);
    scoreEl.textContent = '0';
    overlay.classList.add('hidden');
    state = 'playing';
    spawn(-rowH);
  }

  function err() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(180, audio.currentTime);
      o.frequency.exponentialRampToValueAtTime(70, audio.currentTime + 0.3);
      g.gain.setValueAtTime(0.12, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.32);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.34);
    } catch (e) {}
    if (window.AAA) { AAA.sfx.error(); AAA.flash(0.25); }
  }

  function gameOver(bad) {
    state = 'over';
    overAt = performance.now();
    combo = 0;
    if (bad) bad.el.classList.add('missed');
    board.classList.add('shake');
    setTimeout(function () { board.classList.remove('shake'); }, 400);
    err();
    var isBest = score > best;
    if (isBest) {
      best = score;
      bestEl.textContent = 'best ' + best;
      try { localStorage.setItem('pianoTilesBest', best); } catch (e) {}
    }
    overlay.innerHTML = '<h1>GAME OVER</h1><p>Score: <b>' + score + '</b> &nbsp;&middot;&nbsp; Best: ' + best +
      (isBest && score > 0 ? '<br><br><b>NEW BEST!</b>' : '') +
      '<br><br>Tap or press a key to restart</p>';
    overlay.classList.remove('hidden');
  }

  function note() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var scale = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880];
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = scale[score % scale.length];
      g.gain.setValueAtTime(0.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.26);
    } catch (e) {}
  }

  function hitTile(t) {
    t.hit = true;
    t.el.classList.add('hit');
    score++;
    combo++;
    scoreEl.textContent = score;
    speed = Math.min(speed + 4, H * 1.4);
    note();
    // lane flash + hud bump
    var lf = laneFlashes[t.lane];
    if (lf) { lf.style.opacity = '1'; setTimeout(function () { lf.style.opacity = '0'; }, 110); }
    hud.classList.add('bump');
    setTimeout(function () { hud.classList.remove('bump'); }, 90);
    if (window.AAA && combo % 10 === 0) {
      AAA.popup(window.innerWidth / 2, window.innerHeight * 0.3, 'x' + combo + ' COMBO', '#f472b6');
      AAA.sfx.score(Math.min(12, combo / 10));
    }
  }

  function tapAt(lane, py) {
    var found = null;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.lane === lane && py >= t.y && py <= t.y + rowH) { found = t; break; }
    }
    if (!found) { gameOver(null); return; }
    if (!found.hit) hitTile(found);
  }

  function tapLane(lane) {
    var target = null;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.lane === lane && !t.hit && t.y < H) {
        if (!target || t.y > target.y) target = t;
      }
    }
    if (target) hitTile(target); else gameOver(null);
  }

  board.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'ready') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 350) start(); return; }
    var r = board.getBoundingClientRect();
    var lane = Math.min(LANES - 1, Math.max(0, ((e.clientX - r.left) / laneW) | 0));
    tapAt(lane, e.clientY - r.top);
  });

  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    var lane = KEYS[e.key.toLowerCase()];
    if (lane === undefined) return;
    e.preventDefault();
    if (state === 'ready') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 350) start(); return; }
    tapLane(lane);
  });

  function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (t - lastTime) / 1000 || 0);
    lastTime = t;
    if (state !== 'playing') return;
    for (var i = tiles.length - 1; i >= 0; i--) {
      var tl = tiles[i];
      tl.y += speed * dt;
      position(tl);
      if (!tl.hit && tl.y >= H) { gameOver(tl); return; }
      if (tl.y > H + rowH) { tl.el.remove(); tiles.splice(i, 1); }
    }
    if (!lastTile || lastTile.y >= 0) spawn(lastTile ? lastTile.y - rowH : -rowH);
  }
  requestAnimationFrame(frame);

  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":20,"label":"Tiles hit in sequence","goals":[10,25,50],"note":"Catch the descending tiles; missed tiles break the run."}, { read: () => { return (score || 0); } });
})();
</script>

<script src="../assets/aaa-arcade.js?v=3" defer></script>
<script src="../assets/missions.js" defer></script>
</body>
</html>
