<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piano Tiles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #eee;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  #hud { font-size: 30px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  #best { font-size: 13px; color: #888; font-weight: 400; margin-left: 12px; }
  #board {
    position: relative;
    width: min(420px, 94vw);
    height: min(74vh, 640px);
    background: #fff;
    overflow: hidden;
    touch-action: none;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
    cursor: pointer;
  }
  .line { position: absolute; top: 0; bottom: 0; width: 1px; background: #ddd; z-index: 1; }
  .tile {
    position: absolute;
    top: 0;
    background: #161616;
    z-index: 2;
    border-radius: 0 0 4px 4px;
    will-change: transform;
  }
  .tile.hit { background: #9e9e9e; }
  .tile.missed { background: #d32f2f; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    color: #fff;
    text-align: center;
    z-index: 5;
    pointer-events: none;
    transition: opacity .15s;
  }
  #overlay.hidden { opacity: 0; }
  #overlay h1 { font-size: 34px; margin-bottom: 12px; }
  #overlay p { font-size: 15px; color: #ccc; line-height: 1.7; padding: 0 28px; }
  #hint { margin-top: 10px; font-size: 13px; color: #777; }
  #board.shake { animation: shake .3s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(6px); }
    75% { transform: translateX(-4px); }
  }
</style>
</head>
<body>
  <div id="hud"><span id="score">0</span><span id="best"></span></div>
  <div id="board">
    <div class="line" style="left:25%"></div>
    <div class="line" style="left:50%"></div>
    <div class="line" style="left:75%"></div>
    <div id="overlay">
      <h1>Piano Tiles</h1>
      <p>Tap the black tiles.<br>Don't tap the white ones.<br>Don't let a black tile reach the bottom.<br><br>Tap or press <b>D F J K</b> to start</p>
    </div>
  </div>
  <div id="hint">keys: D &nbsp;F &nbsp;J &nbsp;K</div>
<script>
(function () {
  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var LANES = 4;
  var KEYS = { d: 0, f: 1, j: 2, k: 3 };
  var W = 0, H = 0, rowH = 0, laneW = 0;
  var tiles = [], lastTile = null;
  var score = 0, best = 0, speed = 0;
  var state = 'ready', lastTime = 0, overAt = 0, audio = null;

  try { best = +localStorage.getItem('pianoTilesBest') || 0; } catch (e) {}
  bestEl.textContent = 'best ' + best;

  function resize() {
    var r = board.getBoundingClientRect();
    W = r.width; H = r.height; laneW = W / LANES; rowH = H / 4;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].el.style.width = laneW + 'px';
      tiles[i].el.style.height = rowH + 'px';
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function position(t) { t.el.style.transform = 'translateY(' + t.y + 'px)'; }

  function spawn(y) {
    var lane = (Math.random() * LANES) | 0;
    var el = document.createElement('div');
    el.className = 'tile';
    el.style.width = laneW + 'px';
    el.style.height = rowH + 'px';
    el.style.left = (lane * laneW) + 'px';
    board.appendChild(el);
    var t = { lane: lane, y: y, el: el, hit: false };
    tiles.push(t);
    lastTile = t;
    position(t);
  }

  function start() {
    for (var i = 0; i < tiles.length; i++) tiles[i].el.remove();
    tiles = []; lastTile = null; score = 0;
    speed = Math.max(240, H * 0.45);
    scoreEl.textContent = '0';
    overlay.classList.add('hidden');
    state = 'playing';
    spawn(-rowH);
  }

  function gameOver(bad) {
    state = 'over';
    overAt = performance.now();
    if (bad) bad.el.classList.add('missed');
    board.classList.add('shake');
    setTimeout(function () { board.classList.remove('shake'); }, 400);
    if (score > best) {
      best = score;
      bestEl.textContent = 'best ' + best;
      try { localStorage.setItem('pianoTilesBest', best); } catch (e) {}
    }
    overlay.innerHTML = '<h1>Game Over</h1><p>Score: <b>' + score + '</b> &nbsp;&middot;&nbsp; Best: ' + best +
      '<br><br>Tap or press a key to restart</p>';
    overlay.classList.remove('hidden');
  }

  function note() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var scale = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880];
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'triangle';
      o.frequency.value = scale[score % scale.length];
      g.gain.setValueAtTime(0.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.26);
    } catch (e) {}
  }

  function hitTile(t) {
    t.hit = true;
    t.el.classList.add('hit');
    score++;
    scoreEl.textContent = score;
    speed = Math.min(speed + 4, H * 1.4);
    note();
  }

  function tapAt(lane, py) {
    var found = null;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.lane === lane && py >= t.y && py <= t.y + rowH) { found = t; break; }
    }
    if (!found) { gameOver(null); return; }
    if (!found.hit) hitTile(found);
  }

  function tapLane(lane) {
    var target = null;
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.lane === lane && !t.hit && t.y < H) {
        if (!target || t.y > target.y) target = t;
      }
    }
    if (target) hitTile(target); else gameOver(null);
  }

  board.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'ready') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 350) start(); return; }
    var r = board.getBoundingClientRect();
    var lane = Math.min(LANES - 1, Math.max(0, ((e.clientX - r.left) / laneW) | 0));
    tapAt(lane, e.clientY - r.top);
  });

  window.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    var lane = KEYS[e.key.toLowerCase()];
    if (lane === undefined) return;
    e.preventDefault();
    if (state === 'ready') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 350) start(); return; }
    tapLane(lane);
  });

  function frame(t) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (t - lastTime) / 1000 || 0);
    lastTime = t;
    if (state !== 'playing') return;
    for (var i = tiles.length - 1; i >= 0; i--) {
      var tl = tiles[i];
      tl.y += speed * dt;
      position(tl);
      if (!tl.hit && tl.y >= H) { gameOver(tl); return; }
      if (tl.y > H + rowH) { tl.el.remove(); tiles.splice(i, 1); }
    }
    if (!lastTile || lastTile.y >= 0) spawn(lastTile ? lastTile.y - rowH : -rowH);
  }
  requestAnimationFrame(frame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
