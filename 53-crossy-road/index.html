<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crossy Road</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15151f;font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none;}
  canvas{display:block;touch-action:none;}
  #hud{position:fixed;top:14px;left:0;right:0;text-align:center;pointer-events:none;color:#fff;}
  #score{font-size:52px;font-weight:800;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35);}
  #best{font-size:15px;opacity:.75;margin-top:4px;}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#ffffff99;font-size:13px;pointer-events:none;}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,9,18,.6);backdrop-filter:blur(4px);z-index:10;}
  #overlay.show{display:flex;}
  .card{background:linear-gradient(180deg,#272a44,#191b2e);border:1px solid rgba(160,160,220,.28);border-radius:18px;padding:30px 48px;text-align:center;color:#fff;box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);animation:cardIn .28s cubic-bezier(.2,.9,.3,1.25);}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
  .card h1{margin:0 0 4px;font-size:32px;font-weight:900;letter-spacing:1px;color:#ff6b5e;text-shadow:0 0 20px rgba(255,107,94,.45);}
  .card p{margin:4px 0;font-size:15px;color:#c9c9e8;}
  .card .big{font-size:44px;font-weight:900;color:#ffd75e;margin:8px 0 2px;text-shadow:0 0 22px rgba(255,215,94,.45);}
  .card button{margin-top:14px;font-size:17px;font-weight:800;padding:11px 28px;border:0;border-radius:10px;background:linear-gradient(160deg,#6ad45c,#3f9a34);color:#0d2410;cursor:pointer;box-shadow:0 8px 22px rgba(90,200,80,.3),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s,filter .12s;}
  .card button:hover{filter:brightness(1.1);transform:translateY(-1px);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">0</div><div id="best"></div></div>
<div id="hint">Arrow keys / WASD / swipe to hop &nbsp;&middot;&nbsp; R to restart</div>
<div id="overlay"><div class="card">
  <h1 id="deathTitle">Splat!</h1>
  <p id="deathMsg"></p>
  <p class="big" id="finalScore">0</p>
  <p id="finalBest"></p>
  <button id="again">Hop again (R)</button>
</div></div>
<script>
'use strict';
const COLS = 9, VIS = 14, START_COL = 4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');

let W=0,H=0,TILE=40,OX=0,OY=0,DPR=1;
let state='play', time=0, score=0, best=0, camBottom=-0.4, camMin=-0.4;
let player, hop=null, buffered=null;
try{ best = +localStorage.getItem('crossy-best')||0; }catch(e){}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  TILE = Math.min(W/COLS, (H*0.94)/VIS);
  OX = (W - COLS*TILE)/2;
  OY = H - TILE*0.6;
}
addEventListener('resize', resize);

function rng(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function hash01(a,b){
  let h = (a*374761393 + b*668265263)>>>0;
  h = Math.imul(h ^ h>>>13, 1274126177)>>>0;
  return ((h ^ h>>>16) >>> 0) / 4294967296;
}

// Deterministic lane layout per row index
function laneInfo(i){
  if(i < 2) return {type:'grass'};
  const r = rng(i*7919 + 13);
  const roll = r();
  const diff = Math.min(1, i/80);
  if(roll < 0.30) return {type:'grass'};
  if(roll < 0.72){
    return {type:'road', dir:r()<0.5?1:-1, speed:2.2 + r()*2.6 + diff*2.4,
            len:r()<0.6?1.2:2.2, gap:Math.max(2.6, 3.5 + r()*3.5 - diff*1.4), phase:r()*10};
  }
  return {type:'water', dir:r()<0.5?1:-1, speed:1.4 + r()*1.8 + diff*1.5,
          len:2.2 + r()*1.6, gap:Math.max(3.0, 4 + r()*3 - diff*1.2), phase:r()*10};
}
function isBlocked(i,c){
  if(i < 2 || laneInfo(i).type !== 'grass') return false;
  return hash01(i*97+11, c*57+5) < 0.30;
}

// Iterate vehicle/log tile-rects on a lane: cb(x, len, index)
function slots(li, cb){
  const R = COLS + 12, period = li.len + li.gap;
  const n = Math.ceil(R/period) + 1;
  for(let k=0;k<n;k++){
    let pos = k*period + li.phase + li.dir*li.speed*time;
    pos = ((pos % R) + R) % R - 6;
    if(pos < COLS+2 && pos+li.len > -2) cb(pos, li.len, k);
  }
}

function reset(){
  player = {x:START_COL, row:0};
  hop = null; buffered = null; score = 0; time = 0;
  camBottom = -0.4; camMin = -0.4;
  state = 'play';
  scoreEl.textContent = '0';
  bestEl.textContent = best ? 'Best: ' + best : '';
  overlay.classList.remove('show');
}

const MSGS = {
  car:  ['Splat!', 'Flattened by traffic'],
  water:['Splash!', 'You went for a swim'],
  eagle:['Snatched!', 'Too slow — keep moving!'],
  edge: ['Swept away!', 'Carried off the screen']
};
function die(kind){
  if(state !== 'play') return;
  state = 'dead';
  if(score > best){ best = score; try{ localStorage.setItem('crossy-best', best); }catch(e){} }
  if(window.AAA){
    const px = OX + (player.x+0.5)*TILE, py = sy(player.row) - TILE*0.5;
    AAA.sfx.hit();
    AAA.flash(0.26);
    AAA.burst(px, py, kind==='water' ? '#5ec8ff' : '#ffd75e', 16);
    if(kind==='car') AAA.shockwave(px, py, '#ff6b5e', 70);
  }
  document.getElementById('deathTitle').textContent = MSGS[kind][0];
  document.getElementById('deathMsg').textContent = MSGS[kind][1];
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = 'Best: ' + best;
  overlay.classList.add('show');
}

function tryMove(dx, dr){
  if(state !== 'play') return;
  if(hop){ buffered = [dx,dr]; return; }
  const nx = Math.round(player.x) + dx, nr = player.row + dr;
  if(nx < 0 || nx > COLS-1) return;
  if(nr < Math.floor(camBottom)) return;
  if(isBlocked(nr, nx)) return;
  hop = {fx:player.x, fr:player.row, t:0, dur:0.11};
  player.x = nx; player.row = nr;
  if(window.AAA) AAA.tone(300 + Math.min(300, score*2), 0.06, 'triangle', 0.045, 460);
  if(nr > score){ score = nr; scoreEl.textContent = score; }
}

function update(dt){
  time += dt;
  if(state !== 'play') return;
  if(hop){
    hop.t += dt/hop.dur;
    if(hop.t >= 1){
      hop = null;
      if(buffered){ const b = buffered; buffered = null; tryMove(b[0], b[1]); }
    }
  } else {
    const li = laneInfo(player.row), px = player.x;
    if(li.type === 'road'){
      let dead = false;
      slots(li, (x,l)=>{ if(x < px+0.30 && x+l > px-0.30) dead = true; });
      if(dead) return die('car');
    } else if(li.type === 'water'){
      let carry = null;
      slots(li, (x,l)=>{ if(px+0.28 > x && px-0.28 < x+l) carry = li.dir*li.speed; });
      if(carry === null) return die('water');
      player.x += carry*dt;
    }
    if(player.x < -0.45 || player.x > COLS-0.55) return die('edge');
  }
  camMin += dt * (0.16 + Math.min(0.5, score*0.004));
  const target = Math.max(camMin, player.row - 4.5);
  camBottom += (target - camBottom) * Math.min(1, dt*6);
  if(player.row < camBottom - 1.1) die('eagle');
}

function sy(r){ return OY - (r - camBottom)*TILE; } // bottom edge of row r
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

const CAR_COLORS = ['#e05656','#e0a13e','#4aa3e0','#9a6ae0','#e0d355','#58c4a0'];
function drawRow(r){
  const li = laneInfo(r), yT = sy(r+1), yB = sy(r);
  const x = OX, w = COLS*TILE;
  if(li.type === 'grass'){
    const g = ctx.createLinearGradient(0, yT, 0, yB);
    if(r%2){ g.addColorStop(0,'#57a348'); g.addColorStop(1,'#4f9a41'); }
    else   { g.addColorStop(0,'#65b854'); g.addColorStop(1,'#5aad4c'); }
    ctx.fillStyle = g;
    ctx.fillRect(x, yT, w, TILE+1);
    for(let c=0;c<COLS;c++){
      const cx = x + c*TILE;
      if(isBlocked(r,c)){
        // tree: shadow, trunk, layered canopy
        ctx.fillStyle = 'rgba(0,0,0,.18)';
        ctx.beginPath(); ctx.ellipse(cx+TILE*0.5, yT+TILE*0.82, TILE*0.26, TILE*0.09, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#6b4a2e';
        ctx.fillRect(cx+TILE*0.44, yT+TILE*0.42, TILE*0.12, TILE*0.36);
        ctx.fillStyle = '#2f7a33';
        ctx.beginPath(); ctx.arc(cx+TILE*0.5, yT+TILE*0.36, TILE*0.30, 0, 7); ctx.fill();
        ctx.fillStyle = '#3d9243';
        ctx.beginPath(); ctx.arc(cx+TILE*0.42, yT+TILE*0.28, TILE*0.16, 0, 7); ctx.fill();
        ctx.fillStyle = '#55b25b';
        ctx.beginPath(); ctx.arc(cx+TILE*0.58, yT+TILE*0.24, TILE*0.11, 0, 7); ctx.fill();
      } else if(hash01(r*13+5, c*29+3) < 0.12){
        // flower
        ctx.fillStyle = 'rgba(0,0,0,.12)';
        ctx.beginPath(); ctx.arc(cx+TILE*0.5+1, yT+TILE*0.6+1, TILE*0.07, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffffffcc';
        for(let p=0;p<4;p++){const a=p*Math.PI/2+0.4;ctx.beginPath();ctx.arc(cx+TILE*0.5+Math.cos(a)*TILE*0.05, yT+TILE*0.6+Math.sin(a)*TILE*0.05, TILE*0.045, 0, 7);ctx.fill();}
        ctx.fillStyle = '#ffd75e';
        ctx.beginPath(); ctx.arc(cx+TILE*0.5, yT+TILE*0.6, TILE*0.035, 0, 7); ctx.fill();
      } else if(hash01(r*7+3, c*19+11) < 0.18){
        // grass tuft
        ctx.strokeStyle = 'rgba(30,90,35,.5)'; ctx.lineWidth = Math.max(1,TILE*0.03);
        ctx.beginPath();
        ctx.moveTo(cx+TILE*0.35, yT+TILE*0.72); ctx.lineTo(cx+TILE*0.32, yT+TILE*0.58);
        ctx.moveTo(cx+TILE*0.5,  yT+TILE*0.72); ctx.lineTo(cx+TILE*0.5,  yT+TILE*0.56);
        ctx.moveTo(cx+TILE*0.65, yT+TILE*0.72); ctx.lineTo(cx+TILE*0.68, yT+TILE*0.58);
        ctx.stroke();
      }
    }
  } else if(li.type === 'road'){
    const g = ctx.createLinearGradient(0, yT, 0, yB);
    g.addColorStop(0,'#34343f'); g.addColorStop(0.5,'#3e3e4e'); g.addColorStop(1,'#34343f');
    ctx.fillStyle = g;
    ctx.fillRect(x, yT, w, TILE+1);
    // edge lines
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillRect(x, yT+1, w, 2);
    ctx.fillRect(x, yB-3, w, 2);
    // center dashes
    ctx.fillStyle = 'rgba(245,215,110,.7)';
    for(let c=0;c<COLS;c++) ctx.fillRect(x+c*TILE+TILE*0.2, (yT+yB)/2-2, TILE*0.6, 4);
    slots(li, (vx, vl, k)=>{
      const px = x + vx*TILE, pw = vl*TILE;
      const col = CAR_COLORS[Math.floor(hash01(r*31+k, k*7+1)*CAR_COLORS.length)];
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      rr(px+3, yT+TILE*0.24, pw-2, TILE*0.62, TILE*0.14); ctx.fill();
      // body w/ vertical sheen
      const cg = ctx.createLinearGradient(0, yT+TILE*0.18, 0, yT+TILE*0.82);
      cg.addColorStop(0, col); cg.addColorStop(1, 'rgba(0,0,0,.55)');
      ctx.fillStyle = cg;
      rr(px+2, yT+TILE*0.18, pw-4, TILE*0.64, TILE*0.14); ctx.fill();
      // windshield
      ctx.fillStyle = 'rgba(15,22,34,.85)';
      if(li.dir > 0) rr(px+pw*0.62, yT+TILE*0.26, pw*0.2, TILE*0.48, TILE*0.07);
      else           rr(px+pw*0.18, yT+TILE*0.26, pw*0.2, TILE*0.48, TILE*0.07);
      ctx.fill();
      // roof highlight
      ctx.fillStyle = 'rgba(255,255,255,.13)';
      rr(px+pw*0.38, yT+TILE*0.22, pw*0.24, TILE*0.2, TILE*0.06); ctx.fill();
      // headlights at nose
      ctx.fillStyle = '#ffeaa7';
      const hx = li.dir > 0 ? px+pw-6 : px+2;
      ctx.fillRect(hx, yT+TILE*0.26, 4, 7);
      ctx.fillRect(hx, yT+TILE*0.66, 4, 7);
      // tail lights
      ctx.fillStyle = '#ff5252';
      const tx2 = li.dir > 0 ? px+2 : px+pw-6;
      ctx.fillRect(tx2, yT+TILE*0.28, 4, 6);
      ctx.fillRect(tx2, yT+TILE*0.64, 4, 6);
      // wheels
      ctx.fillStyle = '#101318';
      ctx.fillRect(px+pw*0.2, yT+TILE*0.12, pw*0.14, 6);
      ctx.fillRect(px+pw*0.66, yT+TILE*0.12, pw*0.14, 6);
      ctx.fillRect(px+pw*0.2, yT+TILE*0.82, pw*0.14, 6);
      ctx.fillRect(px+pw*0.66, yT+TILE*0.82, pw*0.14, 6);
    });
  } else {
    // water: depth gradient + drifting wavelets
    const g = ctx.createLinearGradient(0, yT, 0, yB);
    g.addColorStop(0,'#2f7fd0'); g.addColorStop(0.5,'#3f8fe0'); g.addColorStop(1,'#2f7fd0');
    ctx.fillStyle = g;
    ctx.fillRect(x, yT, w, TILE+1);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    for(let c=0;c<COLS;c++){
      const ph = hash01(r*17+2, c*41+9);
      if(ph < 0.55){
        const wob = Math.sin(time*2 + ph*20 + c)*TILE*0.05;
        ctx.fillRect(x+c*TILE+TILE*0.15+wob, yT+TILE*(0.3+ph*0.4), TILE*0.5, 3);
      }
    }
    slots(li, (vx, vl)=>{
      const px = x + vx*TILE, pw = vl*TILE;
      // log shadow in water
      ctx.fillStyle = 'rgba(10,40,80,.35)';
      rr(px+2, yT+TILE*0.3, pw, TILE*0.52, TILE*0.2); ctx.fill();
      // log body w/ rings
      ctx.fillStyle = '#8a5a33';
      rr(px+1, yT+TILE*0.24, pw-2, TILE*0.52, TILE*0.2); ctx.fill();
      ctx.fillStyle = '#a06a3d';
      rr(px+TILE*0.12, yT+TILE*0.30, pw-TILE*0.24, TILE*0.16, TILE*0.08); ctx.fill();
      ctx.strokeStyle = 'rgba(60,35,15,.6)'; ctx.lineWidth = Math.max(1,TILE*0.03);
      for(let lx=px+TILE*0.4; lx<px+pw-8; lx+=TILE*0.5){
        ctx.beginPath(); ctx.moveTo(lx, yT+TILE*0.27); ctx.lineTo(lx, yT+TILE*0.73); ctx.stroke();
      }
    });
  }
  // darken off-board sides
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(0, yT, OX, TILE+1);
  ctx.fillRect(x+w, yT, W-(x+w), TILE+1);
}

function drawPlayer(){
  let dxp, dyp, arc = 0, squash = 1;
  if(hop){
    const t = Math.min(1, hop.t);
    dxp = hop.fx + (player.x - hop.fx)*t;
    dyp = hop.fr + (player.row - hop.fr)*t;
    arc = Math.sin(t*Math.PI)*0.35;
    squash = 1 + Math.sin(t*Math.PI)*0.15;
  } else { dxp = player.x; dyp = player.row; }
  const cxp = OX + (dxp+0.5)*TILE;
  const base = sy(dyp) - arc*TILE;
  const bw = TILE*0.58, bh = TILE*0.58*squash;
  // ground shadow (shrinks mid-hop)
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(cxp, sy(dyp)+2, bw*0.5*(1-arc*0.6), TILE*0.09*(1-arc*0.6), 0, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#f5f5f5';
  rr(cxp-bw/2, base-bh, bw, bh, TILE*0.12); ctx.fill();
  // wing
  ctx.fillStyle = '#dcdcdc';
  ctx.beginPath();
  ctx.ellipse(cxp-bw*0.28, base-bh*0.55, bw*0.16, bh*0.24, -0.5, 0, 7);
  ctx.fill();
  // beak (faces forward/up)
  ctx.fillStyle = '#f0922e';
  ctx.beginPath();
  ctx.moveTo(cxp-TILE*0.09, base-bh+TILE*0.16);
  ctx.lineTo(cxp+TILE*0.09, base-bh+TILE*0.16);
  ctx.lineTo(cxp, base-bh-TILE*0.02);
  ctx.closePath(); ctx.fill();
  // comb
  ctx.fillStyle = '#e04848';
  ctx.fillRect(cxp-TILE*0.05, base-bh-TILE*0.10, TILE*0.10, TILE*0.10);
  // eyes
  ctx.fillStyle = '#222';
  ctx.fillRect(cxp-TILE*0.16, base-bh+TILE*0.10, TILE*0.06, TILE*0.06);
  ctx.fillRect(cxp+TILE*0.10, base-bh+TILE*0.10, TILE*0.06, TILE*0.06);
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // dusk sky backdrop
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#1c1a30'); bg.addColorStop(0.55,'#15151f'); bg.addColorStop(1,'#101018');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);
  const r0 = Math.floor(camBottom)-1, r1 = Math.ceil(camBottom+VIS+2);
  for(let r=r0;r<=r1;r++) drawRow(r);
  drawPlayer();
  // soft top fade
  const g = ctx.createLinearGradient(0,0,0,TILE*2);
  g.addColorStop(0,'rgba(0,0,0,.45)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,TILE*2);
  // bottom vignette
  const gv = ctx.createLinearGradient(0,H-TILE*2.4,0,H);
  gv.addColorStop(0,'rgba(0,0,0,0)'); gv.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle = gv; ctx.fillRect(0,H-TILE*2.4,W,TILE*2.4);
}

const KEYS = {
  ArrowUp:[0,1], ArrowDown:[0,-1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,1], s:[0,-1], a:[-1,0], d:[1,0],
  W:[0,1], S:[0,-1], A:[-1,0], D:[1,0]
};
addEventListener('keydown', e=>{
  const k = e.key;
  if(k === 'r' || k === 'R' || k === 'Enter'){ reset(); return; }
  if(state === 'dead'){
    if(k === ' ' || k.startsWith('Arrow')){ e.preventDefault(); reset(); }
    return;
  }
  const m = KEYS[k] || (k === ' ' ? [0,1] : null);
  if(m){ e.preventDefault(); tryMove(m[0], m[1]); }
});

let tx = 0, ty = 0;
cv.addEventListener('touchstart', e=>{
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY;
},{passive:true});
cv.addEventListener('touchend', e=>{
  const t = e.changedTouches[0], dx = t.clientX-tx, dy = t.clientY-ty;
  if(state === 'dead'){ reset(); return; }
  if(Math.abs(dx) < 20 && Math.abs(dy) < 20) tryMove(0,1);
  else if(Math.abs(dx) > Math.abs(dy)) tryMove(Math.sign(dx), 0);
  else tryMove(0, -Math.sign(dy));
});
cv.addEventListener('mousedown', ()=>{
  if(state === 'dead') return;
  tryMove(0,1);
});
document.getElementById('again').addEventListener('click', reset);
overlay.addEventListener('click', e=>{ if(e.target === overlay) reset(); });

resize();
reset();
let last = performance.now();
requestAnimationFrame(function frame(t){
  const dt = Math.min(0.05, (t-last)/1000); last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
});
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
