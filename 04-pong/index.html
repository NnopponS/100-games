<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0f;
    color: #e6e6f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  h1 {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 12px;
    color: #7dd3fc;
  }
  #score {
    font-size: 42px;
    font-weight: 200;
    letter-spacing: 12px;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
  }
  #score .you { color: #7dd3fc; }
  #score .ai  { color: #f472b6; }
  #wrap {
    position: relative;
  }
  canvas {
    display: block;
    background: #0d0d16;
    border: 1px solid #2a2a3d;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(125, 211, 252, 0.08);
    cursor: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 15, 0.82);
    border-radius: 6px;
    text-align: center;
    transition: opacity 0.25s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlayTitle { font-size: 34px; font-weight: 300; letter-spacing: 6px; margin-bottom: 10px; }
  #overlaySub   { font-size: 14px; color: #9a9ab0; margin-bottom: 24px; line-height: 1.7; }
  #restartBtn {
    background: none;
    border: 1px solid #7dd3fc;
    color: #7dd3fc;
    font-size: 15px;
    letter-spacing: 3px;
    padding: 10px 28px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
    transition: background 0.15s, color 0.15s;
  }
  #restartBtn:hover { background: #7dd3fc; color: #0a0a0f; }
</style>
</head>
<body>
  <h1>Pong</h1>
  <div id="score"><span class="you" id="youScore">0</span> : <span class="ai" id="aiScore">0</span></div>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="overlay">
      <div id="overlayTitle">PONG</div>
      <div id="overlaySub">First to 10 wins.<br>Move with mouse or W / S keys.</div>
      <button id="restartBtn">Play</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlaySub = document.getElementById('overlaySub');
  var restartBtn = document.getElementById('restartBtn');
  var youScoreEl = document.getElementById('youScore');
  var aiScoreEl = document.getElementById('aiScore');

  var W = canvas.width, H = canvas.height;
  var WIN_SCORE = 10;

  var PADDLE_W = 12, PADDLE_H = 90, PADDLE_MARGIN = 24;
  var BALL_R = 7;
  var PLAYER_SPEED = 6.5;
  var AI_SPEED = 4.6;          // capped so AI is beatable
  var AI_REACT_ZONE = 0.45;    // AI only tracks ball once it passes mid-court-ish
  var BALL_SPEED0 = 5.2;
  var BALL_SPEEDUP = 1.045;    // each paddle hit speeds the ball up
  var BALL_MAX = 12;

  var player, ai, ball, keys, running, over;

  function resetPositions(serveDir) {
    player = { x: PADDLE_MARGIN, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H };
    ai     = { x: W - PADDLE_MARGIN - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H };
    ball = {
      x: W / 2, y: H / 2,
      vx: BALL_SPEED0 * serveDir,
      vy: (Math.random() * 2 - 1) * 3,
      r: BALL_R
    };
  }

  var score;
  function newGame() {
    score = { you: 0, ai: 0 };
    youScoreEl.textContent = '0';
    aiScoreEl.textContent = '0';
    resetPositions(Math.random() < 0.5 ? -1 : 1);
    over = false;
    running = true;
    overlay.classList.add('hidden');
  }

  function endGame(youWon) {
    over = true;
    running = false;
    overlayTitle.textContent = youWon ? 'YOU WIN' : 'AI WINS';
    overlayTitle.style.color = youWon ? '#7dd3fc' : '#f472b6';
    overlaySub.innerHTML = 'Final score: ' + score.you + ' : ' + score.ai + '<br>Mouse or W/S to play again.';
    restartBtn.textContent = 'Restart';
    overlay.classList.remove('hidden');
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  function paddleHit(p, dir) {
    // dir: +1 moving right (player hit), -1 moving left (ai hit)
    var rel = (ball.y - (p.y + p.h / 2)) / (p.h / 2);   // -1 .. 1
    rel = clamp(rel, -1, 1);
    var speed = Math.min(Math.hypot(ball.vx, ball.vy) * BALL_SPEEDUP, BALL_MAX);
    var angle = rel * (Math.PI / 3);                  // max 60 deg
    ball.vx = Math.cos(angle) * speed * dir;
    ball.vy = Math.sin(angle) * speed;
    ball.x = dir > 0 ? p.x + p.w + ball.r + 0.5 : p.x - ball.r - 0.5;
  }

  function point(winner) {
    score[winner]++;
    youScoreEl.textContent = score.you;
    aiScoreEl.textContent = score.ai;
    if (score.you >= WIN_SCORE) { endGame(true); return; }
    if (score.ai >= WIN_SCORE) { endGame(false); return; }
    // loser serves direction: send ball toward the player who just conceded
    resetPositions(winner === 'you' ? 1 : -1);
  }

  function update() {
    // --- player input ---
    if (keys.w) player.y -= PLAYER_SPEED;
    if (keys.s) player.y += PLAYER_SPEED;
    player.y = clamp(player.y, 0, H - player.h);

    // --- AI ---
    var aiCenter = ai.y + ai.h / 2;
    var ballComing = ball.vx > 0 || ball.x > W * AI_REACT_ZONE;
    var target = ballComing ? ball.y : H / 2;
    // small deadzone so it doesn't jitter
    if (Math.abs(target - aiCenter) > 6) {
      ai.y += Math.sign(target - aiCenter) * Math.min(AI_SPEED, Math.abs(target - aiCenter));
    }
    ai.y = clamp(ai.y, 0, H - ai.h);

    // --- ball ---
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
    if (ball.y + ball.r >= H) { ball.y = H - ball.r; ball.vy = -Math.abs(ball.vy); }

    // paddle collisions
    if (ball.vx < 0 &&
        ball.x - ball.r <= player.x + player.w &&
        ball.x - ball.r >= player.x - 4 &&
        ball.y >= player.y - ball.r && ball.y <= player.y + player.h + ball.r) {
      paddleHit(player, 1);
    }
    if (ball.vx > 0 &&
        ball.x + ball.r >= ai.x &&
        ball.x + ball.r <= ai.x + ai.w + 4 &&
        ball.y >= ai.y - ball.r && ball.y <= ai.y + ai.h + ball.r) {
      paddleHit(ai, -1);
    }

    // scoring
    if (ball.x + ball.r < 0) point('ai');
    else if (ball.x - ball.r > W) point('you');
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // center line
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);

    // paddles
    ctx.fillStyle = '#7dd3fc';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#f472b6';
    ctx.fillRect(ai.x, ai.y, ai.w, ai.h);

    // ball
    ctx.fillStyle = '#e6e6f0';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    if (running) update();
    draw();
    if (running || !over) requestAnimationFrame(loop);
    else draw();
  }

  // --- input ---
  keys = { w: false, s: false };
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'w') keys.w = true;
    else if (k === 's') keys.s = true;
    else if ((k === ' ' || k === 'enter') && over) { newGame(); loop(); }
    if (k === ' ' || k === 'arrowup' || k === 'arrowdown') e.preventDefault();
  });
  document.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'w') keys.w = false;
    else if (k === 's') keys.s = false;
  });
  // arrow keys as a bonus
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') keys.w = true;
    if (e.key === 'ArrowDown') keys.s = true;
  });
  document.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowUp') keys.w = false;
    if (e.key === 'ArrowDown') keys.s = false;
  });

  canvas.addEventListener('mousemove', function (e) {
    var rect = canvas.getBoundingClientRect();
    var y = (e.clientY - rect.top) * (H / rect.height);
    player.y = clamp(y - player.h / 2, 0, H - player.h);
  });

  restartBtn.addEventListener('click', function () {
    newGame();
    loop();
  });

  // initial static frame behind the start overlay
  score = { you: 0, ai: 0 };
  resetPositions(1);
  running = false;
  over = true;
  draw();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
