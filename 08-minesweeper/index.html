<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: 2px;
    color: #89b4fa;
  }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .controls button {
    padding: 6px 14px;
    border: 1px solid #45475a;
    border-radius: 6px;
    background: #313244;
    color: #cdd6f4;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .controls button:hover { background: #45475a; }
  .controls button.active { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; }

  .hud {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 14px;
    background: #313244;
    border: 1px solid #45475a;
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 300px;
    justify-content: space-between;
  }

  .hud .counter {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    color: #f38ba8;
    min-width: 60px;
    text-align: center;
  }

  #face {
    font-size: 26px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  #board {
    display: grid;
    gap: 0;
    background: #45475a;
    border: 3px solid #45475a;
    border-radius: 6px;
    overflow: hidden;
    touch-action: manipulation;
  }

  .cell {
    width: 32px;
    height: 32px;
    background: #585b70;
    border: 1px solid #45475a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.08s;
  }

  .cell:hover:not(.revealed) { background: #6c7086; }

  .cell.revealed {
    background: #313244;
    cursor: default;
  }

  .cell.mine-hit { background: #f38ba8; }

  .cell.flag { font-size: 15px; }

  .n1 { color: #89b4fa; }
  .n2 { color: #a6e3a1; }
  .n3 { color: #f38ba8; }
  .n4 { color: #cba6f7; }
  .n5 { color: #fab387; }
  .n6 { color: #94e2d5; }
  .n7 { color: #eba0ac; }
  .n8 { color: #9399b2; }

  #message {
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
    height: 24px;
  }

  #message.win { color: #a6e3a1; }
  #message.lose { color: #f38ba8; }

  .hint {
    margin-top: 10px;
    font-size: 12px;
    color: #7f849c;
  }
</style>
</head>
<body>
  <h1>MINESWEEPER</h1>

  <div class="controls">
    <button data-diff="easy" class="active">Easy 9×9</button>
    <button data-diff="medium">Medium 16×16</button>
    <button data-diff="hard">Hard 16×30</button>
  </div>

  <div class="hud">
    <div class="counter" id="mineCount">010</div>
    <button id="face" title="Restart">🙂</button>
    <div class="counter" id="timer">000</div>
  </div>

  <div id="board"></div>
  <div id="message"></div>
  <div class="hint">Left-click: reveal &nbsp;•&nbsp; Right-click / long-press: flag &nbsp;•&nbsp; Click number to chord</div>

<script>
(function () {
  'use strict';

  var DIFFICULTIES = {
    easy:   { rows: 9,  cols: 9,  mines: 10 },
    medium: { rows: 16, cols: 16, mines: 40 },
    hard:   { rows: 16, cols: 30, mines: 99 }
  };

  var board = document.getElementById('board');
  var mineCountEl = document.getElementById('mineCount');
  var timerEl = document.getElementById('timer');
  var faceBtn = document.getElementById('face');
  var messageEl = document.getElementById('message');
  var diffButtons = document.querySelectorAll('.controls button');

  var rows, cols, totalMines;
  var cells;          // { mine, revealed, flagged, count, el }
  var gameOver, gameWon, firstClick;
  var flagsUsed, revealedCount;
  var timerId, elapsed;

  function pad3(n) { return (n < 0 ? '-' : '') + String(Math.abs(n)).padStart(n < 0 ? 2 : 3, '0'); }

  function idx(r, c) { return r * cols + c; }
  function inBounds(r, c) { return r >= 0 && r < rows && c >= 0 && c < cols; }

  function neighbors(r, c, fn) {
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr, nc = c + dc;
        if (inBounds(nr, nc)) fn(nr, nc, cells[idx(nr, nc)]);
      }
    }
  }

  function init(diffKey) {
    var d = DIFFICULTIES[diffKey];
    rows = d.rows; cols = d.cols; totalMines = d.mines;
    cells = [];
    gameOver = false; gameWon = false; firstClick = true;
    flagsUsed = 0; revealedCount = 0;
    elapsed = 0;
    stopTimer();
    timerEl.textContent = '000';
    messageEl.textContent = '';
    messageEl.className = '';
    faceBtn.textContent = '🙂';

    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + cols + ', 32px)';

    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r;
        el.dataset.c = c;
        cells.push({ mine: false, revealed: false, flagged: false, count: 0, el: el });
        board.appendChild(el);
      }
    }
    updateMineCount();
  }

  function placeMines(safeR, safeC) {
    var forbidden = {};
    forbidden[idx(safeR, safeC)] = true;
    neighbors(safeR, safeC, function (nr, nc) { forbidden[idx(nr, nc)] = true; });

    var placed = 0;
    while (placed < totalMines) {
      var i = Math.floor(Math.random() * cells.length);
      if (cells[i].mine || forbidden[i]) continue;
      cells[i].mine = true;
      placed++;
    }
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var n = 0;
        neighbors(r, c, function (nr, nc, cell) { if (cell.mine) n++; });
        cells[idx(r, c)].count = n;
      }
    }
  }

  function updateMineCount() {
    mineCountEl.textContent = pad3(totalMines - flagsUsed);
  }

  function startTimer() {
    timerId = setInterval(function () {
      elapsed++;
      timerEl.textContent = pad3(Math.min(elapsed, 999));
    }, 1000);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function reveal(r, c) {
    var cell = cells[idx(r, c)];
    if (cell.revealed || cell.flagged) return;
    cell.revealed = true;
    revealedCount++;
    cell.el.classList.add('revealed');
    if (cell.count > 0) {
      cell.el.textContent = cell.count;
      cell.el.classList.add('n' + cell.count);
    }
    if (cell.count === 0 && !cell.mine) {
      neighbors(r, c, function (nr, nc, n) {
        if (!n.revealed && !n.flagged && !n.mine) reveal(nr, nc);
      });
    }
  }

  function revealAllMines(hitR, hitC) {
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      if (cell.mine) {
        cell.el.classList.add('revealed');
        if (!cell.flagged) cell.el.textContent = '💣';
      } else if (cell.flagged) {
        cell.el.textContent = '❌';
      }
    }
    cells[idx(hitR, hitC)].el.classList.add('mine-hit');
  }

  function checkWin() {
    if (revealedCount === rows * cols - totalMines) {
      gameOver = true; gameWon = true;
      stopTimer();
      faceBtn.textContent = '😎';
      messageEl.textContent = 'You win! 🎉';
      messageEl.className = 'win';
      for (var i = 0; i < cells.length; i++) {
        if (cells[i].mine && !cells[i].flagged) {
          cells[i].flagged = true;
          cells[i].el.classList.add('flag');
          cells[i].el.textContent = '🚩';
          flagsUsed++;
        }
      }
      updateMineCount();
    }
  }

  function lose(r, c) {
    gameOver = true;
    stopTimer();
    revealAllMines(r, c);
    faceBtn.textContent = '😵';
    messageEl.textContent = 'Boom! Game over.';
    messageEl.className = 'lose';
  }

  function handleReveal(r, c) {
    if (gameOver) return;
    var cell = cells[idx(r, c)];
    if (cell.flagged) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      startTimer();
    }

    if (cell.revealed) { chord(r, c); return; }

    if (cell.mine) { lose(r, c); return; }

    reveal(r, c);
    checkWin();
  }

  function chord(r, c) {
    var cell = cells[idx(r, c)];
    if (!cell.revealed || cell.count === 0) return;
    var flags = 0;
    neighbors(r, c, function (nr, nc, n) { if (n.flagged) flags++; });
    if (flags !== cell.count) return;
    var hitMine = false;
    var mineR, mineC;
    neighbors(r, c, function (nr, nc, n) {
      if (!n.revealed && !n.flagged) {
        if (n.mine) { hitMine = true; mineR = nr; mineC = nc; }
        else reveal(nr, nc);
      }
    });
    if (hitMine) lose(mineR, mineC);
    else checkWin();
  }

  function toggleFlag(r, c) {
    if (gameOver) return;
    var cell = cells[idx(r, c)];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    cell.el.classList.toggle('flag', cell.flagged);
    cell.el.textContent = cell.flagged ? '🚩' : '';
    flagsUsed += cell.flagged ? 1 : -1;
    updateMineCount();
  }

  board.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.classList.contains('cell')) return;
    handleReveal(+t.dataset.r, +t.dataset.c);
  });

  board.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var t = e.target;
    if (!t.classList.contains('cell')) return;
    toggleFlag(+t.dataset.r, +t.dataset.c);
  });

  // Long-press to flag on touch devices
  var pressTimer = null, pressTarget = null;
  board.addEventListener('touchstart', function (e) {
    var t = e.target;
    if (!t.classList.contains('cell')) return;
    pressTarget = t;
    pressTimer = setTimeout(function () {
      toggleFlag(+pressTarget.dataset.r, +pressTarget.dataset.c);
      pressTarget = null;
      pressTimer = null;
    }, 400);
  }, { passive: true });
  board.addEventListener('touchend', function () {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; pressTarget = null; }
  });
  board.addEventListener('touchmove', function () {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; pressTarget = null; }
  });

  faceBtn.addEventListener('click', function () { init(currentDiff); });

  var currentDiff = 'easy';
  diffButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      diffButtons.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentDiff = btn.dataset.diff;
      init(currentDiff);
    });
  });

  init(currentDiff);
})();
</script>
</body>
</html>
