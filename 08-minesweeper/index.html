<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- daylight:early -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">
<script src="../assets/audio-lifecycle.js?v=daylight1"></script>
<script src="../assets/stage-light.js?v=daylight1"></script>
<!-- /daylight:early -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minesweeper</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(90,140,255,.14), transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(160,90,255,.13), transparent 50%),
      linear-gradient(160deg, #161d33 0%, #0a0e1c 70%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    letter-spacing: 3px;
    margin-bottom: 12px;
    font-weight: 800;
    text-shadow: 0 0 20px rgba(90,140,255,.4);
  }
  h1 span { color: #7fb2ff; }

  .hud {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    padding: 5px 12px;
    min-width: 70px;
    text-align: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .58rem; text-transform: uppercase; letter-spacing: 1.5px; color: #8fa3d8; }
  .stat .value { font-weight: 700; font-variant-numeric: tabular-nums; }
  #mines { color: #ff9aa8; }

  #faceBtn {
    width: 46px; height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(90,140,255,.25), inset 0 0 10px rgba(0,0,0,.3);
    transition: transform .12s;
    padding: 4px;
  }
  #faceBtn svg { width: 100%; height: 100%; }
  #faceBtn:active { transform: scale(.92); }

  .diff-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .diff {
    background: rgba(255,255,255,.07);
    color: #cdd8f0;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .diff.active { background: linear-gradient(135deg, #5a8cff, #7fb2ff); color: #0a0e1c; box-shadow: 0 0 16px rgba(90,140,255,.5); }

  #flagBtn {
    display: none;
    background: rgba(255,80,110,.15);
    color: #ff9aa8;
    border: 1px solid rgba(255,120,140,.4);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    align-items: center;
    gap: 6px;
  }
  #flagBtn svg { width: 14px; height: 14px; vertical-align: -2px; }
  #flagBtn.on { background: linear-gradient(135deg, #ff5060, #ff8ea1); color: #1a0a10; box-shadow: 0 0 16px rgba(255,80,110,.5); }
  @media (pointer: coarse) { #flagBtn { display: inline-flex; } }

  #board {
    display: grid;
    gap: 2px;
    background: rgba(0,0,0,.45);
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 0 20px rgba(0,0,0,.3);
    touch-action: none;
  }
  #board.blast { animation: blast .5s ease; }
  @keyframes blast {
    0%, 100% { transform: translate(0,0); }
    20% { transform: translate(-5px, 3px); }
    40% { transform: translate(5px, -3px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(4px, 2px); }
  }

  .cell {
    width: var(--cell, 30px);
    height: var(--cell, 30px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: calc(var(--cell, 30px) * .52);
    border-radius: 4px;
    cursor: pointer;
    background: linear-gradient(145deg, #3d4c75, #2a3555);
    border: 1px solid rgba(140,170,255,.18);
    box-shadow: inset 0 2px 3px rgba(255,255,255,.08), inset 0 -2px 3px rgba(0,0,0,.3);
    transition: background .12s, transform .12s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) {
    .cell:not(.open):hover { background: linear-gradient(145deg, #4d5f8f, #354468); }
  }
  .cell.open {
    background: #161d33;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.55);
    cursor: default;
    animation: cellPop .18s ease;
  }
  @keyframes cellPop { from { transform: scale(.7); } to { transform: scale(1); } }
  .cell.bang { background: #ff5060; box-shadow: 0 0 18px rgba(255,80,96,.8); }
  .cell svg { width: 74%; height: 74%; }

  .n1 { color: #7fb2ff; } .n2 { color: #7de88a; } .n3 { color: #ff9aa8; } .n4 { color: #c9a8ff; }
  .n5 { color: #ffd166; } .n6 { color: #7df0ff; } .n7 { color: #ff9de2; } .n8 { color: #fff; }

  #status {
    margin-top: 14px;
    font-size: 1rem;
    font-weight: 700;
    color: #cdd8f0;
    min-height: 1.4em;
    text-align: center;
  }
  #status .newbest { color: #ffd166; text-shadow: 0 0 14px rgba(255,209,102,.6); }

  @media (max-width: 460px) {
    .hud { gap: 7px; }
    .stat { min-width: 60px; padding: 4px 8px; }
    #board { padding: 5px; }
  }
</style>

<link rel="stylesheet" href="../assets/stage-light.css?v=daylight1">

</head>
<body>

<h1>MINE<span>SWEEPER</span></h1>

<div class="hud">
  <div class="stat"><span class="label">Mines</span><span class="value" id="mines">10</span></div>
  <button id="faceBtn" title="Restart"></button>
  <div class="stat"><span class="label">Time</span><span class="value" id="time">0</span></div>
  <div class="stat"><span class="label">Best</span><span class="value" id="best">—</span></div>
</div>

<div class="diff-row">
  <button class="diff active" data-cfg="easy">Easy 9×9</button>
  <button class="diff" data-cfg="medium">Med 13×13</button>
  <button class="diff" data-cfg="hard">Hard 16×16</button>
</div>

<button id="flagBtn"><svg viewBox="0 0 16 16"><path d="M3 1 v14 M3 2 h9 l-2.6 3.5 L12.6 9 H3" fill="#ff8ea1" stroke="#ff8ea1" stroke-width="1"/></svg> FLAG MODE <span id="flagState">OFF</span></button>

<div id="board"></div>
<div id="status"></div>

<script>
(function () {
  'use strict';

  var CFG = {
    easy:   { r: 9,  c: 9,  mines: 10 },
    medium: { r: 13, c: 13, mines: 28 },
    hard:   { r: 16, c: 16, mines: 60 }
  };

  var FACES = {
    smile: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#ffd94d" stroke="#b8860b" stroke-width="2"/><circle cx="17" cy="19" r="3" fill="#332"/><circle cx="31" cy="19" r="3" fill="#332"/><path d="M15 30 C19 36 29 36 33 30" stroke="#332" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>',
    tense: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#ffd94d" stroke="#b8860b" stroke-width="2"/><circle cx="17" cy="19" r="3" fill="#332"/><circle cx="31" cy="19" r="3" fill="#332"/><ellipse cx="24" cy="32" rx="4" ry="5.5" fill="#332"/></svg>',
    cool:  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#ffd94d" stroke="#b8860b" stroke-width="2"/><rect x="10" y="15" width="13" height="8" rx="3" fill="#223"/><rect x="25" y="15" width="13" height="8" rx="3" fill="#223"/><rect x="21" y="17" width="6" height="3" fill="#223"/><path d="M16 31 C20 35 28 35 32 31" stroke="#332" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>',
    dead:  '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#ff9aa8" stroke="#a03448" stroke-width="2"/><path d="M13 15 l8 8 M21 15 l-8 8 M27 15 l8 8 M35 15 l-8 8" stroke="#332" stroke-width="2.6" stroke-linecap="round"/><path d="M15 34 C19 30 29 30 33 34" stroke="#332" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>'
  };
  var FLAG_SVG = '<svg viewBox="0 0 20 20"><path d="M5 1.5 v17" stroke="#8a97b8" stroke-width="1.6"/><path d="M5 2 h11 l-3.2 4 L16 10 H5 Z" fill="#ff5060"/></svg>';
  var MINE_SVG = '<svg viewBox="0 0 20 20"><circle cx="10" cy="11" r="6.5" fill="#23283a" stroke="#0b0e18" stroke-width="1"/><path d="M10 2 v4 M10 16 v4 M2 11 h4 M14 11 h4 M4.4 5.4 l2.8 2.8 M12.8 12.8 l2.8 2.8 M15.6 5.4 l-2.8 2.8 M7.2 12.8 l-2.8 2.8" stroke="#23283a" stroke-width="1.5" stroke-linecap="round"/><circle cx="7.8" cy="9" r="1.6" fill="rgba(255,255,255,.5)"/></svg>';
  var WRONG_SVG = '<svg viewBox="0 0 20 20"><path d="M4 4 L16 16 M16 4 L4 16" stroke="#ff5060" stroke-width="2.6" stroke-linecap="round"/></svg>';

  var board = document.getElementById('board');
  var minesEl = document.getElementById('mines');
  var timeEl = document.getElementById('time');
  var bestEl = document.getElementById('best');
  var faceBtn = document.getElementById('faceBtn');
  var flagBtn = document.getElementById('flagBtn');
  var flagState = document.getElementById('flagState');
  var statusEl = document.getElementById('status');

  var cfgName = 'easy', cfg = CFG.easy;
const arcadePlus = (new URLSearchParams(location.search).get('mode') === 'plus');
  var grid = [], cells = [];
  var R, C, M;
  var flags = 0, opened = 0, gameOver = false, started = false;
  var time = 0, timer = null;
  var flagMode = false;

  // ---------- audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, type, f) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var len = Math.floor(c.sampleRate * d);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var fl = c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.value = f || 700;
    var g = c.createGain(); g.gain.setValueAtTime(v || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(c.destination); src.start(t);
  }
  var sfx = {
    reveal:  function () { tone(500, 0.05, 'sine', 0.04, 650); },
    cascade: function () { tone(400, 0.06, 'sine', 0.035, 700); noiseSfx(0.06, 0.02, 'highpass', 1500); },
    flag:    function () { tone(700, 0.06, 'triangle', 0.05); },
    unflag:  function () { tone(450, 0.06, 'triangle', 0.04); },
    boom:    function () { noiseSfx(0.5, 0.16, 'lowpass', 320); tone(110, 0.45, 'sawtooth', 0.07, 45); },
    win:     function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'triangle', 0.07, null, i * 0.09); }); },
    tick:    function () { tone(880, 0.04, 'sine', 0.035); }
  };

  function bestKey() { return 'mines_best_' + cfgName + (arcadePlus ? '_plus' : ''); }
  function getBest() {
    try { var v = localStorage.getItem(bestKey()); return v ? parseInt(v, 10) : null; } catch (e) { return null; }
  }
  function setBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }

  function setFace(name) { faceBtn.innerHTML = FACES[name]; }

  function cellSize() {
    var maxW = Math.min(window.innerWidth - 40, 520);
    var s = Math.floor((maxW - 16 - (C - 1) * 2) / C);
    return Math.max(13, Math.min(34, s));
  }

  function newGame() {
    cfg = CFG[cfgName];
    R = cfg.r; C = cfg.c; M = cfg.mines;
    grid = []; cells = [];
    flags = 0; opened = 0; gameOver = false; started = false;
    time = 0;
    clearInterval(timer); timer = null;
    timeEl.textContent = '0';
    minesEl.textContent = M;
    statusEl.textContent = '';
    setFace('smile');
    var b = getBest();
    bestEl.textContent = b == null ? '—' : b + 's';

    board.innerHTML = '';
    board.style.gridTemplateColumns = 'repeat(' + C + ', var(--cell))';
    board.style.setProperty('--cell', cellSize() + 'px');

    for (var r = 0; r < R; r++) {
      grid[r] = [];
      for (var c = 0; c < C; c++) {
        grid[r][c] = { mine: false, open: false, flag: false, n: 0 };
        var el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r; el.dataset.c = c;
        cells.push(el);
        board.appendChild(el);
      }
    }
  }

  function placeMines(sr, sc) {
    var placed = 0;
    while (placed < M) {
      var r = Math.floor(Math.random() * R);
      var c = Math.floor(Math.random() * C);
      if (grid[r][c].mine) continue;
      if (Math.abs(r - sr) <= 1 && Math.abs(c - sc) <= 1) continue; // safe first click
      grid[r][c].mine = true;
      placed++;
    }
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      if (grid[r][c].mine) continue;
      var n = 0;
      for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < R && cc >= 0 && cc < C && grid[rr][cc].mine) n++;
      }
      grid[r][c].n = n;
    }
  }

  function cellAt(r, c) { return cells[r * C + c]; }

  function startClock() {
    if (timer) return;
    timer = setInterval(function () {
      time++;
      timeEl.textContent = time;
      if (time % 60 === 0) sfx.tick();
    }, 1000);
  }

  function openCell(r, c, cascade) {
    if (r < 0 || r >= R || c < 0 || c >= C) return;
    var cell = grid[r][c];
    if (cell.open || cell.flag) return;
    cell.open = true;
    opened++;
    var el = cellAt(r, c);
    el.classList.add('open');
    if (cell.mine) {
      el.innerHTML = MINE_SVG;
      el.classList.add('bang');
      lose(r, c);
      return;
    }
    if (cell.n > 0) {
      el.textContent = cell.n;
      el.classList.add('n' + cell.n);
      if (!cascade) sfx.reveal();
    } else {
      sfx.cascade();
      for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
        if (dr || dc) openCell(r + dr, c + dc, true);
      }
    }
    if (!gameOver && opened === R * C - M) win();
  }

  function toggleFlag(r, c) {
    var cell = grid[r][c];
    if (cell.open) return;
    cell.flag = !cell.flag;
    flags += cell.flag ? 1 : -1;
    cellAt(r, c).innerHTML = cell.flag ? FLAG_SVG : '';
    minesEl.textContent = M - flags;
    if (cell.flag) sfx.flag(); else sfx.unflag();
  }

  function lose(br, bc) {
    gameOver = true;
    clearInterval(timer); timer = null;
    setFace('dead');
    sfx.boom();
    board.classList.add('blast');
    setTimeout(function () { board.classList.remove('blast'); }, 550);
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      var cell = grid[r][c];
      var el = cellAt(r, c);
      if (cell.mine && !cell.flag && !(r === br && c === bc)) { el.innerHTML = MINE_SVG; el.classList.add('open'); }
      if (cell.flag && !cell.mine) { el.innerHTML = WRONG_SVG; el.classList.add('open'); }
    }
    statusEl.textContent = 'BOOM! Click the face to try again.';
  }

  function win() {
    gameOver = true;
    clearInterval(timer); timer = null;
    setFace('cool');
    sfx.win();
    // auto-flag remaining mines
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) {
      if (grid[r][c].mine && !grid[r][c].flag) cellAt(r, c).innerHTML = FLAG_SVG;
    }
    var b = getBest();
    if (b == null || time < b) {
      setBest(time);
      statusEl.innerHTML = 'Cleared in ' + time + 's — <span class="newbest">NEW BEST!</span>';
      bestEl.textContent = time + 's';
    } else {
      statusEl.textContent = 'Cleared in ' + time + 's! Best: ' + b + 's';
    }
  }

  var suppressClick = false;
  board.addEventListener('click', function (e) {
    var el = e.target.closest('.cell');
    if (!el || gameOver || suppressClick) { suppressClick = false; return; }
    var r = +el.dataset.r, c = +el.dataset.c;
    if (arcadePlus && started && grid[r][c].open && grid[r][c].n > 0 && !flagMode) {
      var neighbors=[];
      for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++) {
        if((dr || dc) && grid[r+dr] && grid[r+dr][c+dc]) neighbors.push([r+dr,c+dc]);
      }
      if(neighbors.filter(pos=>grid[pos[0]][pos[1]].flag).length===grid[r][c].n) {
        for(const [nr,nc] of neighbors) { if (gameOver) break; openCell(nr,nc,false); }
      }
      return;
    }
    ac();
    if (flagMode) { toggleFlag(r, c); return; }
    if (!started) { placeMines(r, c); started = true; startClock(); }
    if (grid[r][c].flag) return;
    openCell(r, c, false);
  });

  board.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var el = e.target.closest('.cell');
    if (!el || gameOver) return;
    ac();
    toggleFlag(+el.dataset.r, +el.dataset.c);
  });

  // long-press to flag on touch
  var lpTimer = null, lpTarget = null;
  board.addEventListener('touchstart', function (e) {
    var el = e.target.closest('.cell');
    if (!el || gameOver || flagMode) return;
    lpTarget = el;
    lpTimer = setTimeout(function () {
      ac();
      toggleFlag(+lpTarget.dataset.r, +lpTarget.dataset.c);
      lpTarget = null;
      suppressClick = true;
    }, 380);
  }, { passive: true });
  board.addEventListener('touchend', function () { clearTimeout(lpTimer); lpTarget = null; });
  board.addEventListener('touchmove', function () { clearTimeout(lpTimer); lpTarget = null; });

  flagBtn.addEventListener('click', function () {
    flagMode = !flagMode;
    flagBtn.classList.toggle('on', flagMode);
    flagState.textContent = flagMode ? 'ON' : 'OFF';
    sfx.tick();
  });

  faceBtn.addEventListener('click', function () { ac(); newGame(); });

  document.querySelectorAll('.diff').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.diff').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      cfgName = b.dataset.cfg;
      ac();
      newGame();
    });
  });

  window.addEventListener('resize', function () {
    board.style.setProperty('--cell', cellSize() + 'px');
  });

  newGame();

  window.__arcadeNativeUpgrade = {"id": 8, "name": "Chord Sweep", "description": "tap a revealed number when nearby flags match it to open neighboring squares in one action. The first move stays safe."};
  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":8,"label":"Safe field revealed","goals":[35,75,100],"note":"Uncover safe squares. Flags and detonated mines do not count.","seconds":420}, { read: () => { return (Math.floor(100 * grid.flat().filter(c => c.open && !c.mine).length / (R*C - M))); } });
})();
</script>


<script src="../assets/aaa-arcade.js?v=daylight1" defer></script>
<script src="../assets/features.js?v=daylight1" defer></script>
<script src="../assets/missions.js?v=daylight1" defer></script>
</body>
