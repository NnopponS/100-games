<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hangman</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background:
      radial-gradient(ellipse 70% 45% at 50% -8%, rgba(233,69,96,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 90% 105%, rgba(90,60,180,0.15) 0%, transparent 55%),
      linear-gradient(160deg, #0d0d1f 0%, #12122e 50%, #0a0a1a 100%);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 14px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  h1 {
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    letter-spacing: 8px;
    margin-bottom: 2px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff 15%, #ff8896 55%, #e94560 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(233,69,96,0.55));
  }
  .subtitle { color: #7d84a8; margin-bottom: 12px; font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; }
  .game {
    display: flex;
    gap: 26px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
    max-width: 900px;
  }
  .left { display: flex; flex-direction: column; align-items: center; }
  .stage {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% 8%, rgba(233,69,96,0.14) 0%, transparent 55%),
      linear-gradient(180deg, #16163a 0%, #0d0d22 100%);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.55), 0 0 40px rgba(233,69,96,0.10);
  }
  canvas { display: block; width: min(300px, 78vw); height: auto; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(233,20,60,0.5) 100%);
    opacity: 0; transition: opacity .4s;
  }
  #vignette.crit { animation: vpulse 1.1s ease-in-out infinite alternate; }
  @keyframes vpulse { from { filter: brightness(1); } to { filter: brightness(1.6); } }
  .status {
    margin-top: 12px;
    font-size: .92rem;
    min-height: 1.5em;
    color: #f0c75e;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 5px 16px;
    border-radius: 999px;
    background: rgba(240,199,94,0.08);
    border: 1px solid rgba(240,199,94,0.2);
  }
  .right {
    flex: 1;
    min-width: 280px;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hint { font-size: .82rem; color: #7d84a8; margin-bottom: 4px; letter-spacing: .15em; text-transform: uppercase; }
  .hint span { color: #f0c75e; font-weight: 800; }
  .word { display: flex; gap: 7px; margin: 12px 0 18px; flex-wrap: wrap; justify-content: center; }
  .slot {
    width: 32px; height: 44px;
    border-bottom: 3px solid #e94560;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.55rem; font-weight: 800; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 14px rgba(233,69,96,0.5);
    position: relative;
  }
  .slot::after {
    content: ''; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(233,69,96,0.55);
    box-shadow: 0 0 8px rgba(233,69,96,0.8);
  }
  .slot.space { border-bottom-color: transparent; width: 14px; }
  .slot.space::after { display: none; }
  .slot.reveal { animation: letterPop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes letterPop { 0% { transform: scale(.3) rotate(-14deg); color: #4ade80; } 100% { transform: scale(1); } }
  .misses { font-size: .85rem; color: #7d84a8; margin-bottom: 14px; min-height: 1.4em; }
  .misses b { color: #ff6b81; letter-spacing: 3px; font-weight: 800; }
  .keyboard { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 420px; }
  .krow { display: flex; gap: 6px; justify-content: center; }
  .key {
    flex: 1; max-width: 38px;
    padding: 11px 0;
    font-size: .95rem; font-weight: 800; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    background: linear-gradient(180deg, #2e2e52, #23233f);
    color: #dfe4ff;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
    transition: transform .07s, background .15s, box-shadow .07s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.35); }
  @media (hover: hover) { .key:hover:not(:disabled) { background: #3d3d68; transform: translateY(-1px); } }
  .key:disabled { cursor: default; }
  .key.good { background: linear-gradient(180deg, #1f8a52, #14663b); border-color: rgba(74,222,128,0.5); color: #c8ffd9; box-shadow: 0 0 14px rgba(74,222,128,0.35); }
  .key.bad { background: #33202c; color: #5a4a55; border-color: rgba(233,69,96,0.25); box-shadow: none; }
  .controls { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .restart {
    padding: 11px 28px;
    font-size: .85rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, #ff5f7a, #e94560);
    color: #fff; cursor: pointer;
    box-shadow: 0 6px 20px rgba(233,69,96,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .1s, filter .15s;
    font-family: inherit;
    touch-action: manipulation;
  }
  .restart:active { transform: translateY(1px); }
  @media (hover: hover) { .restart:hover { filter: brightness(1.12); transform: translateY(-2px); } }
  .diff { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); }
  .diff button {
    font: inherit; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    padding: 11px 14px; border: none; cursor: pointer;
    background: rgba(255,255,255,0.06); color: #8b93b8;
    touch-action: manipulation;
  }
  .diff button.sel { background: linear-gradient(135deg, #e94560, #a52e63); color: #fff; box-shadow: 0 0 14px rgba(233,69,96,0.4); }
  .stats { margin-top: 14px; display: flex; gap: 10px; font-size: .78rem; font-weight: 700; }
  .stats span { padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.11); color: #9aa3c7; }
  .stats b { color: #f0c75e; margin-left: 3px; }
  .overlay {
    position: fixed; inset: 0;
    background: rgba(8,8,20,.78);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 10; opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .panel {
    background: linear-gradient(165deg, #1b1b3d, #10101f);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 22px;
    padding: 34px 46px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    transform: translateY(14px) scale(.94);
    transition: transform .3s cubic-bezier(.2,1.4,.4,1);
    max-width: 90vw;
  }
  .overlay.show .panel { transform: translateY(0) scale(1); }
  .panel h2 { font-size: 2.1rem; margin-bottom: 8px; letter-spacing: .1em; }
  .panel.win h2 { color: #4ade80; text-shadow: 0 0 26px rgba(74,222,128,0.6); }
  .panel.lose h2 { color: #ff5f7a; text-shadow: 0 0 26px rgba(233,69,96,0.65); }
  .panel p { color: #aab; margin-bottom: 20px; }
  .panel b { color: #f0c75e; text-transform: uppercase; letter-spacing: 2px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }
  @media (max-width: 520px) {
    .game { gap: 16px; }
    .slot { width: 26px; height: 38px; font-size: 1.25rem; }
    .key { padding: 10px 0; }
  }
</style>
</head>
<body>
<h1>HANGMAN</h1>
<div class="subtitle">Six strokes from the gallows</div>

<div class="game">
  <div class="left">
    <div class="stage" id="stage">
      <canvas id="gallows" width="300" height="320"></canvas>
      <div id="vignette"></div>
    </div>
    <div class="status" id="status">6 misses remaining</div>
  </div>
  <div class="right">
    <div class="hint">Category: <span id="category"></span></div>
    <div class="word" id="word"></div>
    <div class="misses">Wrong: <b id="misses"></b></div>
    <div class="keyboard" id="keyboard"></div>
    <div class="controls">
      <button class="restart" id="restart">New Game</button>
      <div class="diff" id="diff">
        <button data-d="0">Chill</button><button data-d="1" class="sel">Classic</button><button data-d="2">Brutal</button>
      </div>
    </div>
    <div class="stats">
      <span>Wins<b id="sW">0</b></span>
      <span>Losses<b id="sL">0</b></span>
      <span>Streak<b id="sS">0</b></span>
      <span>Best<b id="sB">0</b></span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <button class="restart" id="overlayRestart">Play Again</button>
  </div>
</div>

<script>
'use strict';
const WORDS = [
  { word: 'JAVASCRIPT', cat: 'Programming' }, { word: 'PYTHON', cat: 'Programming' },
  { word: 'ALGORITHM', cat: 'Programming' }, { word: 'DATABASE', cat: 'Programming' },
  { word: 'KEYBOARD', cat: 'Objects' }, { word: 'TELESCOPE', cat: 'Objects' },
  { word: 'UMBRELLA', cat: 'Objects' }, { word: 'BACKPACK', cat: 'Objects' },
  { word: 'ELEPHANT', cat: 'Animals' }, { word: 'PENGUIN', cat: 'Animals' },
  { word: 'CROCODILE', cat: 'Animals' }, { word: 'BUTTERFLY', cat: 'Animals' },
  { word: 'MOUNTAIN', cat: 'Nature' }, { word: 'WATERFALL', cat: 'Nature' },
  { word: 'HURRICANE', cat: 'Nature' }, { word: 'SUNFLOWER', cat: 'Nature' },
  { word: 'CHOCOLATE', cat: 'Food' }, { word: 'SPAGHETTI', cat: 'Food' },
  { word: 'PINEAPPLE', cat: 'Food' }, { word: 'HAMBURGER', cat: 'Food' },
  { word: 'ASTRONAUT', cat: 'Space' }, { word: 'GALAXY', cat: 'Space' },
  { word: 'SATELLITE', cat: 'Space' }, { word: 'SPACESHIP', cat: 'Space' },
  { word: 'DINOSAUR', cat: 'History' }, { word: 'PYRAMID', cat: 'History' },
  { word: 'GLADIATOR', cat: 'History' }, { word: 'TREASURE', cat: 'Adventure' },
  { word: 'ADVENTURE', cat: 'Adventure' }, { word: 'LIGHTHOUSE', cat: 'Places' },
  { word: 'CATHEDRAL', cat: 'Places' }, { word: 'VOLCANO', cat: 'Places' },
  { word: 'XYLOPHONE', cat: 'Music' }, { word: 'SAXOPHONE', cat: 'Music' },
  { word: 'ORCHESTRA', cat: 'Music' }, { word: 'MYSTERY', cat: 'Words' },
  { word: 'LABYRINTH', cat: 'Words' }, { word: 'PARADOX', cat: 'Words' },
  { word: 'QUICKSILVER', cat: 'Words' }, { word: 'JUXTAPOSE', cat: 'Words' }
];
const KROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const DIFF = [
  { maxLen: 7, freebie: true },
  { maxLen: 99, freebie: false },
  { minLen: 8, freebie: false }
];
const MAX_MISSES = 6;

// ---------- Procedural SFX ----------
const SFX = (() => {
  let ctx = null;
  function ac() {
    if (ctx === null) { const A = window.AudioContext || window.webkitAudioContext; ctx = A ? new A() : false; }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx || null;
  }
  const ok = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type, v, slide, when) {
    if (!ok()) return; const c = ac(); if (!c) return;
    try {
      const t = c.currentTime + (when || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(v || 0.08, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noise(dur, v, fq, when) {
    if (!ok()) return; const c = ac(); if (!c) return;
    try {
      const t = c.currentTime + (when || 0), n = Math.floor(c.sampleRate * dur);
      const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = c.createBufferSource(); s.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq || 1200;
      const g = c.createGain(); g.gain.value = v || 0.1;
      s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
    } catch (e) {}
  }
  return {
    unlock: ac,
    key: () => tone(900 + Math.random() * 200, 0.035, 'triangle', 0.03),
    good: () => { tone(660, 0.1, 'triangle', 0.07, 880); tone(1320, 0.14, 'sine', 0.05, null, 0.07); },
    bad: () => { tone(180, 0.22, 'sawtooth', 0.07, 110); noise(0.16, 0.08, 500, 0.02); },
    reveal: () => { [523, 659, 784].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, null, i * 0.07)); },
    win: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.09, null, i * 0.09)); },
    lose: () => { [330, 277, 220, 165].forEach((f, i) => { tone(f, 0.3, 'sawtooth', 0.055, f * 0.9, i * 0.16); }); noise(0.7, 0.05, 300, 0.3); }
  };
})();
window.addEventListener('pointerdown', SFX.unlock, { passive: true });
window.addEventListener('keydown', SFX.unlock);

const canvas = document.getElementById('gallows');
const ctx = canvas.getContext('2d');
const stageEl = document.getElementById('stage');
const vignette = document.getElementById('vignette');
const wordEl = document.getElementById('word');
const keyboardEl = document.getElementById('keyboard');
const missesEl = document.getElementById('misses');
const statusEl = document.getElementById('status');
const categoryEl = document.getElementById('category');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const resultTitle = document.getElementById('resultTitle');
const resultText = document.getElementById('resultText');

let answer, guessed, misses, gameOver, diff = 1;
let stats = { w: 0, l: 0, streak: 0, best: 0 };
try { Object.assign(stats, JSON.parse(localStorage.getItem('hm_stats') || '{}')); } catch (e) {}
diff = +(localStorage.getItem('hm_diff') || 1);

// Stroke-based drawing: gallows = part 0, body parts 1..6
const GALLOWS = [
  { t: 'l', v: [40, 300, 180, 300] }, { t: 'l', v: [80, 300, 80, 40] },
  { t: 'l', v: [80, 40, 210, 40] }, { t: 'l', v: [210, 40, 210, 70] }
];
const BODY = [
  [{ t: 'a', v: [210, 88, 18, 0, Math.PI * 2] }],                                    // head
  [{ t: 'l', v: [210, 106, 210, 190] }],                                             // body
  [{ t: 'l', v: [210, 125, 175, 160] }],                                             // left arm
  [{ t: 'l', v: [210, 125, 245, 160] }],                                             // right arm
  [{ t: 'l', v: [210, 190, 180, 235] }],                                             // left leg
  [{ t: 'l', v: [210, 190, 240, 235] },                                              // right leg
    { t: 'l', v: [202, 82, 208, 90] }, { t: 'l', v: [208, 82, 202, 90] },              // X eye L
    { t: 'l', v: [212, 82, 218, 90] }, { t: 'l', v: [218, 82, 212, 90] },              // X eye R
    { t: 'a', v: [210, 100, 5, 0, Math.PI] }]                                        // frown
];
let drawAnim = null;   // {part:-1|idx, p:0..1}

function strokePath(s, prog) {
  if (s.t === 'l') {
    const [x1, y1, x2, y2] = s.v;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + (x2 - x1) * prog, y1 + (y2 - y1) * prog);
    ctx.stroke();
  } else {
    const [cx, cy, r, a0, a1] = s.v;
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, a0 + (a1 - a0) * prog);
    ctx.stroke();
  }
}

function drawScene() {
  ctx.clearRect(0, 0, 300, 320);
  // floor glow
  const fg = ctx.createLinearGradient(0, 300, 0, 320);
  fg.addColorStop(0, 'rgba(233,69,96,0.25)'); fg.addColorStop(1, 'transparent');
  ctx.fillStyle = fg; ctx.fillRect(0, 300, 300, 20);
  ctx.lineWidth = 4; ctx.lineCap = 'round';

  // gallows in warm wood tone w/ glow
  ctx.strokeStyle = '#b8a888';
  ctx.shadowColor = 'rgba(240,199,94,0.35)'; ctx.shadowBlur = 8;
  const gp = drawAnim && drawAnim.part === -1 ? drawAnim.p : 1;
  const per = 1 / GALLOWS.length;
  GALLOWS.forEach((s, i) => {
    const lp = Math.min(1, Math.max(0, (gp - i * per) / per));
    if (lp > 0) strokePath(s, lp);
  });
  ctx.shadowBlur = 0;
  if (gp < 1) return;

  // body parts: icy neon figure
  const n = misses.length;
  ctx.strokeStyle = '#dfe6ff';
  ctx.shadowColor = 'rgba(160,190,255,0.6)'; ctx.shadowBlur = 10;
  for (let i = 0; i < n && i < BODY.length; i++) {
    const isDead = i === BODY.length - 1;
    if (isDead) { ctx.strokeStyle = '#ff5f7a'; ctx.shadowColor = 'rgba(233,69,96,0.8)'; }
    const lp = (drawAnim && drawAnim.part === i) ? drawAnim.p : 1;
    BODY[i].forEach(s => strokePath(s, lp));
  }
  ctx.shadowBlur = 0;
}

function animateDraw(part, dur) {
  const t0 = performance.now();
  drawAnim = { part, p: 0 };
  (function step(now) {
    drawAnim.p = Math.min(1, (now - t0) / dur);
    drawScene();
    if (drawAnim.p < 1) requestAnimationFrame(step);
    else drawAnim = null;
  })(t0);
}

function pickWord() {
  const d = DIFF[diff];
  const pool = WORDS.filter(w => (!d.maxLen || w.word.length <= d.maxLen) && (!d.minLen || w.word.length >= d.minLen));
  return pool[Math.floor(Math.random() * pool.length)];
}

function newGame() {
  const pick = pickWord();
  answer = pick.word.toUpperCase();
  categoryEl.textContent = pick.cat;
  guessed = new Set();
  if (DIFF[diff].freebie) {
    const letters = [...new Set(answer.replace(/ /g, ''))];
    guessed.add(letters[Math.floor(Math.random() * letters.length)]);
  }
  misses = [];
  gameOver = false;
  overlay.classList.remove('show');
  buildKeyboard();
  renderWord();
  updateStatus();
  updateStats();
  animateDraw(-1, 500);
}

function buildKeyboard() {
  keyboardEl.innerHTML = '';
  for (const row of KROWS) {
    const r = document.createElement('div');
    r.className = 'krow';
    for (const ch of row) {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.textContent = ch;
      btn.dataset.key = ch;
      btn.addEventListener('click', () => guess(ch));
      r.appendChild(btn);
    }
    keyboardEl.appendChild(r);
  }
}

function renderWord(revealCh) {
  wordEl.innerHTML = '';
  for (const ch of answer) {
    const slot = document.createElement('div');
    if (ch === ' ') { slot.className = 'slot space'; }
    else {
      slot.className = 'slot';
      if (guessed.has(ch)) {
        slot.textContent = ch;
        if (ch === revealCh) slot.classList.add('reveal');
      }
    }
    wordEl.appendChild(slot);
  }
  missesEl.textContent = misses.join(' ');
}

function guess(ch) {
  if (gameOver || guessed.has(ch)) return;
  guessed.add(ch);
  const btn = keyboardEl.querySelector(`[data-key="${ch}"]`);
  if (answer.includes(ch)) {
    btn.classList.add('good');
    SFX.good();
    renderWord(ch);
  } else {
    btn.classList.add('bad');
    misses.push(ch);
    SFX.bad();
    stageEl.classList.remove('shake'); void stageEl.offsetWidth;
    stageEl.classList.add('shake');
    renderWord();
    animateDraw(misses.length - 1, 320);
    vignette.style.opacity = Math.min(0.85, misses.length / MAX_MISSES);
    vignette.classList.toggle('crit', misses.length >= MAX_MISSES - 2);
  }
  btn.disabled = true;
  updateStatus();
  checkEnd();
}

function updateStatus() {
  const left = MAX_MISSES - misses.length;
  statusEl.textContent = gameOver ? '' : `${left} miss${left === 1 ? '' : 'es'} remaining`;
}

function updateStats() {
  document.getElementById('sW').textContent = stats.w;
  document.getElementById('sL').textContent = stats.l;
  document.getElementById('sS').textContent = stats.streak;
  document.getElementById('sB').textContent = stats.best;
}

function checkEnd() {
  const won = [...answer].every(c => c === ' ' || guessed.has(c));
  const lost = misses.length >= MAX_MISSES;
  if (!won && !lost) return;
  gameOver = true;
  if (won) {
    stats.w++; stats.streak++; stats.best = Math.max(stats.best, stats.streak);
    SFX.win();
    endPanel('win', 'YOU WIN!', `Great job — <b>${answer}</b> lives to see another day. Streak: ${stats.streak}`);
  } else {
    stats.l++; stats.streak = 0;
    SFX.lose();
    [...answer].forEach(c => { if (c !== ' ') guessed.add(c); });
    renderWord();
    endPanel('lose', 'GAME OVER', `The word was <b>${answer}</b>`);
  }
  localStorage.setItem('hm_stats', JSON.stringify(stats));
  updateStatus();
  updateStats();
  setTimeout(() => overlay.classList.add('show'), 650);
}

function endPanel(cls, title, html) {
  panel.className = 'panel ' + cls;
  resultTitle.textContent = title;
  resultText.innerHTML = html;
}

document.addEventListener('keydown', e => {
  const ch = e.key.toUpperCase();
  if (/^[A-Z]$/.test(ch) && !overlay.classList.contains('show')) { SFX.key(); guess(ch); }
  if (e.key === 'Enter' && overlay.classList.contains('show')) newGame();
});

document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('overlayRestart').addEventListener('click', newGame);
document.getElementById('diff').addEventListener('click', function (e) {
  const b = e.target.closest('button'); if (!b) return;
  diff = +b.dataset.d;
  localStorage.setItem('hm_diff', diff);
  this.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
  newGame();
});
document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('sel', +b.dataset.d === diff));

newGame();
</script>
