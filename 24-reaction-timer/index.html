<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Reaction Timer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #pad {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    cursor: pointer;
    transition: background 0.12s ease;
    padding: 24px;
    text-align: center;
    color: #fff;
  }
  .bg-idle    { background: #2b2d42; }
  .bg-wait    { background: #c0392b; }
  .bg-go      { background: #27ae60; transition: none; }
  .bg-fail    { background: #e67e22; }
  .bg-result  { background: #2b2d42; }
  .bg-done    { background: #1d3557; }

  #big {
    font-size: clamp(40px, 9vw, 96px);
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  #sub {
    font-size: clamp(16px, 3vw, 24px);
    opacity: 0.85;
    max-width: 640px;
  }
  #hud {
    position: fixed;
    top: 14px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    color: rgba(255,255,255,0.9);
    pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #rounds {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .dot {
    min-width: 64px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .dot.ok   { background: rgba(46,204,113,0.35); }
  .dot.bad  { background: rgba(231,76,60,0.45); }
  #restart {
    margin-top: 10px;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 34px;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #1d3557;
    cursor: pointer;
    display: none;
  }
  #restart:hover { transform: scale(1.04); }
  .hint { font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
<div id="pad" class="bg-idle">
  <div id="hud"><span id="roundLabel">Reaction Timer</span><span id="avgLabel"></span></div>
  <div id="big">Click to start</div>
  <div id="sub">Wait for the screen to turn green, then click as fast as you can.<br>
    Click too early and the round is failed. Best of 5 &mdash; lowest average wins.</div>
  <div id="rounds"></div>
  <button id="restart">Play again</button>
  <div class="hint">Spacebar works too &middot; 5 rounds</div>
</div>

<script>
(function () {
  var pad = document.getElementById('pad');
  var big = document.getElementById('big');
  var sub = document.getElementById('sub');
  var dots = document.getElementById('rounds');
  var restartBtn = document.getElementById('restart');
  var roundLabel = document.getElementById('roundLabel');
  var avgLabel = document.getElementById('avgLabel');

  var TOTAL = 5;
  var state = 'idle';      // idle | wait | go | between | fail | done
  var results = [];        // {ms: number|null, fail: bool}
  var timer = null;
  var goTime = 0;

  function setState(bg, bigText, subText) {
    pad.className = bg;
    big.textContent = bigText;
    sub.innerHTML = subText || '';
  }

  function updateHud() {
    var n = Math.min(results.length + 1, TOTAL);
    roundLabel.textContent = results.length >= TOTAL ? 'Done' : 'Round ' + n + ' / ' + TOTAL;
    var times = results.filter(function (r) { return !r.fail; }).map(function (r) { return r.ms; });
    avgLabel.textContent = times.length ? 'Avg ' + Math.round(avg(times)) + ' ms' : '';
  }

  function renderDots() {
    dots.innerHTML = '';
    for (var i = 0; i < TOTAL; i++) {
      var d = document.createElement('div');
      d.className = 'dot';
      var r = results[i];
      if (!r) d.textContent = '—';
      else if (r.fail) { d.textContent = 'FAIL'; d.classList.add('bad'); }
      else { d.textContent = Math.round(r.ms) + ' ms'; d.classList.add('ok'); }
      dots.appendChild(d);
    }
  }

  function avg(arr) {
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return s / arr.length;
  }

  function startWait() {
    state = 'wait';
    setState('bg-wait', 'Wait for green…', 'Do not click yet!');
    var delay = 1200 + Math.random() * 2800;
    timer = setTimeout(function () {
      state = 'go';
      goTime = performance.now();
      setState('bg-go', 'CLICK!', '');
    }, delay);
  }

  function nextOrFinish() {
    updateHud();
    renderDots();
    if (results.length >= TOTAL) {
      finish();
    } else {
      state = 'between';
      timer = setTimeout(startWait, 900);
    }
  }

  function finish() {
    state = 'done';
    var times = results.filter(function (r) { return !r.fail; }).map(function (r) { return r.ms; });
    var fails = results.length - times.length;
    if (times.length) {
      var best = Math.min.apply(null, times);
      var a = avg(times);
      var verdict = a < 200 ? 'Superhuman!' : a < 250 ? 'Blazing fast!' :
                    a < 300 ? 'Great reflexes!' : a < 400 ? 'Not bad.' : 'Keep practicing.';
      setState('bg-done', Math.round(a) + ' ms avg',
        'Best: ' + Math.round(best) + ' ms' +
        (fails ? ' &middot; ' + fails + ' failed round' + (fails > 1 ? 's' : '') : '') +
        '<br>' + verdict);
    } else {
      setState('bg-done', 'All failed!', 'Every click was too early. Patience, young grasshopper.');
    }
    restartBtn.style.display = 'inline-block';
  }

  function handlePress() {
    if (state === 'idle') {
      restartBtn.style.display = 'none';
      results = [];
      renderDots();
      updateHud();
      state = 'between';
      startWait();
    } else if (state === 'wait') {
      clearTimeout(timer);
      state = 'fail-flash';
      results.push({ fail: true });
      setState('bg-fail', 'Too soon!', 'You clicked before it turned green. Round failed.');
      renderDots();
      timer = setTimeout(nextOrFinish, 1100);
    } else if (state === 'go') {
      var ms = performance.now() - goTime;
      results.push({ ms: ms });
      state = 'between';
      setState('bg-result', Math.round(ms) + ' ms',
        ms < 200 ? 'Insane.' : ms < 300 ? 'Nice one.' : 'A little slow…');
      timer = setTimeout(nextOrFinish, 900);
    } else if (state === 'done') {
      // ignore presses on the pad while the restart button is up
    }
    // 'between' / 'fail-flash': ignore
  }

  pad.addEventListener('pointerdown', function (e) {
    if (e.target === restartBtn) return;
    handlePress();
  });

  restartBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    results = [];
    state = 'idle';
    restartBtn.style.display = 'none';
    renderDots();
    updateHud();
    setState('bg-idle', 'Click to start',
      'Wait for green, then click fast. Early click = failed round.');
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'done') restartBtn.click();
      else handlePress();
    }
  });

  renderDots();
  updateHud();
})();
</script>
</body>
</html>
