<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Math Blocks</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#0f172a;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px}
  .wrap{width:min(480px,100%);background:#1e293b;border:1px solid #334155;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .box{background:#0f172a;padding:8px;border-radius:12px;font-weight:800;font-size:.85rem;color:#94a3b8}
  .box b{display:block;font-size:1.3rem;color:#38bdf8;margin-top:2px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;background:#0f172a;padding:10px;border-radius:14px}
  .cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.35rem;cursor:pointer;user-select:none;transition:transform .1s,box-shadow .1s;border:2px solid transparent}
  .cell:hover{transform:scale(1.04)}
  .cell.sel{border-color:#ffffff;box-shadow:0 0 14px rgba(255,255,255,.55);transform:scale(.95)}
  .cell.empty{background:transparent!important;cursor:default;pointer-events:none}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:#cbd5e1}
  button{padding:9px 14px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
  .b-clr{background:#334155;color:#fff}
  .b-res{background:#38bdf8;color:#0f172a}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="box">TARGET<b id="target" style="color:#facc15">10</b></div>
    <div class="box">SELECTED<b id="sum" style="color:#4ade80">0</b></div>
    <div class="box">SCORE<b id="score">0</b></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <span id="msg">Select adjacent blocks that sum to Target!</span>
    <div style="display:flex;gap:6px">
      <button class="b-clr" id="clrBtn">Clear</button>
      <button class="b-res" id="resBtn">Restart</button>
    </div>
  </div>
</div>
<script>
(() => {
  const ROWS = 6, COLS = 6;
  const COLS_HEX = ['','#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#6366f1','#a855f7','#ec4899'];
  const gridEl = document.getElementById('grid'), targetEl = document.getElementById('target'), sumEl = document.getElementById('sum'), scoreEl = document.getElementById('score'), msgEl = document.getElementById('msg');

  let board = [], selected = [], target = 10, score = 0;

  const rndVal = () => 1 + Math.floor(Math.random()*9);

  function newTarget() {
    target = 10 + Math.floor(Math.random()*9);
    targetEl.textContent = target;
  }

  function init() {
    board = Array.from({length: ROWS}, () => Array.from({length: COLS}, rndVal));
    selected = []; score = 0;
    scoreEl.textContent = '0';
    newTarget();
    render();
  }

  function isAdj(a, b) {
    return Math.abs(a.r - b.r) <= 1 && Math.abs(a.c - b.c) <= 1 && !(a.r === b.r && a.c === b.c);
  }

  function applyGravityAndRefill() {
    for (let c = 0; c < COLS; c++) {
      const col = [];
      for (let r = ROWS - 1; r >= 0; r--) if (board[r][c] > 0) col.push(board[r][c]);
      while (col.length < ROWS) col.push(rndVal());
      for (let r = ROWS - 1, idx = 0; r >= 0; r--, idx++) board[r][c] = col[idx];
    }
  }

  function clickCell(r, c) {
    const existing = selected.findIndex(s => s.r === r && s.c === c);
    if (existing !== -1) {
      if (existing === selected.length - 1) selected.pop();
      else selected = selected.slice(0, existing + 1);
    } else {
      if (selected.length === 0 || isAdj(selected[selected.length - 1], { r, c })) {
        selected.push({ r, c });
      } else {
        selected = [{ r, c }];
      }
    }

    const total = selected.reduce((s, p) => s + board[p.r][p.c], 0);
    sumEl.textContent = total;
    if (total === target && selected.length >= 2) {
      score += target * selected.length;
      scoreEl.textContent = score;
      msgEl.textContent = `Cleared ${selected.length} blocks! +${target * selected.length}`;
      for (const p of selected) board[p.r][p.c] = 0;
      selected = [];
      sumEl.textContent = '0';
      applyGravityAndRefill();
      newTarget();
    } else if (total > target) {
      msgEl.textContent = 'Over target! Selection cleared.';
      selected = [];
      sumEl.textContent = '0';
    }
    render();
  }

  function render() {
    gridEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const v = board[r][c];
        const d = document.createElement('div');
        d.className = 'cell' + (selected.some(s => s.r === r && s.c === c) ? ' sel' : '');
        d.style.background = COLS_HEX[v];
        d.textContent = v;
        d.onclick = () => clickCell(r, c);
        gridEl.appendChild(d);
      }
    }
  }

  document.getElementById('clrBtn').onclick = () => { selected = []; sumEl.textContent = '0'; render(); };
  document.getElementById('resBtn').onclick = init;
  init();
})();
</script>
</body>
</html>
