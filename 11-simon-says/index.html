<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #1b2233, #0b0e15 70%);
    color: #e8ecf4;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-size: clamp(24px, 5vw, 40px);
    letter-spacing: 3px;
    font-weight: 700;
    text-transform: uppercase;
  }
  #status {
    font-size: clamp(15px, 2.5vw, 19px);
    min-height: 1.5em;
    color: #9fb0d0;
    text-align: center;
  }
  #round {
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 600;
    color: #ffd75e;
  }
  #board {
    position: relative;
    width: min(80vw, 80vmin, 420px);
    height: min(80vw, 80vmin, 420px);
  }
  .pad {
    position: absolute;
    width: 47%;
    height: 47%;
    cursor: pointer;
    transition: filter 0.08s, transform 0.08s;
    border: 6px solid #0b0e15;
  }
  .pad:hover { filter: brightness(1.1); }
  #pad0 { top: 0;    left: 0;  background: #1e9e50; border-radius: 100% 0 0 0; }
  #pad1 { top: 0;    right: 0; background: #c23535; border-radius: 0 100% 0 0; }
  #pad2 { bottom: 0; left: 0;  background: #d8b42c; border-radius: 0 0 0 100%; }
  #pad3 { bottom: 0; right: 0; background: #2866c7; border-radius: 0 0 100% 0; }
  .pad.lit { filter: brightness(1.9) saturate(1.3); transform: scale(1.02); }
  #pad0.lit { box-shadow: 0 0 40px #2eff78; }
  #pad1.lit { box-shadow: 0 0 40px #ff5252; }
  #pad2.lit { box-shadow: 0 0 40px #ffe14d; }
  #pad3.lit { box-shadow: 0 0 40px #52a0ff; }
  .pad.locked { pointer-events: none; }
  #center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 42%; height: 42%;
    background: #10151f;
    border: 6px solid #0b0e15;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 2;
  }
  #center span {
    font-size: clamp(28px, 7vmin, 52px);
    font-weight: 800;
    color: #ffd75e;
  }
  #btn {
    padding: 12px 36px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #0b0e15;
    background: #ffd75e;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  #btn:hover { background: #ffe38a; transform: translateY(-2px); }
  #btn:active { transform: translateY(0); }
  #btn.hidden { display: none; }
</style>
</head>
<body>
  <h1>Simon Says</h1>
  <div id="round">Round 0</div>
  <div id="board">
    <div class="pad locked" id="pad0" data-i="0"></div>
    <div class="pad locked" id="pad1" data-i="1"></div>
    <div class="pad locked" id="pad2" data-i="2"></div>
    <div class="pad locked" id="pad3" data-i="3"></div>
    <div id="center"><span id="centerNum">–</span></div>
  </div>
  <div id="status">Press Start to play</div>
  <button id="btn">Start</button>

<script>
(function () {
  "use strict";

  // Classic-ish Simon frequencies: green, red, yellow, blue
  var FREQS = [329.63, 261.63, 220.0, 164.81];
  var TONE_MS = 420;
  var GAP_MS = 140;

  var pads = [
    document.getElementById("pad0"),
    document.getElementById("pad1"),
    document.getElementById("pad2"),
    document.getElementById("pad3")
  ];
  var statusEl = document.getElementById("status");
  var roundEl = document.getElementById("round");
  var centerNum = document.getElementById("centerNum");
  var btn = document.getElementById("btn");

  var audioCtx = null;
  var sequence = [];
  var playerIdx = 0;
  var round = 0;
  var accepting = false;
  var timers = [];

  function getCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function playTone(i, durationMs, type, gainLevel) {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = FREQS[i];
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(gainLevel || 0.25, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs / 1000);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + durationMs / 1000 + 0.05);
  }

  function playError() {
    var ctx = getCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(140, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.55);
  }

  function lightPad(i, ms) {
    pads[i].classList.add("lit");
    var t = setTimeout(function () { pads[i].classList.remove("lit"); }, ms || 300);
    timers.push(t);
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
    pads.forEach(function (p) { p.classList.remove("lit"); });
  }

  function setPadsLocked(locked) {
    pads.forEach(function (p) { p.classList.toggle("locked", locked); });
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  function nextRound() {
    round++;
    roundEl.textContent = "Round " + round;
    centerNum.textContent = round;
    sequence.push(Math.floor(Math.random() * 4));
    playerIdx = 0;
    playSequence();
  }

  function playSequence() {
    accepting = false;
    setPadsLocked(true);
    setStatus("Watch the sequence…");
    // Speed up slightly as rounds progress (min 220ms tone)
    var toneMs = Math.max(220, TONE_MS - (round - 1) * 15);
    var stepMs = toneMs + GAP_MS;
    sequence.forEach(function (pad, k) {
      var t = setTimeout(function () {
        lightPad(pad, toneMs - 60);
        playTone(pad, toneMs);
      }, 500 + k * stepMs);
      timers.push(t);
    });
    var done = setTimeout(function () {
      accepting = true;
      setPadsLocked(false);
      setStatus("Your turn — repeat the sequence");
    }, 500 + sequence.length * stepMs);
    timers.push(done);
  }

  function onPadPress(i) {
    if (!accepting) return;
    lightPad(i, 250);
    playTone(i, 300);
    if (i === sequence[playerIdx]) {
      playerIdx++;
      if (playerIdx === sequence.length) {
        accepting = false;
        setPadsLocked(true);
        setStatus("Correct!");
        timers.push(setTimeout(nextRound, 800));
      }
    } else {
      gameOver();
    }
  }

  function gameOver() {
    accepting = false;
    setPadsLocked(true);
    playError();
    setStatus("Game over! You reached round " + round + ".");
    roundEl.textContent = "Final: Round " + round;
    btn.textContent = "Restart";
    btn.classList.remove("hidden");
  }

  function startGame() {
    clearTimers();
    getCtx(); // unlock audio on user gesture
    sequence = [];
    playerIdx = 0;
    round = 0;
    roundEl.textContent = "Round 0";
    centerNum.textContent = "–";
    btn.classList.add("hidden");
    setStatus("Get ready…");
    timers.push(setTimeout(nextRound, 600));
  }

  pads.forEach(function (pad, i) {
    pad.addEventListener("pointerdown", function () { onPadPress(i); });
  });

  btn.addEventListener("click", startGame);

  document.addEventListener("keydown", function (e) {
    if (!accepting) return;
    var map = { "1": 0, "2": 1, "3": 2, "4": 3, "q": 0, "w": 1, "a": 2, "s": 3 };
    var i = map[e.key.toLowerCase()];
    if (i !== undefined) onPadPress(i);
  });
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
