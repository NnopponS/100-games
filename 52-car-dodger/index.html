<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dodger</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #wrap { position: relative; }
  canvas { display: block; background: #2d6a2d; box-shadow: 0 0 40px rgba(0,0,0,.8); }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.72);
    color: #fff; text-align: center;
  }
  .overlay h1 { font-size: 42px; letter-spacing: 3px; margin-bottom: 10px; color: #ffd23f; }
  .overlay p { font-size: 16px; margin: 6px 0; color: #ccc; }
  .overlay .big { font-size: 30px; color: #fff; font-weight: bold; }
  .overlay button {
    margin-top: 20px; padding: 12px 34px;
    font-size: 18px; font-weight: bold; letter-spacing: 1px;
    color: #111; background: #ffd23f; border: none; border-radius: 6px;
    cursor: pointer;
  }
  .overlay button:hover { background: #ffe27a; }
  .hidden { display: none; }
  #hud {
    position: absolute; top: 10px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 14px; pointer-events: none;
    color: #fff; font-weight: bold; font-size: 18px;
    text-shadow: 0 2px 4px rgba(0,0,0,.9);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="hud"><span id="score">0 m</span><span id="speed"></span></div>
  <div id="start" class="overlay">
    <h1>CAR DODGER</h1>
    <p>&#8592; &#8594; arrow keys (or A / D) to change lanes</p>
    <p>Dodge the oncoming traffic. Survive as long as you can.</p>
    <button id="startBtn">START</button>
  </div>
  <div id="over" class="overlay hidden">
    <h1>CRASHED!</h1>
    <p class="big" id="finalScore">0 m</p>
    <p id="bestScore"></p>
    <button id="restartBtn">RESTART (R)</button>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  var LANES = 4;
  var roadW = 320;
  var roadX = (W - roadW) / 2;
  var laneW = roadW / LANES;
  var carW = laneW * 0.62, carH = 78;
  var playerY = H - carH - 30;

  var state = 'start'; // start | play | over
  var lane, targetX, px, cars, dist, speed, spawnT, markOff, best, lastT;

  best = 0;
  try { best = parseInt(localStorage.getItem('carDodgerBest') || '0', 10) || 0; } catch (e) {}

  function laneX(i) { return roadX + i * laneW + (laneW - carW) / 2; }

  function reset() {
    lane = 1;
    px = laneX(lane);
    targetX = px;
    cars = [];
    dist = 0;
    speed = 240;      // px per second of scroll speed
    spawnT = 0.6;
    markOff = 0;
    lastT = performance.now();
  }

  function spawn() {
    // pick a lane; avoid blocking every lane in the same row band
    var free = [0, 1, 2, 3].filter(function (i) {
      return !cars.some(function (c) { return c.lane === i && c.y < carH * 1.6; });
    });
    if (!free.length) return;
    var l = free[Math.floor(Math.random() * free.length)];
    var colors = ['#e74c3c', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#ecf0f1'];
    cars.push({ lane: l, y: -carH - 10, color: colors[Math.floor(Math.random() * colors.length)] });
  }

  function drawCar(x, y, color, isPlayer) {
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillRect(3, 5, carW, carH);
    // body
    ctx.fillStyle = color;
    roundRect(0, 0, carW, carH, 10);
    ctx.fill();
    // windshield / rear window
    ctx.fillStyle = '#1a2530';
    if (isPlayer) {
      roundRect(5, carH * 0.22, carW - 10, carH * 0.20, 4); ctx.fill();
      roundRect(5, carH * 0.66, carW - 10, carH * 0.14, 4); ctx.fill();
      // headlights
      ctx.fillStyle = '#ffeaa7';
      ctx.fillRect(6, carH - 6, 10, 4);
      ctx.fillRect(carW - 16, carH - 6, 10, 4);
    } else {
      roundRect(5, carH * 0.58, carW - 10, carH * 0.20, 4); ctx.fill();
      roundRect(5, carH * 0.20, carW - 10, carH * 0.14, 4); ctx.fill();
      // headlights facing player
      ctx.fillStyle = '#ffeaa7';
      ctx.fillRect(6, 2, 10, 4);
      ctx.fillRect(carW - 16, 2, 10, 4);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function update(dt) {
    dist += speed * dt * 0.05;              // meters-ish
    speed += 6 * dt;                        // gradual difficulty ramp
    markOff = (markOff + speed * dt) % 60;

    // smooth lane movement
    var dx = targetX - px;
    px += dx * Math.min(1, dt * 14);

    // spawning
    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      var base = Math.max(0.35, 1.1 - speed / 700);
      spawnT = base * (0.7 + Math.random() * 0.7);
    }

    // move cars
    for (var i = cars.length - 1; i >= 0; i--) {
      var c = cars[i];
      c.y += (speed * 0.85) * dt;
      if (c.y > H + 20) { cars.splice(i, 1); continue; }
      // collision
      if (Math.abs(c.y - playerY) < carH * 0.82 &&
          Math.abs(laneX(c.lane) - px) < (carW + carW) * 0.42) {
        gameOver();
        return;
      }
    }
  }

  function draw() {
    // grass
    ctx.fillStyle = '#2d6a2d';
    ctx.fillRect(0, 0, W, H);
    // road
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(roadX, 0, roadW, H);
    // road edges
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(roadX - 6, 0, 6, H);
    ctx.fillRect(roadX + roadW, 0, 6, H);
    // lane dashes
    ctx.fillStyle = '#f5d76e';
    for (var l = 1; l < LANES; l++) {
      var x = roadX + l * laneW - 3;
      for (var y = -60 + markOff; y < H; y += 60) {
        ctx.fillRect(x, y, 6, 32);
      }
    }
    // cars
    for (var i = 0; i < cars.length; i++) drawCar(laneX(cars[i].lane), cars[i].y, cars[i].color, false);
    drawCar(px, playerY, '#ffd23f', true);

    // HUD
    document.getElementById('score').textContent = Math.floor(dist) + ' m';
    document.getElementById('speed').textContent = Math.round(speed / 6) + ' km/h';
  }

  function loop(now) {
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'over';
    var d = Math.floor(dist);
    if (d > best) {
      best = d;
      try { localStorage.setItem('carDodgerBest', String(best)); } catch (e) {}
    }
    document.getElementById('finalScore').textContent = d + ' m';
    document.getElementById('bestScore').textContent = 'Best: ' + best + ' m — press R to restart';
    document.getElementById('over').classList.remove('hidden');
  }

  function startGame() {
    reset();
    state = 'play';
    document.getElementById('start').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
  }

  function move(dir) {
    if (state !== 'play') return;
    lane = Math.max(0, Math.min(LANES - 1, lane + dir));
    targetX = laneX(lane);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { move(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { move(1); e.preventDefault(); }
    else if (e.key === 'r' || e.key === 'R' || e.key === ' ' || e.key === 'Enter') {
      if (state !== 'play') startGame();
      e.preventDefault();
    }
  });
  // touch support: tap left/right half
  canvas.addEventListener('touchstart', function (e) {
    if (state !== 'play') return;
    var x = e.touches[0].clientX;
    move(x < window.innerWidth / 2 ? -1 : 1);
    e.preventDefault();
  }, { passive: false });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  reset();
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
