<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Slot Machine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#2a1447,#0d0818 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:14px}
  .machine{width:min(520px,100%);background:linear-gradient(180deg,#26153d,#160d26);border:3px solid #f5b942;border-radius:24px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.65),inset 0 0 24px rgba(245,185,66,.18);position:relative;overflow:hidden}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .title{font-size:1.45rem;font-weight:900;letter-spacing:.06em;background:linear-gradient(90deg,#ffd86f,#ff7eb3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stats{display:flex;gap:10px}
  .pill{background:rgba(0,0,0,.45);border:1px solid rgba(255,216,111,.35);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.9rem}
  .pill span{color:#ffd86f}
  .marquee{text-align:center;min-height:30px;line-height:30px;font-weight:800;font-size:1rem;color:#ffd86f;background:rgba(0,0,0,.4);border-radius:10px;margin-bottom:14px;letter-spacing:.03em;transition:.2s}
  .marquee.win{color:#5effb1;transform:scale(1.03);text-shadow:0 0 12px rgba(94,255,177,.6)}
  .reels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#0a0612;padding:16px;border-radius:16px;border:2px solid #4e2f78;box-shadow:inset 0 8px 20px rgba(0,0,0,.8);position:relative}
  .reels::after{content:'';position:absolute;left:10px;right:10px;top:50%;height:4px;transform:translateY(-50%);background:linear-gradient(90deg,transparent,rgba(255,80,140,.55),transparent);pointer-events:none}
  .reel-window{height:150px;background:linear-gradient(180deg,#1a102b 0%,#2d1b4a 50%,#1a102b 100%);border-radius:12px;border:2px solid rgba(255,255,255,.12);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
  .reel-strip{display:flex;flex-direction:column;align-items:center;transition:transform .08s linear}
  .sym{height:150px;display:flex;align-items:center;justify-content:center;font-size:4.2rem;user-select:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
  .reel-window.win-glow{border-color:#5effb1;box-shadow:0 0 20px rgba(94,255,177,.45)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
  .bet-box{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  button{border:none;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s,filter .15s}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{background:#3a245c;color:#fff;padding:8px 12px;font-size:.9rem}
  .btn-sm:hover:not(:disabled){filter:brightness(1.2)}
  .btn-spin{flex:1;min-width:140px;padding:13px 22px;font-size:1.1rem;background:linear-gradient(135deg,#ffbe3b,#ff5e7e);color:#1a0b24;box-shadow:0 8px 24px rgba(255,94,126,.35)}
  .btn-spin:hover:not(:disabled){filter:brightness(1.08)}
  .paytable{margin-top:14px;background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;font-size:.78rem;color:#d6c8eb}
  .pay-item{display:flex;justify-content:space-between;background:rgba(255,255,255,.04);padding:4px 8px;border-radius:8px}
  .pay-item b{color:#ffd86f}
  .footer-hint{margin-top:10px;text-align:center;font-size:.78rem;color:#9d8cb8}
</style>
</head>
<body>
<div class="machine">
  <div class="header">
    <div class="title">LUCKY 777 SLOTS</div>
    <div class="stats">
      <div class="pill">Credits: <span id="credits">500</span></div>
      <div class="pill">Best: <span id="best">500</span></div>
    </div>
  </div>
  <div class="marquee" id="msg">Press SPIN or Spacebar to play!</div>
  <div class="reels">
    <div class="reel-window" id="rw0"><div class="sym" id="r0">7️⃣</div></div>
    <div class="reel-window" id="rw1"><div class="sym" id="r1">💎</div></div>
    <div class="reel-window" id="rw2"><div class="sym" id="r2">🍒</div></div>
  </div>
  <div class="controls">
    <div class="bet-box">
      <button class="btn-sm" id="betDown">-</button>
      <div style="min-width:64px;text-align:center;font-weight:800">Bet: <span id="betVal">10</span></div>
      <button class="btn-sm" id="betUp">+</button>
      <button class="btn-sm" id="maxBet">MAX</button>
    </div>
    <button class="btn-spin" id="spinBtn">SPIN</button>
    <button class="btn-sm" id="resetBtn">Restart</button>
  </div>
  <div class="paytable">
    <div class="pay-item"><span>7️⃣7️⃣7️⃣</span><b>50x</b></div>
    <div class="pay-item"><span>💎💎💎</span><b>25x</b></div>
    <div class="pay-item"><span>🔔🔔🔔</span><b>15x</b></div>
    <div class="pay-item"><span>🍀🍀🍀</span><b>10x</b></div>
    <div class="pay-item"><span>🍋🍋🍋</span><b>6x</b></div>
    <div class="pay-item"><span>🍒🍒 / 2x Match</span><b>2x–5x</b></div>
  </div>
  <div class="footer-hint">Space = Spin • Up/Down = Adjust Bet • Any 2 matching symbols win 2x!</div>
</div>
<script>
(() => {
  const SYMBOLS = [
    { icon: '🍒', weight: 26, mult3: 5 },
    { icon: '🍋', weight: 22, mult3: 6 },
    { icon: '🍀', weight: 18, mult3: 10 },
    { icon: '🔔', weight: 15, mult3: 15 },
    { icon: '💎', weight: 11, mult3: 25 },
    { icon: '7️⃣', weight: 8,  mult3: 50 }
  ];
  const pool = [];
  SYMBOLS.forEach(s => { for (let i = 0; i < s.weight; i++) pool.push(s); });
  const pick = () => pool[Math.floor(Math.random() * pool.length)];

  let credits = 500, best = 500, bet = 10, spinning = false;
  const creditsEl = document.getElementById('credits');
  const bestEl = document.getElementById('best');
  const betEl = document.getElementById('betVal');
  const msgEl = document.getElementById('msg');
  const spinBtn = document.getElementById('spinBtn');
  const reelEls = [0,1,2].map(i => document.getElementById('r'+i));
  const winEls = [0,1,2].map(i => document.getElementById('rw'+i));

  function updateUI() {
    creditsEl.textContent = credits;
    if (credits > best) best = credits;
    bestEl.textContent = best;
    betEl.textContent = bet;
    spinBtn.disabled = spinning || credits <= 0;
  }

  function spin() {
    if (spinning) return;
    if (credits < bet) bet = Math.max(5, credits);
    if (credits <= 0) {
      msgEl.textContent = 'Out of credits! Press Restart.';
      msgEl.classList.remove('win');
      return;
    }
    spinning = true;
    credits -= bet;
    winEls.forEach(w => w.classList.remove('win-glow'));
    msgEl.classList.remove('win');
    msgEl.textContent = 'Spinning... Good luck!';
    updateUI();

    const targets = [pick(), pick(), pick()];
    const stopTimes = [650, 1050, 1450];
    const start = performance.now();
    const stopped = [false, false, false];
    let lastTick = 0;

    function frame(now) {
      const elapsed = now - start;
      if (now - lastTick > 55) {
        lastTick = now;
        for (let i = 0; i < 3; i++) {
          if (!stopped[i]) {
            reelEls[i].textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)].icon;
            reelEls[i].style.transform = `translateY(${(Math.random()*12-6).toFixed(1)}px)`;
          }
        }
      }
      for (let i = 0; i < 3; i++) {
        if (!stopped[i] && elapsed >= stopTimes[i]) {
          stopped[i] = true;
          reelEls[i].textContent = targets[i].icon;
          reelEls[i].style.transform = 'translateY(0)';
        }
      }
      if (stopped.every(Boolean)) {
        evaluate(targets);
      } else {
        requestAnimationFrame(frame);
      }
    }
    requestAnimationFrame(frame);
  }

  function evaluate(res) {
    spinning = false;
    const [a, b, c] = res.map(x => x.icon);
    let payout = 0;
    if (a === b && b === c) {
      payout = bet * res[0].mult3;
      winEls.forEach(w => w.classList.add('win-glow'));
      msgEl.textContent = `JACKPOT! 3x ${a} +${payout} credits!`;
      msgEl.classList.add('win');
    } else if (a === b || b === c || a === c) {
      const pairMult = (res.filter(x => x.icon === '🍒').length >= 2) ? 3 : 2;
      payout = bet * pairMult;
      if (a === b) { winEls[0].classList.add('win-glow'); winEls[1].classList.add('win-glow'); }
      if (b === c) { winEls[1].classList.add('win-glow'); winEls[2].classList.add('win-glow'); }
      if (a === c) { winEls[0].classList.add('win-glow'); winEls[2].classList.add('win-glow'); }
      msgEl.textContent = `Nice pair! Won +${payout} credits!`;
      msgEl.classList.add('win');
    } else {
      msgEl.textContent = credits <= 0 ? 'Broke! Press Restart for 500 credits.' : 'No match — spin again!';
    }
    credits += payout;
    updateUI();
  }

  document.getElementById('betDown').onclick = () => { if (!spinning) { bet = Math.max(5, bet - 5); updateUI(); } };
  document.getElementById('betUp').onclick = () => { if (!spinning) { bet = Math.min(Math.max(5, credits), bet + 5, 100); updateUI(); } };
  document.getElementById('maxBet').onclick = () => { if (!spinning && credits > 0) { bet = Math.min(credits, 100); updateUI(); } };
  spinBtn.onclick = spin;
  document.getElementById('resetBtn').onclick = () => {
    if (spinning) return;
    credits = 500; bet = 10;
    winEls.forEach(w => w.classList.remove('win-glow'));
    msgEl.classList.remove('win');
    msgEl.textContent = 'Fresh bankroll! Press SPIN!';
    updateUI();
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); spin(); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); document.getElementById('betUp').click(); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); document.getElementById('betDown').click(); }
  });
  updateUI();
})();
</script>
</body>
</html>
