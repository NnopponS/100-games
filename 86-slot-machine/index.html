<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lucky Sevens — Slot Machine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(1000px 700px at 50% -12%, rgba(88,28,135,.62), transparent 62%),
      radial-gradient(800px 600px at 8% 108%, rgba(49,12,74,.55), transparent 60%),
      #0a0614;
    color:#fff;font-family:system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .machine{
    width:min(520px,100%);position:relative;
    background:linear-gradient(180deg,#2a1746,#150b28 70%);
    border:2px solid #b8860b;border-radius:26px;padding:18px;
    box-shadow:0 28px 70px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,220,130,.22),0 0 60px -18px rgba(255,180,60,.35);
    overflow:hidden;
  }
  .machine::before{ /* marquee bulbs */
    content:'';position:absolute;left:18px;right:18px;top:7px;height:9px;pointer-events:none;
    background-image:radial-gradient(circle 3px, rgba(255,220,120,.95) 60%, transparent 65%);
    background-size:26px 9px;background-repeat:repeat-x;background-position:center;
    opacity:.85;animation:bulbs 1.1s steps(2) infinite;
  }
  @keyframes bulbs{50%{opacity:.35}}
  .header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .title{
    font-size:1.35rem;font-weight:900;letter-spacing:.1em;
    background:linear-gradient(180deg,#fff8d6,#ffd86f 55%,#f59e0b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,180,60,.4));
  }
  .stats{display:flex;gap:8px}
  .pill{
    background:rgba(0,0,0,.45);border:1px solid rgba(255,216,111,.4);
    padding:6px 12px;border-radius:999px;font-weight:800;font-size:.86rem;
  }
  .pill .lab{font-size:.58rem;letter-spacing:.14em;color:#b99a56;display:block;text-transform:uppercase}
  .pill span.v{color:#ffd86f;text-shadow:0 0 10px rgba(255,216,111,.5);font-variant-numeric:tabular-nums}
  .marquee{
    text-align:center;min-height:32px;line-height:32px;font-weight:800;font-size:.95rem;
    color:#ffd86f;background:rgba(0,0,0,.42);border-radius:11px;margin-bottom:12px;
    letter-spacing:.04em;transition:.2s;border:1px solid rgba(255,216,111,.16);
  }
  .marquee.win{color:#5effb1;text-shadow:0 0 14px rgba(94,255,177,.6);border-color:rgba(94,255,177,.4)}
  .marquee.broke{color:#fda4af;text-shadow:0 0 14px rgba(244,63,94,.5);border-color:rgba(244,63,94,.4)}
  .reels{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    background:#07030e;padding:14px;border-radius:16px;
    border:2px solid #4e2f78;box-shadow:inset 0 10px 26px rgba(0,0,0,.9);position:relative;
  }
  .reels::before,.reels::after{ /* glass sheen over windows */
    content:'';position:absolute;left:12px;right:12px;height:26%;z-index:3;pointer-events:none;border-radius:8px;
  }
  .reels::before{top:12px;background:linear-gradient(180deg,rgba(255,255,255,.13),transparent)}
  .reels::after{bottom:12px;background:linear-gradient(0deg,rgba(255,255,255,.06),transparent)}
  .winline{position:absolute;left:8px;right:8px;top:50%;height:3px;transform:translateY(-50%);z-index:2;
    background:linear-gradient(90deg,transparent,rgba(255,80,140,.7),transparent);pointer-events:none}
  .reel{height:132px;overflow:hidden;border-radius:11px;background:linear-gradient(180deg,#12081f,#241238 50%,#12081f);border:1px solid rgba(255,255,255,.12);position:relative}
  .reel.spinning .strip{filter:blur(1.6px)}
  .reel .strip{display:flex;flex-direction:column;will-change:transform}
  .cell{height:132px;flex:none;display:flex;align-items:center;justify-content:center}
  .cell svg{width:78%;height:78%;filter:drop-shadow(0 5px 9px rgba(0,0,0,.5))}
  .reel.hit{border-color:#5effb1;box-shadow:0 0 22px rgba(94,255,177,.55)}
  .reel.hit::after{content:'';position:absolute;inset:0;background:rgba(94,255,177,.1);animation:winflash .5s ease-in-out 3}
  @keyframes winflash{50%{opacity:.2}}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
  .bet-box{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.38);padding:7px 10px;border-radius:13px;border:1px solid rgba(255,255,255,.13)}
  button{border:none;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;touch-action:manipulation;transition:transform .1s,filter .15s}
  button:active{transform:scale(.95)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-sm{background:#3a245c;color:#fff;padding:9px 13px;font-size:.92rem;min-width:38px;min-height:38px}
  .btn-sm:hover:not(:disabled){filter:brightness(1.25)}
  .btn-spin{
    flex:1;min-width:130px;padding:14px 22px;font-size:1.12rem;letter-spacing:.08em;
    background:linear-gradient(180deg,#ffd86f,#ff9d3c 55%,#ff5e7e);color:#241028;
    box-shadow:0 10px 26px -6px rgba(255,120,80,.55),inset 0 1px 0 rgba(255,255,255,.55);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
  }
  .btn-spin:hover:not(:disabled){filter:brightness(1.07)}
  .paytable{margin-top:12px;background:rgba(0,0,0,.35);border-radius:13px;padding:9px 11px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px 9px;font-size:.74rem;color:#d6c8eb}
  .pay-item{display:flex;justify-content:space-between;gap:4px;background:rgba(255,255,255,.05);padding:4px 8px;border-radius:8px}
  .pay-item b{color:#ffd86f}
  .pay-item .ic{display:inline-flex;gap:1px}
  .pay-item svg{width:13px;height:13px}
  .hint{margin-top:9px;text-align:center;font-size:.75rem;color:#8f7db3;font-weight:600}
  canvas#coins{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="coins"></canvas>
<div class="machine">
  <div class="header">
    <div class="title">LUCKY SEVENS</div>
    <div class="stats">
      <div class="pill"><span class="lab">Credits</span><span class="v" id="cash">500</span></div>
      <div class="pill"><span class="lab">Best</span><span class="v" id="best">500</span></div>
    </div>
  </div>
  <div class="marquee" id="msg">Place your bet and pull!</div>
  <div class="reels">
    <div class="reel" id="rw0"><div class="strip" id="r0"></div></div>
    <div class="reel" id="rw1"><div class="strip" id="r1"></div></div>
    <div class="reel" id="rw2"><div class="strip" id="r2"></div></div>
    <div class="winline"></div>
  </div>
  <div class="controls">
    <div class="bet-box">
      <button class="btn-sm" id="betDown" aria-label="Decrease bet">−</button>
      <div style="min-width:66px;text-align:center;font-weight:800">Bet <span id="betVal" style="color:#ffd86f">10</span></div>
      <button class="btn-sm" id="betUp" aria-label="Increase bet">+</button>
      <button class="btn-sm" id="maxBet">MAX</button>
    </div>
    <button class="btn-spin" id="spinBtn">SPIN</button>
    <button class="btn-sm" id="resetBtn">Reset</button>
  </div>
  <div class="paytable" id="paytable"></div>
  <div class="hint">Space = Spin · Up/Down = Bet · Any pair pays · Best bankroll is saved</div>
</div>
<script>
(() => {
  // ------- hand-drawn SVG symbols -------
  const S = (inner) => `<svg viewBox="0 0 100 100">${inner}</svg>`;
  const SYMBOLS = [
    { id:'cherry', w:26, m3:5,  svg:S(`<path d="M44 22 C44 36 40 46 30 58 M44 22 C50 34 58 44 66 56" stroke="#4ade80" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M30 20 Q50 8 66 22" stroke="#16a34a" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="28" cy="64" r="17" fill="#dc2626"/><circle cx="66" cy="64" r="17" fill="#b91c1c"/><ellipse cx="23" cy="58" rx="5" ry="7" fill="#fca5a5" opacity=".8"/><ellipse cx="61" cy="58" rx="5" ry="7" fill="#fca5a5" opacity=".7"/>`)},
    { id:'lemon', w:22, m3:6,  svg:S(`<path d="M18 50 C18 30 82 30 82 50 C82 70 18 70 18 50Z" fill="#fde047"/><path d="M18 50 L10 44 M82 50 L90 44" stroke="#fde047" stroke-width="8" stroke-linecap="round"/><ellipse cx="42" cy="42" rx="18" ry="8" fill="#fef9c3" opacity=".75" transform="rotate(-12 42 42)"/>`)},
    { id:'clover', w:18, m3:10, svg:S(`<path d="M50 54 L50 84" stroke="#15803d" stroke-width="6" stroke-linecap="round"/><circle cx="38" cy="38" r="15" fill="#22c55e"/><circle cx="62" cy="38" r="15" fill="#22c55e"/><circle cx="50" cy="56" r="15" fill="#16a34a"/><circle cx="46" cy="34" r="5" fill="#86efac" opacity=".8"/>`)},
    { id:'bell', w:15, m3:15, svg:S(`<path d="M50 16 C32 16 28 34 28 50 L28 62 L72 62 L72 50 C72 34 68 16 50 16Z" fill="#fbbf24"/><path d="M22 62 L78 62 L82 74 L18 74 Z" fill="#f59e0b"/><circle cx="50" cy="80" r="9" fill="#d97706"/><rect x="44" y="10" width="12" height="8" rx="3" fill="#f59e0b"/><ellipse cx="40" cy="34" rx="6" ry="10" fill="#fef3c7" opacity=".7"/>`)},
    { id:'gem', w:11, m3:25, svg:S(`<path d="M30 22 L70 22 L86 42 L50 82 L14 42 Z" fill="#22d3ee"/><path d="M30 22 L42 42 L50 22 M70 22 L58 42 L50 22 M14 42 L86 42 M42 42 L50 82 L58 42" fill="none" stroke="#a5f3fc" stroke-width="2.5"/><path d="M30 22 L70 22 L86 42 L14 42 Z" fill="#67e8f9" opacity=".55"/>`)},
    { id:'seven', w:8, m3:50, svg:S(`<defs><linearGradient id="sg7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fecaca"/><stop offset=".5" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></linearGradient></defs><path d="M22 20 L78 20 L78 34 L52 82 L34 82 L60 36 L22 36 Z" fill="url(#sg7)" stroke="#fde68a" stroke-width="3" stroke-linejoin="round"/>`)}
  ];
  const CELL_H = 132;
  const pool = [];
  SYMBOLS.forEach(s => { for (let i = 0; i < s.w; i++) pool.push(s); });
  const pick = () => pool[Math.floor(Math.random() * pool.length)];
  const rndSym = () => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];

  const creditsEl = document.getElementById('cash'), bestEl = document.getElementById('best');
  const betEl = document.getElementById('betVal'), msgEl = document.getElementById('msg'), spinBtn = document.getElementById('spinBtn');
  const strips = [0,1,2].map(i => document.getElementById('r' + i));
  const reelWin = [0,1,2].map(i => document.getElementById('rw' + i));
  const coinC = document.getElementById('coins'), cctx = coinC.getContext('2d');

  // ------- sfx (honors shared aaa_sfx pref) -------
  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }
  const tick = () => tone(1500, .025, 'square', .018);
  const clunk = () => tone(140, .1, 'triangle', .09, 70);
  const coinSfx = n => { for (let i = 0; i < n; i++) setTimeout(() => tone(1200 + Math.random()*500, .07, 'triangle', .05), i * 70); };

  // ------- coin shower -------
  let coins = [], coinRaf = 0;
  function resizeCoins(){ coinC.width = innerWidth; coinC.height = innerHeight; }
  resizeCoins(); window.addEventListener('resize', resizeCoins);
  function rainCoins(n) {
    if (localStorage.getItem('aaa_fx') === '0') return;
    const r = document.querySelector('.reels').getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      coins.push({
        x: r.left + Math.random() * r.width, y: r.top - 10 - Math.random() * 60,
        vx: (Math.random()-.5) * 160, vy: 60 + Math.random() * 120,
        r: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random()-.5) * 12, t: 1.6 + Math.random()
      });
    }
    if (!coinRaf) { let last = performance.now(); const step = now => {
      const dt = Math.min(.04, (now - last)/1000); last = now;
      cctx.clearRect(0,0,coinC.width,coinC.height);
      coins = coins.filter(cn => cn.t > 0 && cn.y < coinC.height + 30);
      for (const cn of coins) {
        cn.vy += 700 * dt; cn.x += cn.vx * dt; cn.y += cn.vy * dt; cn.rot += cn.vr * dt; cn.t -= dt;
        cctx.save(); cctx.translate(cn.x, cn.y); cctx.rotate(cn.rot);
        cctx.globalAlpha = Math.min(1, cn.t);
        cctx.fillStyle = '#ffd54a'; cctx.beginPath(); cctx.ellipse(0,0,cn.r,cn.r*.72,0,0,Math.PI*2); cctx.fill();
        cctx.strokeStyle = '#b8860b'; cctx.lineWidth = 1.4; cctx.stroke();
        cctx.fillStyle = '#b8860b'; cctx.font = `bold ${cn.r}px sans-serif`; cctx.textAlign='center'; cctx.textBaseline='middle';
        cctx.fillText('$', 0, 1);
        cctx.restore();
      }
      coinRaf = coins.length ? requestAnimationFrame(step) : (cctx.clearRect(0,0,coinC.width,coinC.height), 0);
    }; coinRaf = requestAnimationFrame(step); }
  }

  // ------- state -------
  let credits = 500, bet = 10, spinning = false;
  let best = Math.max(500, Number(localStorage.getItem('slots_best') || 0));

  function updateUI() {
    creditsEl.textContent = credits;
    if (credits > best) { best = credits; localStorage.setItem('slots_best', String(best)); }
    bestEl.textContent = best;
    betEl.textContent = bet;
    spinBtn.disabled = spinning || credits <= 0;
  }

  // Build a strip: [target] + [spinning filler] + [landing target at end]
  function buildStrip(strip, target, fillerN) {
    strip.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = 0; i < fillerN; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      d.innerHTML = rndSym().svg;
      frag.appendChild(d);
    }
    const td = document.createElement('div');
    td.className = 'cell';
    td.innerHTML = target.svg;
    frag.appendChild(td);
    strip.appendChild(frag);
    return fillerN; // index of target cell
  }

  function spin() {
    if (spinning) return;
    if (credits < bet) bet = Math.max(5, credits);
    if (credits <= 0) {
      msgEl.textContent = 'GAME OVER — Out of credits! Hit Reset for a fresh bankroll.';
      msgEl.className = 'marquee broke';
      return;
    }
    spinning = true;
    credits -= bet;
    reelWin.forEach(w => w.classList.remove('hit'));
    msgEl.className = 'marquee';
    msgEl.textContent = 'Reels spinning…';
    updateUI();
    audio();

    const targets = [pick(), pick(), pick()];
    const durations = [1050, 1500, 2000];
    let done = 0;

    targets.forEach((target, i) => {
      const strip = strips[i];
      const fillerN = 14 + i * 5;
      buildStrip(strip, target, fillerN);
      const total = fillerN * CELL_H;
      reelWin[i].classList.add('spinning');
      const t0 = performance.now(), dur = durations[i];
      let lastCell = -1;
      strip.style.transform = 'translateY(0px)';

      function frame(now) {
        const p = Math.min(1, (now - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 3.2);
        const y = ease * total;
        strip.style.transform = `translateY(${-y}px)`;
        const cell = Math.floor(y / CELL_H);
        if (cell !== lastCell) { lastCell = cell; tick(); }
        if (p < 1) requestAnimationFrame(frame);
        else {
          reelWin[i].classList.remove('spinning');
          clunk();
          if (++done === 3) evaluate(targets);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  function evaluate(res) {
    spinning = false;
    const [a, b, c] = res.map(x => x.id);
    let payout = 0;
    if (a === b && b === c) {
      payout = bet * res[0].m3;
      reelWin.forEach(w => w.classList.add('hit'));
      msgEl.textContent = a === 'seven' ? `JACKPOT! TRIPLE SEVENS — BIG WIN +${payout}!` : `TRIPLE ${a.toUpperCase()}! BIG WIN +${payout}!`;
      msgEl.classList.add('win');
      rainCoins(a === 'seven' ? 90 : 45);
      coinSfx(8);
      tone(523,.15,'triangle',.08); setTimeout(()=>tone(659,.15,'triangle',.08),120); setTimeout(()=>tone(1047,.3,'triangle',.09),240);
    } else if (a === b || b === c || a === c) {
      const pairCherry = res.filter(x => x.id === 'cherry').length >= 2;
      payout = bet * (pairCherry ? 3 : 2);
      if (a === b) { reelWin[0].classList.add('hit'); reelWin[1].classList.add('hit'); }
      if (b === c) { reelWin[1].classList.add('hit'); reelWin[2].classList.add('hit'); }
      if (a === c) { reelWin[0].classList.add('hit'); reelWin[2].classList.add('hit'); }
      msgEl.textContent = `Pair pays! +${payout} credits`;
      msgEl.classList.add('win');
      rainCoins(18);
      coinSfx(4);
    } else {
      msgEl.textContent = credits <= 0 ? 'GAME OVER — Out of credits! Hit Reset.' : 'No match — spin again!';
      if (credits <= 0) msgEl.classList.add('broke');
    }
    credits += payout;
    updateUI();
  }

  // paytable (uses the actual SVGs)
  document.getElementById('paytable').innerHTML = SYMBOLS.slice().reverse().map(s =>
    `<div class="pay-item"><span class="ic">${s.svg}${s.svg}${s.svg}</span><b>${s.m3}x</b></div>`
  ).join('');

  document.getElementById('betDown').onclick = () => { if (!spinning) { bet = Math.max(5, bet - 5); updateUI(); } };
  document.getElementById('betUp').onclick = () => { if (!spinning) { bet = Math.min(Math.max(5, credits), bet + 5, 100); updateUI(); } };
  document.getElementById('maxBet').onclick = () => { if (!spinning && credits > 0) { bet = Math.min(credits, 100); updateUI(); } };
  spinBtn.onclick = spin;
  document.getElementById('resetBtn').onclick = () => {
    if (spinning) return;
    credits = 500; bet = 10;
    reelWin.forEach(w => w.classList.remove('hit'));
    msgEl.className = 'marquee';
    msgEl.textContent = 'Fresh bankroll of 500 — good luck!';
    updateUI();
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); spin(); }
    else if (e.code === 'ArrowUp') { e.preventDefault(); document.getElementById('betUp').click(); }
    else if (e.code === 'ArrowDown') { e.preventDefault(); document.getElementById('betDown').click(); }
  });

  // initial reel faces
  strips[0].innerHTML = `<div class="cell">${SYMBOLS[5].svg}</div>`;
  strips[1].innerHTML = `<div class="cell">${SYMBOLS[4].svg}</div>`;
  strips[2].innerHTML = `<div class="cell">${SYMBOLS[0].svg}</div>`;
  updateUI();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
