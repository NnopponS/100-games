<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkers vs AI</title>
<style>
  :root{
    --light:#f0d9b5;
    --dark:#a9713f;
    --sel:#ffe066;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%, #33455c, #16202b 70%);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    color:#e8eef5;
    padding:16px;
    user-select:none;
  }
  .app{width:min(92vmin, 520px)}
  h1{
    text-align:center;font-size:1.5rem;letter-spacing:.25em;
    text-transform:uppercase;color:var(--light);margin-bottom:6px;
  }
  .score{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.85rem;color:#c7d3e0;margin-bottom:8px;padding:0 2px;
  }
  .score .me{color:#ff9d8a}
  .score .foe{color:#9fb0c3}
  #status{
    text-align:center;min-height:1.5em;margin-bottom:10px;
    font-weight:600;font-size:1rem;color:#dbe7f3;
  }
  #board-wrap{position:relative}
  #board{
    display:grid;grid-template-columns:repeat(8,1fr);
    aspect-ratio:1/1;width:100%;
    border:10px solid #4e342e;border-radius:6px;
    box-shadow:0 16px 48px rgba(0,0,0,.55);
    overflow:hidden;background:var(--dark);
  }
  .cell{position:relative;display:flex;align-items:center;justify-content:center}
  .cell.light{background:var(--light)}
  .cell.dark{background:var(--dark);cursor:pointer}
  .cell.lastto{box-shadow:inset 0 0 0 3px rgba(255,255,255,.45)}
  .piece{
    width:78%;height:78%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(14px,4.2vmin,28px);line-height:1;
    pointer-events:none;
    transition:transform .1s ease;
    box-shadow:
      0 3px 6px rgba(0,0,0,.45),
      inset 0 -5px 7px rgba(0,0,0,.35),
      inset 0 4px 6px rgba(255,255,255,.25);
  }
  .piece.red{background:radial-gradient(circle at 35% 30%, #ff9e8f, #c62828 70%);color:#ffd54f}
  .piece.black{background:radial-gradient(circle at 35% 30%, #6e6e6e, #0e0e0e 70%);color:#ffd54f}
  .cell.sel .piece{
    transform:scale(1.08);
    box-shadow:
      0 0 0 4px var(--sel),
      0 4px 10px rgba(0,0,0,.5),
      inset 0 -5px 7px rgba(0,0,0,.35),
      inset 0 4px 6px rgba(255,255,255,.25);
  }
  .cell.must .piece{
    box-shadow:
      0 0 0 4px rgba(255,82,82,.9),
      0 3px 6px rgba(0,0,0,.45),
      inset 0 -5px 7px rgba(0,0,0,.35),
      inset 0 4px 6px rgba(255,255,255,.25);
  }
  .hint{
    position:absolute;width:32%;height:32%;border-radius:50%;
    background:rgba(255,255,255,.5);cursor:pointer;
  }
  .hint.cap{
    width:84%;height:84%;background:transparent;
    box-shadow:inset 0 0 0 4px rgba(255,224,102,.95);
  }
  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:rgba(12,18,25,.8);backdrop-filter:blur(2px);border-radius:6px;
  }
  #overlay.show{display:flex}
  #overlay .msg{font-size:1.9rem;font-weight:800;color:var(--light);text-shadow:0 2px 8px rgba(0,0,0,.6)}
  button{
    background:var(--light);color:#1b2735;border:none;
    padding:10px 24px;font-size:.95rem;font-weight:700;
    border-radius:6px;cursor:pointer;letter-spacing:.06em;
  }
  button:hover{background:#ffe6b0}
  button:active{transform:translateY(1px)}
  .controls{display:flex;justify-content:center;gap:12px;margin-top:14px}
  .help{text-align:center;font-size:.75rem;color:#8ea2b8;margin-top:10px}
</style>
</head>
<body>
  <div class="app">
    <h1>Checkers</h1>
    <div class="score">
      <span class="me">You (red): <b id="redCount">12</b></span>
      <span class="foe">AI (black): <b id="blkCount">12</b></span>
    </div>
    <div id="status">Your turn</div>
    <div id="board-wrap">
      <div id="board"></div>
      <div id="overlay">
        <div class="msg" id="msg"></div>
        <button id="again">Play again</button>
      </div>
    </div>
    <div class="controls">
      <button id="restart">Restart</button>
    </div>
    <div class="help">Click a red piece, then a highlighted square. Captures are forced &mdash; multi-jumps continue automatically.</div>
  </div>

<script>
"use strict";

/* ================= pure game logic ================= */
const EMPTY = 0, RED = 'r', REDK = 'R', BLK = 'b', BLKK = 'B';
const isRed = v => v === RED || v === REDK;
const isBlk = v => v === BLK || v === BLKK;
const isKing = v => v === REDK || v === BLKK;
const inB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const KING_DIRS = [[-1,-1],[-1,1],[1,-1],[1,1]];

function dirsFor(v){
  if (isKing(v)) return KING_DIRS;
  return isRed(v) ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
}

function newBoard(){
  const b = Array.from({length:8}, () => Array(8).fill(EMPTY));
  for (let r=0;r<3;r++) for (let c=0;c<8;c++) if ((r+c)%2===1) b[r][c] = BLK;
  for (let r=5;r<8;r++) for (let c=0;c<8;c++) if ((r+c)%2===1) b[r][c] = RED;
  return b;
}

function cloneBoard(bd){ return bd.map(row => row.slice()); }

function pieceCaptures(bd, r, c){
  const v = bd[r][c], out = [];
  const foe = isRed(v) ? isBlk : isRed;
  for (const [dr,dc] of dirsFor(v)){
    const r1=r+dr, c1=c+dc, r2=r+2*dr, c2=c+2*dc;
    if (inB(r2,c2) && bd[r2][c2]===EMPTY && foe(bd[r1][c1])){
      out.push({to:[r2,c2], cap:[r1,c1]});
    }
  }
  return out;
}

function pieceSimpleMoves(bd, r, c){
  const v = bd[r][c], out = [];
  for (const [dr,dc] of dirsFor(v)){
    const r1=r+dr, c1=c+dc;
    if (inB(r1,c1) && bd[r1][c1]===EMPTY) out.push({to:[r1,c1]});
  }
  return out;
}

function sideMoves(bd, side){
  const mine = side==='red' ? isRed : isBlk;
  const captures = [], moves = [];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    if (!mine(bd[r][c])) continue;
    for (const m of pieceCaptures(bd,r,c)) captures.push({from:[r,c], to:m.to, cap:m.cap});
    for (const m of pieceSimpleMoves(bd,r,c)) moves.push({from:[r,c], to:m.to, cap:null});
  }
  return {captures, moves};
}

function applyStep(bd, from, to, cap){
  const v = bd[from[0]][from[1]];
  bd[from[0]][from[1]] = EMPTY;
  if (cap) bd[cap[0]][cap[1]] = EMPTY;
  let nv = v;
  if (v === RED && to[0] === 0) nv = REDK;
  if (v === BLK && to[0] === 7) nv = BLKK;
  bd[to[0]][to[1]] = nv;
  return nv !== v; // promoted
}

function countPieces(bd, side){
  const mine = side==='red' ? isRed : isBlk;
  let n = 0;
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) if (mine(bd[r][c])) n++;
  return n;
}

// can the piece sitting at (r,c) be captured right now?
function isAttacked(bd, r, c){
  const v = bd[r][c];
  if (!v) return false;
  const foe = isRed(v) ? isBlk : isRed;
  for (let i=0;i<8;i++) for (let j=0;j<8;j++){
    if (!foe(bd[i][j])) continue;
    if (pieceCaptures(bd,i,j).some(k => k.cap[0]===r && k.cap[1]===c)) return true;
  }
  return false;
}

/* ================= AI ================= */
function chooseAICapture(caps){
  let best = null, bs = -1e9;
  for (const m of caps){
    const bd = cloneBoard(board);
    const promoted = applyStep(bd, m.from, m.to, m.cap);
    let s = 1 + Math.random();
    if (!promoted) s += pieceCaptures(bd, m.to[0], m.to[1]).length; // favour longer chains
    if (board[m.from[0]][m.from[1]] === BLK && m.to[0] === 7) s += 2;
    if (s > bs){ bs = s; best = m; }
  }
  return best;
}

function chooseAIMove(moves){
  let best = null, bs = -1e9;
  for (const m of moves){
    const bd = cloneBoard(board);
    const wasMan = board[m.from[0]][m.from[1]] === BLK;
    applyStep(bd, m.from, m.to, null);
    let s = Math.random() * 1.5;
    if (wasMan && m.to[0] === 7) s += 4;                    // promote
    s += (3.5 - Math.abs(3.5 - m.to[1])) * 0.3;             // prefer centre
    if (isAttacked(bd, m.to[0], m.to[1])) s -= 3.5;         // don't hang pieces
    if (s > bs){ bs = s; best = m; }
  }
  return best;
}

/* ================= UI / game state ================= */
let board, selected = null, selMoves = [], locked = false;
let turn = 'red', over = false, lastMove = null;

const boardEl   = document.getElementById('board');
const statusEl  = document.getElementById('status');
const overlayEl = document.getElementById('overlay');
const msgEl     = document.getElementById('msg');
const redCountEl= document.getElementById('redCount');
const blkCountEl= document.getElementById('blkCount');

function setStatus(t, win){
  statusEl.textContent = t;
  statusEl.style.color = win ? '#7ee2a0' : '';
}

function render(){
  const info = (turn==='red' && !over) ? sideMoves(board,'red') : null;
  const forced = !!(info && info.captures.length && !locked);
  const must = new Set();
  if (forced) for (const m of info.captures) must.add(m.from[0]+','+m.from[1]);

  let html = '';
  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const dark = (r+c)%2===1;
    let cls = 'cell ' + (dark ? 'dark' : 'light');
    if (selected && selected[0]===r && selected[1]===c) cls += ' sel';
    if (must.has(r+','+c)) cls += ' must';
    if (lastMove && lastMove.to[0]===r && lastMove.to[1]===c) cls += ' lastto';
    html += `<div class="${cls}" data-r="${r}" data-c="${c}">`;
    const v = board[r][c];
    if (v !== EMPTY){
      html += `<div class="piece ${isRed(v)?'red':'black'}">${isKing(v)?'&#9819;':''}</div>`;
    }
    const hint = selMoves.find(m => m.to[0]===r && m.to[1]===c);
    if (hint) html += `<div class="hint${hint.cap?' cap':''}"></div>`;
    html += '</div>';
  }
  boardEl.innerHTML = html;
  redCountEl.textContent = countPieces(board,'red');
  blkCountEl.textContent = countPieces(board,'blk');
}

function onCellClick(r, c){
  if (over || turn !== 'red') return;

  if (selected){
    const hit = selMoves.find(m => m.to[0]===r && m.to[1]===c);
    if (hit) return doPlayerStep(hit);
    if (locked) return; // mid multi-jump: must keep jumping
    if (selected[0]===r && selected[1]===c){
      selected = null; selMoves = [];
      setStatus("Your turn"); render(); return;
    }
  }

  const v = board[r][c];
  if (!isRed(v)){ selected = null; selMoves = []; render(); return; }

  const info = sideMoves(board,'red');
  const forced = info.captures.length > 0;
  const caps = pieceCaptures(board, r, c);
  if (forced && caps.length === 0){
    setStatus("A capture is available - you must take it.");
    return;
  }
  const opts = forced ? caps : pieceSimpleMoves(board, r, c);
  if (!opts.length){ selected = null; selMoves = []; render(); return; }

  selected = [r,c]; selMoves = opts;
  setStatus(opts[0].cap ? "Choose a capture" : "Choose a highlighted square");
  render();
}

function doPlayerStep(step){
  const promoted = applyStep(board, step.from, step.to, step.cap);
  lastMove = {from: step.from, to: step.to};

  if (step.cap && !promoted){
    const more = pieceCaptures(board, step.to[0], step.to[1]);
    if (more.length){
      selected = [step.to[0], step.to[1]];
      selMoves = more;
      locked = true;
      setStatus("Capture again!");
      render();
      return;
    }
  }

  locked = false; selected = null; selMoves = [];
  const info = sideMoves(board,'blk');
  if (countPieces(board,'blk') === 0 || (info.captures.length===0 && info.moves.length===0)){
    return endGame('red');
  }
  turn = 'blk';
  setStatus("AI thinking...");
  render();
  aiTurn();
}

function aiTurn(){
  setTimeout(() => {
    if (over || turn !== 'blk') return;
    const {captures, moves} = sideMoves(board,'blk');
    if (captures.length === 0 && moves.length === 0) return endGame('red');
    const step = captures.length ? chooseAICapture(captures) : chooseAIMove(moves);
    aiStep(step, 0);
  }, 450);
}

function aiStep(step, delay){
  setTimeout(() => {
    if (over || turn !== 'blk') return;
    const promoted = applyStep(board, step.from, step.to, step.cap);
    lastMove = {from: step.from, to: step.to};
    render();
    if (step.cap && !promoted){
      const more = pieceCaptures(board, step.to[0], step.to[1]);
      if (more.length){
        const nxt = more[Math.floor(Math.random()*more.length)];
        return aiStep({from: step.to, to: nxt.to, cap: nxt.cap}, 420);
      }
    }
    finishAITurn();
  }, delay);
}

function finishAITurn(){
  const info = sideMoves(board,'red');
  if (countPieces(board,'red') === 0 || (info.captures.length===0 && info.moves.length===0)){
    return endGame('blk');
  }
  turn = 'red';
  setStatus(info.captures.length ? "Your turn - capture required" : "Your turn");
  render();
}

function endGame(winner){
  over = true;
  locked = false; selected = null; selMoves = [];
  const youWon = winner === 'red';
  setStatus(youWon ? "You win!" : "AI wins!", true);
  msgEl.textContent = youWon ? "You win!" : "AI wins";
  overlayEl.classList.add('show');
  render();
}

function newGame(){
  board = newBoard();
  selected = null; selMoves = []; locked = false;
  turn = 'red'; over = false; lastMove = null;
  overlayEl.classList.remove('show');
  setStatus("Your turn");
  render();
}

boardEl.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  onCellClick(+cell.dataset.r, +cell.dataset.c);
});
document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('again').addEventListener('click', newGame);

newGame();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
