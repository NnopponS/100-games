<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dice Battle</title>
<style>
:root{
  --cyan:#35e0ff;
  --magenta:#ff4d8d;
  --green:#3ef0a0;
  --gold:#ffc94a;
  --red:#ff5a4d;
  --txt:#e9f0ff;
  --dim:#8a97b4;
  --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  color:var(--txt);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(1000px 520px at 50% -12%, #16274a 0%, transparent 62%),
    radial-gradient(760px 460px at 8% 108%, #23163f 0%, transparent 62%),
    radial-gradient(760px 460px at 92% 108%, #0b2a30 0%, transparent 62%),
    #070a12;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
  touch-action:manipulation;
}

/* ---------- layout ---------- */
#app{
  position:relative;
  max-width:640px;
  margin:0 auto;
  padding:12px 14px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:100vh;
  min-height:100dvh;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.brand{
  font-size:15px;
  font-weight:900;
  letter-spacing:.22em;
  line-height:1;
  background:linear-gradient(95deg,#fff 10%, var(--cyan) 45%, var(--magenta) 95%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 14px rgba(53,224,255,.28));
}
.brand span{opacity:.85}
.round-tag{
  font-size:10px;
  letter-spacing:.16em;
  color:var(--dim);
  font-weight:700;
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 11px;
  background:rgba(255,255,255,.03);
  white-space:nowrap;
}
.round-tag b{color:var(--txt)}

/* ---------- scoreboard ---------- */
.board{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border-radius:16px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
  box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
}
.side{display:flex;flex-direction:column;gap:3px;min-width:0}
.side.ai{align-items:flex-end;text-align:right}
.side .nm{
  font-size:9.5px;
  letter-spacing:.2em;
  font-weight:800;
  color:var(--dim);
}
.side.p .nm{color:#7fe9ff}
.side.a .nm{color:#ff9dbd}
.pts{
  font-size:clamp(22px,7vw,30px);
  font-weight:900;
  line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
  transition:color .2s;
}
.side.p .pts{color:#fff;text-shadow:0 0 22px rgba(53,224,255,.5)}
.side.a .pts{color:#fff;text-shadow:0 0 22px rgba(255,77,141,.5)}
.pts .u{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.12em;margin-left:3px}
.wins{display:flex;gap:5px;margin-top:1px}
.side.ai .wins{justify-content:flex-end}
.wdot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  transition:.25s;
}
.side.p .wdot.on{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.side.a .wdot.on{background:var(--magenta);box-shadow:0 0 12px var(--magenta)}
.vs{
  font-size:10px;
  font-weight:900;
  letter-spacing:.14em;
  color:rgba(255,255,255,.28);
  padding:0 4px;
}

/* ---------- table ---------- */
.table{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
  padding:6px 0;
}
.lane{
  border-radius:18px;
  border:1px solid var(--line);
  padding:10px 10px 12px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.28);
  transition:border-color .3s, box-shadow .3s;
}
.lane.p{border-color:rgba(53,224,255,.16)}
.lane.a{border-color:rgba(255,77,141,.16)}
.lane.p.active{
  border-color:rgba(53,224,255,.55);
  box-shadow:0 0 0 1px rgba(53,224,255,.25), 0 0 34px rgba(53,224,255,.16), inset 0 1px 0 rgba(255,255,255,.06);
}
.lane.a.active{
  border-color:rgba(255,77,141,.5);
  box-shadow:0 0 0 1px rgba(255,77,141,.2), 0 0 34px rgba(255,77,141,.14), inset 0 1px 0 rgba(255,255,255,.06);
}
.lane-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;
}
.tag{
  font-size:9px;font-weight:800;letter-spacing:.2em;
  padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);
  color:var(--dim);
  background:rgba(255,255,255,.03);
}
.lane.p .tag{color:#8ceaff;border-color:rgba(53,224,255,.3);background:rgba(53,224,255,.08)}
.lane.a .tag{color:#ffa8c4;border-color:rgba(255,77,141,.3);background:rgba(255,77,141,.08)}
.lane-score{
  font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;
  color:var(--dim);
  transition:.2s;
}
.lane-score.live{color:#fff}

.dice-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(6px,2.2vw,12px);
  min-height:60px;
}

/* ---------- dice ---------- */
.die{
  --s:clamp(46px,13.2vw,76px);
  width:var(--s);height:var(--s);
  flex:0 0 auto;
  position:relative;
  border-radius:20%;
  background:linear-gradient(160deg,#ffffff 0%,#e6ecf9 55%,#cfd8ec 100%);
  box-shadow:
    0 5px 0 rgba(120,135,170,.55),
    0 10px 18px rgba(0,0,0,.45),
    inset 0 2px 3px rgba(255,255,255,.95),
    inset 0 -3px 6px rgba(110,125,160,.35);
  display:grid;place-items:center;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s, filter .16s;
  will-change:transform;
}
.die.small{--s:clamp(31px,8.6vw,50px)}
.die .pips{
  width:74%;height:74%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:7%;
}
.die .pip{
  width:100%;height:100%;
  border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #59647f 0%, #1a2134 62%, #0c1120 100%);
  box-shadow:inset 0 -1px 2px rgba(255,255,255,.18);
}
.die.ai{
  background:linear-gradient(160deg,#ffe9f1 0%,#f6c9d9 55%,#e2a9bd 100%);
  box-shadow:
    0 5px 0 rgba(170,110,135,.5),
    0 10px 18px rgba(0,0,0,.45),
    inset 0 2px 3px rgba(255,255,255,.9),
    inset 0 -3px 6px rgba(180,110,140,.3);
}
.die.ai .pip{background:radial-gradient(circle at 34% 28%, #7d4760 0%, #4a2233 62%, #2a1119 100%)}

.die.clickable{cursor:pointer}
.die.clickable:active{transform:scale(.94)}
.die.held{
  transform:translateY(-9px);
  box-shadow:
    0 0 0 3px var(--cyan),
    0 0 26px rgba(53,224,255,.75),
    0 10px 22px rgba(0,0,0,.5),
    inset 0 2px 3px rgba(255,255,255,.95);
}
.die.held::after{
  content:"HOLD";
  position:absolute;
  bottom:-17px;left:50%;
  transform:translateX(-50%);
  font-size:7.5px;font-weight:900;letter-spacing:.14em;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(53,224,255,.9);
  white-space:nowrap;
}
.die.rolling{
  animation:wobble .18s linear infinite;
  filter:brightness(1.12);
}
@keyframes wobble{
  0%{transform:rotate(-7deg) translateY(-2px)}
  50%{transform:rotate(6deg) translateY(2px)}
  100%{transform:rotate(-7deg) translateY(-2px)}
}
.die.pop{animation:pop .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{
  0%{transform:scale(1)}
  45%{transform:scale(1.16)}
  100%{transform:scale(1)}
}
.die.dim{filter:grayscale(.45) brightness(.72);opacity:.6}
.die.win{
  box-shadow:
    0 0 0 3px var(--gold),
    0 0 30px rgba(255,201,74,.8),
    0 10px 22px rgba(0,0,0,.5);
}

/* ---------- center status ---------- */
.status{
  text-align:center;
  padding:2px 0 4px;
  min-height:44px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.combo-name{
  font-size:clamp(13px,4vw,17px);
  font-weight:900;
  letter-spacing:.1em;
  color:#fff;
  transition:.2s;
}
.combo-name.good{color:var(--gold);text-shadow:0 0 20px rgba(255,201,74,.55)}
.combo-name.bad{color:#8a97b4}
.combo-sub{
  font-size:10.5px;
  letter-spacing:.12em;
  font-weight:700;
  color:var(--dim);
}
.combo-sub b{color:#fff}

/* ---------- controls ---------- */
.controls{
  display:flex;
  gap:8px;
  margin-top:2px;
}
.btn{
  flex:1;
  border:none;
  border-radius:14px;
  padding:13px 8px 12px;
  font-family:inherit;
  font-size:11.5px;
  font-weight:900;
  letter-spacing:.12em;
  color:#04101a;
  cursor:pointer;
  position:relative;
  transition:transform .1s, filter .15s, box-shadow .2s, opacity .2s;
  overflow:hidden;
  line-height:1.25;
}
.btn small{
  display:block;
  font-size:8.5px;
  letter-spacing:.06em;
  font-weight:700;
  opacity:.72;
  margin-top:2px;
}
.btn:active:not(:disabled){transform:translateY(2px) scale(.985)}
.btn:disabled{opacity:.26;filter:grayscale(.7);cursor:not-allowed;box-shadow:none}
.btn.reroll{
  background:linear-gradient(180deg,#6ceaff,#22b8e0);
  box-shadow:0 4px 0 #0f7d9c, 0 10px 22px rgba(53,224,255,.28);
}
.btn.bank{
  background:linear-gradient(180deg,#7dffc4,#25d98d);
  box-shadow:0 4px 0 #0e8f5c, 0 10px 22px rgba(62,240,160,.26);
}
.btn.allin{
  background:linear-gradient(180deg,#ff9b6a,#ff4d4d);
  color:#fff;
  box-shadow:0 4px 0 #a01d1d, 0 10px 22px rgba(255,90,77,.3);
}
.btn.allin:not(:disabled){animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 4px 0 #a01d1d, 0 10px 22px rgba(255,90,77,.28)}
  50%{box-shadow:0 4px 0 #a01d1d, 0 10px 34px rgba(255,120,60,.7)}
}
.btn .kbd{
  position:absolute;top:4px;right:6px;
  font-size:8px;opacity:.5;font-weight:700;
}

.hint{
  text-align:center;
  font-size:9.5px;
  letter-spacing:.09em;
  color:rgba(255,255,255,.3);
  font-weight:600;
  min-height:13px;
}

/* ---------- banner ---------- */
.banner{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.72);
  font-size:clamp(22px,8vw,40px);
  font-weight:900;
  letter-spacing:.06em;
  pointer-events:none;
  opacity:0;
  z-index:60;
  text-align:center;
  white-space:nowrap;
  transition:opacity .18s, transform .3s cubic-bezier(.34,1.56,.64,1);
  text-shadow:0 0 34px currentColor;
}
.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner.good{color:var(--gold)}
.banner.bad{color:var(--magenta)}
.banner.mid{color:#fff}

/* ---------- overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;
  display:grid;place-items:center;
  padding:20px;
  background:rgba(4,6,12,.82);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  transition:opacity .3s;
}
.overlay.hidden{opacity:0;pointer-events:none}
.panel{
  width:min(360px,100%);
  text-align:center;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(180deg,rgba(30,40,66,.96),rgba(14,18,30,.98));
  padding:26px 22px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1);
  transform:scale(1);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.overlay.hidden .panel{transform:scale(.9)}
.panel h2{
  margin:0 0 8px;
  font-size:clamp(22px,7vw,30px);
  font-weight:900;
  letter-spacing:.04em;
  line-height:1.1;
}
.panel h2.win{color:var(--gold);text-shadow:0 0 34px rgba(255,201,74,.55)}
.panel h2.lose{color:var(--magenta);text-shadow:0 0 34px rgba(255,77,141,.5)}
.panel p{
  margin:0 0 20px;
  font-size:11.5px;
  letter-spacing:.1em;
  color:var(--dim);
  font-weight:700;
  line-height:1.7;
}
.panel p b{color:#fff}
.panel .btn{width:100%;flex:none;padding:14px}

/* ---------- misc ---------- */
.sound{
  position:absolute;
  right:14px;bottom:12px;
  width:30px;height:30px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
  color:var(--dim);
  font-size:13px;
  cursor:pointer;
  display:grid;place-items:center;
  font-family:inherit;
  line-height:1;
  padding:0;
}
.sound:hover{color:#fff;border-color:rgba(255,255,255,.25)}

.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}
  40%,60%{transform:translateX(7px)}
}

@media (max-height:620px){
  .lane{padding:7px 8px 9px}
  .lane-head{margin-bottom:5px}
  .status{min-height:34px}
  .btn{padding:10px 8px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">DICE<span>BATTLE</span></div>
    <div class="round-tag">ROUND <b id="roundNum">1</b> &middot; BEST OF 5</div>
  </header>

  <div class="board">
    <div class="side p">
      <div class="nm">YOU</div>
      <div class="pts" id="pPts">0<span class="u">PTS</span></div>
      <div class="wins" id="pWins"></div>
    </div>
    <div class="vs">VS</div>
    <div class="side a">
      <div class="nm">AI</div>
      <div class="pts" id="aPts">0<span class="u">PTS</span></div>
      <div class="wins" id="aWins"></div>
    </div>
  </div>

  <div class="table">
    <div class="lane a" id="laneA">
      <div class="lane-head">
        <span class="tag">AI</span>
        <span class="lane-score" id="aScore">—</span>
      </div>
      <div class="dice-row" id="aiRow"></div>
    </div>

    <div class="status">
      <div class="combo-name" id="comboName">TAP ROLL TO BEGIN</div>
      <div class="combo-sub" id="comboSub">5 dice · 2 re-rolls · first to 3 rounds</div>
    </div>

    <div class="lane p active" id="laneP">
      <div class="lane-head">
        <span class="tag">YOU</span>
        <span class="lane-score" id="pScore">—</span>
      </div>
      <div class="dice-row" id="pRow"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn reroll" id="btnReroll">RE-ROLL<small id="rrLabel">2 LEFT</small><span class="kbd">R</span></button>
    <button class="btn bank" id="btnBank">BANK<small>LOCK SCORE</small><span class="kbd">B</span></button>
    <button class="btn allin" id="btnAllIn">ALL IN<small>2 PAIR+ = ×2</small><span class="kbd">A</span></button>
  </div>

  <div class="hint" id="hint">Tap a die to hold it, then re-roll the rest.</div>

  <button class="sound" id="btnSound" title="Toggle sound" aria-label="Toggle sound"><svg viewBox="0 0 24 24" style="width:1.1em;height:1.1em;vertical-align:-.15em"><path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z" fill="currentColor"/><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<div class="banner" id="banner"></div>

<div class="overlay hidden" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">MATCH OVER</h2>
    <p id="ovSub"></p>
    <button class="btn bank" id="ovBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==================== helpers ==================== */
var $ = function(id){ return document.getElementById(id); };
var rnd = function(){ return 1 + Math.floor(Math.random()*6); };
var sleep = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

var PIPS = {
  0: [],
  1: [[2,2]],
  2: [[1,1],[3,3]],
  3: [[1,1],[2,2],[3,3]],
  4: [[1,1],[1,3],[3,1],[3,3]],
  5: [[1,1],[1,3],[2,2],[3,1],[3,3]],
  6: [[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
};

/* ==================== audio ==================== */
var AC = null, soundOn = true;
function actx(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
  }
  if (AC && AC.state === "suspended") { try { AC.resume(); } catch(e){} }
  return AC;
}
function tone(freq, dur, type, gain, delay){
  if (!soundOn) return;
  var c = actx(); if (!c) return;
  try {
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
function sweep(f1, f2, dur, type, gain){
  if (!soundOn) return;
  var c = actx(); if (!c) return;
  try {
    var t0 = c.currentTime;
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sawtooth";
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.05, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}
var SFX = {
  roll: function(){ for (var i=0;i<3;i++) tone(160 + Math.random()*260, 0.05, "square", 0.022, i*0.05); },
  hold: function(){ tone(880, 0.05, "sine", 0.03); },
  bank: function(){ tone(523.25, 0.1, "triangle", 0.05); tone(783.99, 0.16, "triangle", 0.045, 0.07); },
  win:  function(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f, 0.2, "triangle", 0.055, i*0.075); }); },
  lose: function(){ [392,349.23,293.66,233.08].forEach(function(f,i){ tone(f, 0.24, "sawtooth", 0.035, i*0.09); }); },
  draw: function(){ tone(440, 0.18, "triangle", 0.04); tone(440, 0.18, "triangle", 0.04, 0.2); },
  bust: function(){ sweep(220, 55, 0.5, "sawtooth", 0.07); },
  allin:function(){ sweep(180, 900, 0.4, "square", 0.045); }
};

/* ==================== scoring ==================== */
var COMBOS = {
  0: { name: "NOTHING",        bonus: 0,   tier: 0 },
  1: { name: "PAIR",           bonus: 10,  tier: 1 },
  2: { name: "TWO PAIR",       bonus: 20,  tier: 2 },
  3: { name: "THREE OF A KIND",bonus: 30,  tier: 3 },
  4: { name: "STRAIGHT",       bonus: 45,  tier: 4 },
  5: { name: "FULL HOUSE",     bonus: 50,  tier: 5 },
  6: { name: "FOUR OF A KIND", bonus: 70,  tier: 6 },
  7: { name: "FIVE OF A KIND", bonus: 120, tier: 7 }
};

function evaluate(values){
  var sorted = values.slice().sort(function(a,b){ return a-b; });
  var counts = {};
  sorted.forEach(function(v){ counts[v] = (counts[v] || 0) + 1; });
  var groups = Object.keys(counts).map(function(k){ return counts[k]; })
                    .sort(function(a,b){ return b-a; });
  var sum = sorted.reduce(function(a,b){ return a+b; }, 0);
  var joined = sorted.join("");
  var straight = (joined === "12345" || joined === "23456");

  var key;
  if (groups[0] === 5) key = 7;
  else if (groups[0] === 4) key = 6;
  else if (groups[0] === 3 && groups[1] === 2) key = 5;
  else if (straight) key = 4;
  else if (groups[0] === 3) key = 3;
  else if (groups[0] === 2 && groups[1] === 2) key = 2;
  else if (groups[0] === 2) key = 1;
  else key = 0;

  var c = COMBOS[key];
  return { key: key, name: c.name, tier: c.tier, bonus: c.bonus, sum: sum, total: sum + c.bonus };
}

/* ==================== state ==================== */
var S = {
  wins:   { p: 0, a: 0 },
  pts:    { p: 0, a: 0 },
  round:  0,
  dice:   { p: [0,0,0,0,0], a: [0,0,0,0,0] },
  held:   [false,false,false,false,false],
  rerolls: 2,
  riskUsed: false,
  pScore: null,
  aScore: null,
  phase:  "idle",     // idle | player | ai | resolve | over
  busy:   false,
  allIn:  null        // null | "win" | "bust"
};

/* ==================== DOM build ==================== */
var pRow = $("pRow"), aiRow = $("aiRow");
var pEls = [], aEls = [];

function makeDie(parent, extra){
  var d = document.createElement("div");
  d.className = "die " + extra;
  var g = document.createElement("div");
  g.className = "pips";
  d.appendChild(g);
  parent.appendChild(d);
  return d;
}
for (var i = 0; i < 5; i++){
  var pd = makeDie(pRow, "clickable");
  pd.dataset.idx = i;
  pd.addEventListener("click", onDieClick);
  pEls.push(pd);
  aEls.push(makeDie(aiRow, "ai small"));
}

function renderFace(dieEl, value){
  var grid = dieEl.firstChild;
  var pips = PIPS[value] || [];
  grid.innerHTML = "";
  for (var i = 0; i < pips.length; i++){
    var p = document.createElement("span");
    p.className = "pip";
    p.style.gridArea = pips[i][0] + " / " + pips[i][1];
    grid.appendChild(p);
  }
  dieEl.dataset.value = value;
}

function paintDice(){
  for (var i = 0; i < 5; i++){
    if (!S.busy) renderFace(pEls[i], S.dice.p[i]);
    pEls[i].classList.toggle("held", !!S.held[i]);
    pEls[i].classList.toggle("clickable", S.phase === "player" && !S.busy);
    if (!S.busy) renderFace(aEls[i], S.dice.a[i]);
  }
}

function animateRoll(els, values, baseDelay, only){
  baseDelay = baseDelay || 0;
  var list = only || values.map(function(_, i){ return i; });
  return Promise.all(list.map(function(i){
    var v = values[i];
    return new Promise(function(resolve){
      var d = els[i];
      d.classList.add("rolling");
      var iv = setInterval(function(){
        renderFace(d, rnd());
      }, 55);
      setTimeout(function(){
        clearInterval(iv);
        renderFace(d, v);
        d.classList.remove("rolling");
        d.classList.add("pop");
        setTimeout(function(){ d.classList.remove("pop"); }, 240);
        resolve();
      }, baseDelay + 420 + i * 75);
    });
  }));
}

/* ==================== UI ==================== */
function winDots(el, n){
  el.innerHTML = "";
  for (var i = 0; i < 3; i++){
    var s = document.createElement("i");
    s.className = "wdot" + (i < n ? " on" : "");
    el.appendChild(s);
  }
}

function updateUI(){
  $("roundNum").textContent = S.round || 1;
  $("pPts").innerHTML = S.pts.p + '<span class="u">PTS</span>';
  $("aPts").innerHTML = S.pts.a + '<span class="u">PTS</span>';
  winDots($("pWins"), S.wins.p);
  winDots($("aWins"), S.wins.a);

  $("laneP").classList.toggle("active", S.phase === "player");
  $("laneA").classList.toggle("active", S.phase === "ai");

  var pS = $("pScore"), aS = $("aScore");
  pS.textContent = S.pScore === null ? "—" : S.pScore + " pts";
  pS.classList.toggle("live", S.pScore !== null);
  aS.textContent = S.aScore === null ? "—" : S.aScore + " pts";
  aS.classList.toggle("live", S.aScore !== null);

  $("rrLabel").textContent = S.rerolls + " LEFT";
  $("btnReroll").disabled = !(S.phase === "player" && !S.busy && S.rerolls > 0 && !allHeld());
  $("btnBank").disabled   = !(S.phase === "player" && !S.busy);
  $("btnAllIn").disabled  = !(S.phase === "player" && !S.busy && !S.riskUsed);

  paintDice();
  updateComboReadout();
}

function allHeld(){
  return S.held.every(function(h){ return h; });
}

function updateComboReadout(){
  var nameEl = $("comboName"), subEl = $("comboSub");

  if (S.phase === "idle"){
    nameEl.className = "combo-name";
    nameEl.textContent = "TAP RE-ROLL TO START";
    subEl.innerHTML = "5 dice &middot; 2 re-rolls &middot; first to 3 rounds";
    return;
  }
  if (S.phase === "over"){ return; }

  if (S.phase === "player" || S.busy){
    var ev = evaluate(S.dice.p);
    nameEl.className = "combo-name " + (ev.tier >= 2 ? "good" : "bad");
    nameEl.textContent = ev.name;
    subEl.innerHTML = "SUM <b>" + ev.sum + "</b> + BONUS <b>" + ev.bonus + "</b> = <b>" + ev.total + "</b> PTS";
    return;
  }
  if (S.phase === "ai"){
    nameEl.className = "combo-name";
    nameEl.textContent = "AI IS ROLLING";
    subEl.textContent = "hold tight…";
    return;
  }
  if (S.phase === "resolve"){
    nameEl.className = "combo-name good";
    nameEl.textContent = "ROUND " + S.round + " COMPLETE";
    subEl.innerHTML = "YOU <b>" + (S.pScore||0) + "</b> &nbsp;vs&nbsp; AI <b>" + (S.aScore||0) + "</b>";
  }
}

var hintEl = $("hint");
function hint(t){ hintEl.textContent = t; }

var bannerEl = $("banner");
var bannerTimer = null;
function banner(text, cls){
  clearTimeout(bannerTimer);
  bannerEl.textContent = text;
  bannerEl.className = "banner show " + (cls || "mid");
  bannerTimer = setTimeout(function(){
    bannerEl.className = "banner " + (cls || "mid");
  }, 950);
}

/* ==================== player actions ==================== */
function onDieClick(e){
  if (S.phase !== "player" || S.busy) return;
  var idx = parseInt(e.currentTarget.dataset.idx, 10);
  S.held[idx] = !S.held[idx];
  if (S.held[idx]) SFX.hold();
  updateUI();
  hint(S.held[idx] ? "Die held — re-roll the rest, or bank." : "Tap dice to hold them before re-rolling.");
}

function actReroll(){
  if (S.phase !== "player" || S.busy || S.rerolls <= 0 || allHeld()) return;
  S.busy = true;
  S.rerolls--;
  var idx = [];
  for (var i = 0; i < 5; i++){
    if (!S.held[i]){ S.dice.p[i] = rnd(); idx.push(i); }
  }
  SFX.roll();
  updateUI();
  hint("Re-rolling " + idx.length + " dice…");
  animateRoll(pEls, S.dice.p, 0, idx).then(function(){
    S.busy = false;
    updateUI();
    hint(S.rerolls > 0 ? "Re-rolls left: " + S.rerolls + "." : "No re-rolls left — bank it or go ALL IN.");
  });
}

function actBank(){
  if (S.phase !== "player" || S.busy) return;
  S.busy = true;
  var ev = evaluate(S.dice.p);
  S.pScore = ev.total;
  SFX.bank();
  hint("Banked " + ev.total + " points.");
  S.phase = "ai";
  S.busy = false;
  updateUI();
  setTimeout(function(){ aiTurn(); }, 520);
}

function actAllIn(){
  if (S.phase !== "player" || S.busy || S.riskUsed) return;
  S.busy = true;
  S.riskUsed = true;
  S.held = [false,false,false,false,false];
  S.dice.p = [rnd(), rnd(), rnd(), rnd(), rnd()];
  SFX.allin();
  updateUI();
  hint("ALL IN — everything rides on this roll!");
  animateRoll(pEls, S.dice.p, 0).then(function(){
    var ev = evaluate(S.dice.p);
    var success = ev.tier >= 2;
    S.allIn = success ? "win" : "bust";
    if (success){
      S.pScore = ev.total * 2;
      SFX.win();
      banner("ALL IN! ×2", "good");
      hint(ev.name + " — doubled to " + S.pScore + "!");
      pEls.forEach(function(d, i){
        setTimeout(function(){ d.classList.add("win"); }, i * 60);
      });
    } else {
      S.pScore = 0;
      SFX.bust();
      banner("BUSTED", "bad");
      hint(ev.name + " — the all-in fizzles. 0 points.");
      document.getElementById("app").classList.add("shake");
      setTimeout(function(){ document.getElementById("app").classList.remove("shake"); }, 450);
    }
    S.busy = false;
    S.phase = "ai";
    updateUI();
    setTimeout(function(){ aiTurn(); }, 900);
  });
}

/* ==================== AI ==================== */
function chooseHolds(values){
  var counts = {};
  values.forEach(function(v, i){ (counts[v] = counts[v] || []).push(i); });
  var groups = Object.keys(counts).map(function(k){ return counts[k]; })
                    .sort(function(a, b){ return b.length - a.length; });
  var keep = [false,false,false,false,false];

  if (groups[0].length >= 4){
    groups[0].forEach(function(i){ keep[i] = true; });
    return keep;
  }
  if (groups[0].length === 3){
    groups[0].forEach(function(i){ keep[i] = true; });
    if (groups[1] && groups[1].length === 2){
      groups[1].forEach(function(i){ keep[i] = true; });
    }
    return keep;
  }
  if (groups[0].length === 2){
    groups[0].forEach(function(i){ keep[i] = true; });
    if (groups[1] && groups[1].length === 2){
      groups[1].forEach(function(i){ keep[i] = true; });
    }
    return keep;
  }

  // hunt for a straight run
  var uniq = [];
  values.forEach(function(v){ if (uniq.indexOf(v) === -1) uniq.push(v); });
  uniq.sort(function(a, b){ return a - b; });

  var best = [], run = [];
  for (var i = 0; i < uniq.length; i++){
    if (i > 0 && uniq[i] === uniq[i-1] + 1) run.push(uniq[i]);
    else run = [uniq[i]];
    if (run.length > best.length) best = run.slice();
  }
  if (best.length >= 4){
    var used = {};
    values.forEach(function(v, idx){
      if (best.indexOf(v) !== -1 && !used[v]){ keep[idx] = true; used[v] = true; }
    });
    return keep;
  }
  return keep;
}

async function aiTurn(){
  S.phase = "ai";
  S.aScore = null;
  S.dice.a = [0,0,0,0,0];
  updateUI();
  hint("AI takes the table…");

  await sleep(300);
  S.dice.a = [rnd(), rnd(), rnd(), rnd(), rnd()];
  SFX.roll();
  await animateRoll(aEls, S.dice.a, 0);

  var rerolls = 2;
  while (rerolls > 0){
    await sleep(330);
    var keep = chooseHolds(S.dice.a);
    if (keep.every(Boolean)) break;
    for (var i = 0; i < 5; i++){ if (!keep[i]) S.dice.a[i] = rnd(); }
    rerolls--;
    SFX.roll();
    await animateRoll(aEls, S.dice.a, 0);
  }

  await sleep(320);
  var ev = evaluate(S.dice.a);
  var score = ev.total;

  // AI risk logic: desperate hands go all in
  if (score < 30 && Math.random() < 0.75){
    hint("AI goes ALL IN!");
    await sleep(560);
    SFX.allin();
    S.dice.a = [rnd(), rnd(), rnd(), rnd(), rnd()];
    await animateRoll(aEls, S.dice.a, 0);
    var ev2 = evaluate(S.dice.a);
    if (ev2.tier >= 2){
      score = ev2.total * 2;
      banner("AI ALL IN ×2", "bad");
      aEls.forEach(function(d, i){
        setTimeout(function(){ d.classList.add("win"); }, i * 60);
      });
    } else {
      score = 0;
      banner("AI BUSTS", "good");
      SFX.bust();
    }
    await sleep(750);
  }

  S.aScore = score;
  S.phase = "resolve";
  updateUI();
  await sleep(500);
  resolveRound();
}

/* ==================== round resolution ==================== */
function clearDiceFx(){
  pEls.forEach(function(d){ d.classList.remove("win"); });
  aEls.forEach(function(d){ d.classList.remove("win"); });
}

function resolveRound(){
  clearDiceFx();
  S.phase = "resolve";
  var p = S.pScore || 0;
  var a = S.aScore || 0;

  S.pts.p += p;
  S.pts.a += a;

  var msg, cls;
  if (p > a){
    S.wins.p++;
    msg = "ROUND WON";
    cls = "good";
    SFX.win();
  } else if (a > p){
    S.wins.a++;
    msg = "ROUND LOST";
    cls = "bad";
    SFX.lose();
  } else {
    msg = "DRAW";
    cls = "mid";
    SFX.draw();
  }

  updateUI();
  banner(msg, cls);
  hint("You " + p + " — AI " + a + "  ·  rounds " + S.wins.p + "–" + S.wins.a);

  setTimeout(function(){
    if (S.wins.p >= 3 || S.wins.a >= 3){
      endMatch();
    } else {
      startRound();
    }
  }, 1650);
}

function endMatch(){
  S.phase = "over";
  updateUI();
  var won = S.wins.p >= 3;
  var t = $("ovTitle"), sub = $("ovSub");
  t.className = won ? "win" : "lose";
  t.textContent = won ? "YOU WIN THE MATCH" : "AI WINS THE MATCH";
  sub.innerHTML = "ROUNDS <b>" + S.wins.p + " – " + S.wins.a + "</b><br>" +
                  "TOTAL POINTS <b>" + S.pts.p + " – " + S.pts.a + "</b>";
  $("overlay").classList.remove("hidden");
  if (won) SFX.win(); else SFX.lose();
  hint(won ? "Champion of the table." : "Run it back?");
}

/* ==================== round flow ==================== */
function startRound(){
  clearDiceFx();
  S.round++;
  S.held = [false,false,false,false,false];
  S.rerolls = 2;
  S.riskUsed = false;
  S.allIn = null;
  S.pScore = null;
  S.aScore = null;
  S.dice.a = [0,0,0,0,0];
  S.dice.p = [rnd(), rnd(), rnd(), rnd(), rnd()];
  S.phase = "player";
  S.busy = true;
  updateUI();
  hint("Rolling…");
  SFX.roll();
  animateRoll(pEls, S.dice.p, 100).then(function(){
    S.busy = false;
    updateUI();
    hint("Tap dice to hold them, then re-roll the rest.");
  });
}

function resetMatch(){
  S.wins.p = 0; S.wins.a = 0;
  S.pts.p = 0;  S.pts.a = 0;
  S.round = 0;
  S.dice.p = [0,0,0,0,0];
  S.dice.a = [0,0,0,0,0];
  S.held = [false,false,false,false,false];
  S.pScore = null; S.aScore = null;
  S.phase = "idle";
  S.busy = false;
  $("overlay").classList.add("hidden");
  updateUI();
  startRound();
}

/* ==================== wiring ==================== */
$("btnReroll").addEventListener("click", actReroll);
$("btnBank").addEventListener("click", actBank);
$("btnAllIn").addEventListener("click", actAllIn);
$("ovBtn").addEventListener("click", resetMatch);

$("btnSound").addEventListener("click", function(){
  soundOn = !soundOn;
  this.innerHTML = soundOn
  ? '<svg viewBox="0 0 24 24" style="width:1.1em;height:1.1em;vertical-align:-.15em"><path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z" fill="currentColor"/><path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  : '<svg viewBox="0 0 24 24" style="width:1.1em;height:1.1em;vertical-align:-.15em"><path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z" fill="currentColor"/><path d="M15 10l5 5M20 10l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  this.style.color = soundOn ? "" : "#5a6a86";
  if (soundOn) SFX.hold();
});

document.addEventListener("keydown", function(e){
  if (e.repeat) return;
  var k = e.key.toLowerCase();
  if (k === "r") actReroll();
  else if (k === "b") actBank();
  else if (k === "a") actAllIn();
  else if (k === "enter" && !$("overlay").classList.contains("hidden")) resetMatch();
});

/* boot */
winDots($("pWins"), 0);
winDots($("aWins"), 0);
for (var j = 0; j < 5; j++){ renderFace(pEls[j], 0); renderFace(aEls[j], 0); }
updateUI();
setTimeout(startRound, 420);


  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":87,"label":"Dice rounds won","goals":[1,2,3],"note":"Build combinations and time when to bank instead of chasing a riskier hand.","seconds":300}, { read: () => { return (S.wins.p); } });
})();
</script>
