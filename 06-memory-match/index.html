<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 30%, #2b3a67 0%, #141a2e 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }

  h1 {
    font-size: 2rem;
    letter-spacing: 2px;
    margin-bottom: 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  h1 span { color: #ffd166; }

  .hud {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 20px;
    font-size: 1.1rem;
  }
  .hud .stat {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 8px 18px;
    min-width: 120px;
    text-align: center;
  }
  .hud .label {
    display: block;
    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9fb0d8;
  }
  .hud .value { font-weight: 700; font-variant-numeric: tabular-nums; }

  #restartBtn {
    background: #ffd166;
    color: #141a2e;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, background .12s;
  }
  #restartBtn:hover { background: #ffdf8f; transform: scale(1.05); }

  #board {
    display: grid;
    grid-template-columns: repeat(4, 96px);
    gap: 12px;
  }

  .card {
    width: 96px;
    height: 96px;
    perspective: 600px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .35s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face.back {
    background: linear-gradient(135deg, #4a5f9e, #2c3a66);
    border: 2px solid rgba(255,255,255,.2);
    font-size: 1.8rem;
    color: rgba(255,255,255,.35);
  }
  .card:not(.flipped):not(.matched):hover .face.back {
    background: linear-gradient(135deg, #5a70b8, #36487e);
  }
  .face.front {
    background: linear-gradient(135deg, #fdfbfb, #d9e2f3);
    transform: rotateY(180deg);
    font-size: 2.6rem;
    border: 2px solid #fff;
  }
  .card.matched { cursor: default; }
  .card.matched .face.front {
    background: linear-gradient(135deg, #b8f5c8, #7fe0a0);
    animation: pop .4s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .face.front { animation: shake .35s ease; }
  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }

  #winOverlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,28,.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #winOverlay.show { display: flex; }
  .win-box {
    background: linear-gradient(160deg, #26355e, #141a2e);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 18px;
    padding: 40px 56px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    animation: rise .35s ease;
  }
  @keyframes rise {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .win-box h2 { font-size: 2.2rem; margin-bottom: 8px; color: #ffd166; }
  .win-box p { font-size: 1.15rem; margin-bottom: 24px; color: #cdd8f0; }
  .win-box button {
    background: #ffd166;
    color: #141a2e;
    border: none;
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, background .12s;
  }
  .win-box button:hover { background: #ffdf8f; transform: scale(1.05); }

  @media (max-width: 520px) {
    #board { grid-template-columns: repeat(4, 72px); gap: 8px; }
    .card { width: 72px; height: 72px; }
    .face.front { font-size: 2rem; }
    .hud { gap: 10px; flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<h1>🧠 Memory <span>Match</span></h1>

<div class="hud">
  <div class="stat"><span class="label">Time</span><span class="value" id="timer">0:00</span></div>
  <div class="stat"><span class="label">Moves</span><span class="value" id="moves">0</span></div>
  <button id="restartBtn">Restart</button>
</div>

<div id="board"></div>

<div id="winOverlay">
  <div class="win-box">
    <h2>🎉 You Win!</h2>
    <p id="winStats"></p>
    <button id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var EMOJIS = ['🍎', '🚀', '🐸', '🎸', '🌵', '⚽', '🍩', '🦄'];
  var FLIP_BACK_DELAY = 800;

  var board = document.getElementById('board');
  var timerEl = document.getElementById('timer');
  var movesEl = document.getElementById('moves');
  var winOverlay = document.getElementById('winOverlay');
  var winStats = document.getElementById('winStats');

  var firstCard = null;
  var lockBoard = false;
  var matchedPairs = 0;
  var moves = 0;
  var seconds = 0;
  var timerId = null;
  var timerStarted = false;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function startTimer() {
    if (timerStarted) return;
    timerStarted = true;
    timerId = setInterval(function () {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function buildBoard() {
    board.innerHTML = '';
    var deck = shuffle(EMOJIS.concat(EMOJIS));
    deck.forEach(function (emoji) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face back">?</div>' +
          '<div class="face front">' + emoji + '</div>' +
        '</div>';
      card.addEventListener('click', onCardClick);
      board.appendChild(card);
    });
  }

  function onCardClick() {
    if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;
    startTimer();
    this.classList.add('flipped');

    if (!firstCard) {
      firstCard = this;
      return;
    }

    moves++;
    movesEl.textContent = moves;

    if (firstCard.dataset.emoji === this.dataset.emoji) {
      firstCard.classList.add('matched');
      this.classList.add('matched');
      firstCard = null;
      matchedPairs++;
      if (matchedPairs === EMOJIS.length) onWin();
    } else {
      var a = firstCard, b = this;
      firstCard = null;
      lockBoard = true;
      a.classList.add('wrong');
      b.classList.add('wrong');
      setTimeout(function () {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        lockBoard = false;
      }, FLIP_BACK_DELAY);
    }
  }

  function onWin() {
    stopTimer();
    winStats.textContent = 'Completed in ' + formatTime(seconds) + ' with ' + moves + ' moves.';
    setTimeout(function () { winOverlay.classList.add('show'); }, 600);
  }

  function reset() {
    stopTimer();
    firstCard = null;
    lockBoard = false;
    matchedPairs = 0;
    moves = 0;
    seconds = 0;
    timerStarted = false;
    timerEl.textContent = '0:00';
    movesEl.textContent = '0';
    winOverlay.classList.remove('show');
    buildBoard();
  }

  document.getElementById('restartBtn').addEventListener('click', reset);
  document.getElementById('playAgainBtn').addEventListener('click', reset);

  buildBoard();
})();
</script>

</body>
</html>
