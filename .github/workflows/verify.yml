name: Verify arcade
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: arcade-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/native-modes.cjs
      - run: node tests/laser.cjs
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
