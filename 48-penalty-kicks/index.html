<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- daylight:early -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">
<script src="../assets/audio-lifecycle.js?v=daylight1"></script>
<script src="../assets/stage-light.js?v=daylight1"></script>
<!-- /daylight:early -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Penalty Kicks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none}
  body {
    background: radial-gradient(700px 300px at 50% -5%, #123f22, #082b14 70%) fixed, #082b14;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px; color: #fff;
    user-select: none;
  }
  h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  #hud {
    width: 900px; max-width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; font-size: 15px;
  }
  #score { font-size: 22px; font-weight: bold; }
  #marks { letter-spacing: 4px; font-size: 15px; }
  #msg { min-height: 22px; font-weight: 600; color: #ffe066; text-align: center; }
  canvas {
    background: #1e7a34;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 40px rgba(30,122,52,.25);
    cursor: crosshair;
    max-width: 100%; height: auto;
    touch-action: none;
  }
  #restart {
    margin-top: 12px; padding: 10px 28px;
    font-size: 16px; font-weight: bold;
    background: #ffe066; color: #1a1a1a;
    border: none; border-radius: 6px; cursor: pointer;
    box-shadow: 0 3px 0 #c8a800;
  }
  #restart:active { transform: translateY(2px); box-shadow: 0 1px 0 #c8a800; }
</style>

<script>window.__arcadeNativeUpgrade = {"id": 48, "name": "Read the Keeper", "description": "The keeper remembers your last shot zone. Repeating it makes a save much more likely."}; const arcadeVariant = new URLSearchParams(location.search).get("mode") === "plus" || new URLSearchParams(location.search).get("plus") === "1";</script>
<!-- daylight:late -->
<link rel="stylesheet" href="../assets/stage-light.css?v=daylight1">
<!-- /daylight:late -->
</head>
<body>
<h1>PENALTY KICKS</h1>
<div id="hud">
  <span id="score">YOU 0 - 0 AI</span>
  <span id="round">Round 1 / 5</span>
  <span id="marks"></span>
</div>
<div id="msg">Click in the goal to aim your shot!</div>
<canvas id="c" width="900" height="560"></canvas>
<button id="restart">Restart Match</button>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), roundEl = document.getElementById('round'),
      msgEl = document.getElementById('msg'), marksEl = document.getElementById('marks');

const GOAL = { x: 180, y: 60, w: 540, h: 190 };
const SPOT = { x: 450, y: 480 };
const KEEPER_HOME = { x: 450, y: 225 };
const ROUNDS = 5;

// ===== AAA audio kit (procedural; honors overlay prefs) =====
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function sfxOn(){try{return localStorage.getItem('aaa_sfx')!=='0'}catch(e){return true}}
function bgmOn(){try{return localStorage.getItem('aaa_bgm')!=='0'}catch(e){return true}}
function tone(f,d,ty,v,sl,t){if(!sfxOn())return;const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);g.gain.setValueAtTime(.0008,n);g.gain.linearRampToValueAtTime(v||.08,n+.012);g.gain.exponentialRampToValueAtTime(.0006,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
function nz(d,v,f,q,ty,t){if(!sfxOn())return;const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),L=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,L,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<L;i++)dd[i]=(Math.random()*2-1)*(1-i/L);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=ty||'bandpass';fl.frequency.value=f||1400;fl.Q.value=q||.8;const g=c.createGain();g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0006,n+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n)}catch(e){}}
function whistle(t){tone(2600,.35,'square',.05,null,t);tone(2600,.1,'square',.05,null,(t||0)+.45)}
function stinger(w){(w?[523,659,784,1047]:[392,349,311,262]).forEach(function(f,i){tone(f,w?.2:.24,w?'triangle':'sawtooth',w?.09:.05,null,i*(w?.1:.12))})}
// stadium crowd bed + chant drum
let crowdOn=false;
setInterval(()=>{
  const want=bgmOn();
  if(want&&!crowdOn){crowdOn=true;
    try{const c=ac();if(!c)return;
      const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),dd=b.getChannelData(0);
      for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*.5;
      const s=c.createBufferSource();s.buffer=b;s.loop=true;
      const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=500;fl.Q.value=.35;
      const g=c.createGain();g.gain.value=.012;
      s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();
      window.__pkCrowd={s,g};
    }catch(e){}
  }else if(!want&&crowdOn){crowdOn=false;try{window.__pkCrowd.s.stop()}catch(e){}window.__pkCrowd=null}
},400);
let cheerT=0,netHit=0;

let phase, anim, hover, results, myScore, aiScore, round, sudden, banner, bannerT, lastShotZone;

function reset() {
  phase = 'shoot'; lastShotZone = null;       // 'shoot' | 'keep' | 'over'
  anim = null;           // active animation
  hover = null;          // hovered zone {c,r} or null
  results = { me: [], ai: [] };
  myScore = aiScore = 0; round = 1; sudden = false;
  banner = ''; bannerT = 0;
  msgEl.textContent = 'Click in the goal to aim your shot!';
  updateHud();
}

function updateHud() {
  scoreEl.textContent = `YOU ${myScore} - ${aiScore} AI`;
  roundEl.textContent = sudden ? 'Sudden Death' : `Round ${round} / ${ROUNDS}`;
  const mk = a => a.map(v => v ? '\u25CF' : '\u25CB').join('');
  marksEl.innerHTML = `<span style="color:#7dff9b">${mk(results.me)}</span>&nbsp;|&nbsp;<span style="color:#ff8a8a">${mk(results.ai)}</span>`;
}

// zone under point: {c:0..2, r:0..1} inside goal, or null
function zoneAt(px, py) {
  if (px < GOAL.x || px > GOAL.x + GOAL.w || py < GOAL.y || py > GOAL.y + GOAL.h) return null;
  return { c: Math.min(2, Math.floor((px - GOAL.x) / (GOAL.w / 3))), r: py < GOAL.y + GOAL.h / 2 ? 0 : 1 };
}
function zoneCenter(z) {
  return { x: GOAL.x + (z.c + 0.5) * GOAL.w / 3, y: GOAL.y + (z.r + 0.5) * GOAL.h / 2 };
}
const sameZone = (a, b) => a && b && a.c === b.c && a.r === b.r;

function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}

cv.addEventListener('mousemove', e => {
  if (anim || phase === 'over') { hover = null; return; }
  const p = canvasPos(e);
  hover = zoneAt(p.x, p.y);
});

cv.addEventListener('click', e => {
  if (anim || phase === 'over') return;
  const p = canvasPos(e), z = zoneAt(p.x, p.y);
  if (phase === 'shoot') playerShoot(z, p);
  else playerKeep(z);
});

function playerShoot(z, p) {
  // Keeper AI: reads your aim ~30% of the time, otherwise guesses randomly
  let kz;
  if (z && Math.random() < (arcadeVariant && sameZone(z,lastShotZone) ? .76 : .30)) kz = z;
  else kz = { c: (Math.random() * 3) | 0, r: (Math.random() * 2) | 0 };
  const target = z ? zoneCenter(z) : { x: p.x, y: Math.min(p.y, GOAL.y - 30) }; // off-goal click = skied/wide
  const scored = !!z && !sameZone(z, kz);
  if (z) lastShotZone = z;
  nz(.1,.16,220,1,'lowpass'); tone(140,.08,'sine',.08); nz(.25,.06,2400,.8,'highpass');
  anim = { kind: 'shot', t: 0, dur: 55, ballFrom: SPOT, ballTo: target, keeperTo: zoneCenter(kz), z, scored,
           onDone: () => {
             myScore += scored ? 1 : 0;
             results.me.push(scored);
             if(scored){cheerT=120;netHit=1;nz(.9,.24,800,.4,'bandpass');tone(523,.15,'triangle',.07);tone(659,.15,'triangle',.07,null,.09);tone(784,.22,'triangle',.08,null,.18)}
             else if(z){nz(.6,.16,500,.5,'bandpass');tone(220,.3,'sawtooth',.05,160);whistle(.3)}
             else{nz(.5,.1,400,.6,'bandpass');tone(180,.35,'sawtooth',.05,110)}
             banner = z ? (scored ? 'GOAL!' : 'SAVED!') : 'MISSED!';
             bannerT = 90; phase = 'keep';
             msgEl.textContent = 'Your turn in goal — click a zone to dive!';
             updateHud();
           } };
}

function playerKeep(z) {
  if (!z) return; // must pick a zone
  const aiZ = Math.random() < 0.10 ? null : { c: (Math.random() * 3) | 0, r: (Math.random() * 2) | 0 }; // 10% AI misses
  const target = aiZ ? zoneCenter(aiZ) : { x: GOAL.x - 60 - Math.random() * 80, y: GOAL.y + Math.random() * GOAL.h };
  const scored = !!aiZ && !sameZone(z, aiZ);
  nz(.25,.08,900,1.2);  // dive whoosh
  anim = { kind: 'shot', t: 0, dur: 55, ballFrom: SPOT, ballTo: target, keeperTo: zoneCenter(z), z: aiZ, scored,
           onDone: () => {
             aiScore += scored ? 1 : 0;
             results.ai.push(scored);
             if(scored){cheerT=70;nz(.7,.2,700,.4,'bandpass');tone(330,.3,'sawtooth',.05,220)}
             else{cheerT=100;nz(.8,.22,900,.4,'bandpass');if(aiZ){tone(660,.12,'triangle',.07);tone(880,.2,'triangle',.07,null,.1)}whistle(.3)}
             banner = scored ? 'AI SCORES!' : (aiZ ? 'YOU SAVE IT!' : 'AI MISSES!');
             bannerT = 90;
             updateHud(); nextRound();
           } };
}

function nextRound() {
  const n = results.me.length;
  if (!sudden && n >= ROUNDS) {
    if (myScore > aiScore) return endGame('YOU WIN THE SHOOTOUT!');
    if (aiScore > myScore) return endGame('AI WINS THE SHOOTOUT!');
    sudden = true;
  } else if (sudden) {
    const meLast = results.me[n - 1], aiLast = results.ai[n - 1];
    if (meLast && !aiLast) return endGame('YOU WIN THE SHOOTOUT!');
    if (aiLast && !meLast) return endGame('AI WINS THE SHOOTOUT!');
  }
  // early decision: mathematically settled before round 5
  if (!sudden) {
    const meLeft = ROUNDS - results.me.length, aiLeft = ROUNDS - results.ai.length;
    if (myScore > aiScore + aiLeft) return endGame('YOU WIN THE SHOOTOUT!');
    if (aiScore > myScore + meLeft) return endGame('AI WINS THE SHOOTOUT!');
  }
  round = results.me.length + 1;
  phase = 'shoot';
  msgEl.textContent = 'Click in the goal to aim your shot!';
  updateHud();
}

function endGame(text) {
  phase = 'over';
  const won = text.indexOf('YOU WIN') === 0;
  whistle(0); whistle(.55);
  stinger(won);
  if (won) cheerT = 160;
  msgEl.textContent = text + ' Hit Restart to play again.';
  updateHud();
}

// ---------- drawing ----------
const crowd=[];for(let i=0;i<240;i++)crowd.push({x:14+(i%60)*14.6,y:6+((i/60)|0)*11,c:['#c94a4a','#e8b54a','#4a8ac9','#e0e0e0','#5a4a8a'][i%5],ph:Math.random()*6});
let ballTrail=[];
function draw() {
  ctx.clearRect(0, 0, 900, 560);
  // stadium night sky
  const sg=ctx.createLinearGradient(0,0,0,140);
  sg.addColorStop(0,'#071a0e');sg.addColorStop(1,'#0d331b');
  ctx.fillStyle=sg;ctx.fillRect(0,0,900,150);
  // floodlight glows
  for(const fx of [150,450,750]){
    const lg=ctx.createRadialGradient(fx,-30,10,fx,-30,190);
    lg.addColorStop(0,'rgba(255,255,230,.28)');lg.addColorStop(1,'rgba(255,255,230,0)');
    ctx.fillStyle=lg;ctx.fillRect(fx-190,0,380,150);
  }
  // crowd stand
  ctx.fillStyle='#0c2416';ctx.fillRect(0,0,900,56);
  const hop=cheerT>0?Math.sin(cheerT*.4)*3:0;
  for(const s of crowd){
    ctx.fillStyle=s.c;ctx.globalAlpha=.85;
    ctx.beginPath();ctx.arc(s.x,s.y+(hop?Math.abs(Math.sin(s.ph+cheerT*.5))*hop*2.2:0),3.4,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,50,900,10);
  if(cheerT>0)cheerT--;
  // pitch stripes (below the stand)
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? '#1e7a34' : '#248c3e';
    ctx.fillRect(0, 60 + i * 500 / 6, 900, 500 / 6 + 1);
  }
  // penalty box lines
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
  ctx.strokeRect(120, 0, 660, 330);
  ctx.beginPath(); ctx.arc(450, 330, 80, 0, Math.PI); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(SPOT.x, SPOT.y, 4, 0, 7); ctx.fill();

  // net (ripples after a goal)
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.fillRect(GOAL.x, GOAL.y, GOAL.w, GOAL.h);
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  const nOff = netHit > 0 ? Math.sin(netHit * 14) * netHit * 3.5 : 0;
  for (let x = GOAL.x; x <= GOAL.x + GOAL.w; x += 18) { ctx.beginPath(); ctx.moveTo(x + nOff * Math.sin((x - GOAL.x) / 40), GOAL.y); ctx.lineTo(x + nOff * Math.sin((x - GOAL.x) / 40 + 1), GOAL.y + GOAL.h); ctx.stroke(); }
  for (let y = GOAL.y; y <= GOAL.y + GOAL.h; y += 18) { ctx.beginPath(); ctx.moveTo(GOAL.x, y + nOff * Math.sin(y / 30)); ctx.lineTo(GOAL.x + GOAL.w, y + nOff * Math.sin(y / 30 + 1)); ctx.stroke(); }
  if (netHit > 0) netHit *= 0.92;
  // frame
  ctx.strokeStyle = '#f5f5f5'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(GOAL.x - 4, GOAL.y + GOAL.h);
  ctx.lineTo(GOAL.x - 4, GOAL.y);
  ctx.lineTo(GOAL.x + GOAL.w + 4, GOAL.y);
  ctx.lineTo(GOAL.x + GOAL.w + 4, GOAL.y + GOAL.h);
  ctx.stroke();

  // hover highlight
  if (hover && !anim && phase !== 'over') {
    const zx = GOAL.x + hover.c * GOAL.w / 3, zy = GOAL.y + hover.r * GOAL.h / 2;
    ctx.fillStyle = phase === 'shoot' ? 'rgba(255,224,102,.25)' : 'rgba(125,255,155,.25)';
    ctx.fillRect(zx, zy, GOAL.w / 3, GOAL.h / 2);
    ctx.strokeStyle = phase === 'shoot' ? '#ffe066' : '#7dff9b';
    ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.strokeRect(zx + 3, zy + 3, GOAL.w / 3 - 6, GOAL.h / 2 - 6);
    ctx.setLineDash([]);
  }

  // keeper
  let kp = KEEPER_HOME, lean = 0;
  if (anim) {
    const t = Math.min(1, anim.t / anim.dur);
    const e2 = t * t;
    kp = { x: KEEPER_HOME.x + (anim.keeperTo.x - KEEPER_HOME.x) * e2,
           y: KEEPER_HOME.y + (anim.keeperTo.y - KEEPER_HOME.y) * e2 };
    lean = (anim.keeperTo.x - KEEPER_HOME.x) / 160 * e2;
  }
  drawKeeper(kp.x, kp.y, lean, phase === 'keep' ? '#4da3ff' : '#ff5340');

  // ball
  let bp = SPOT, bs = 1;
  if (anim) {
    const t = Math.min(1, anim.t / anim.dur);
    const arc = Math.sin(t * Math.PI) * -40; // slight lift
    bp = { x: anim.ballFrom.x + (anim.ballTo.x - anim.ballFrom.x) * t,
           y: anim.ballFrom.y + (anim.ballTo.y - anim.ballFrom.y) * t + arc };
    bs = 1 - t * 0.45;
    ballTrail.push({x:bp.x,y:bp.y,s:bs});
    if(ballTrail.length>14)ballTrail.shift();
  } else if(ballTrail.length) ballTrail.length=0;
  // ball trail
  for(let i=0;i<ballTrail.length;i+=2){
    const tp=ballTrail[i],a=i/ballTrail.length;
    ctx.globalAlpha=a*.3;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(tp.x,tp.y,8*tp.s*a,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawBall(bp.x, bp.y, 13 * bs);

  // banner
  if (bannerT > 0) {
    bannerT--;
    ctx.font = 'bold 54px Segoe UI, Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillText(banner, 452, 322);
    ctx.fillStyle = banner.includes('SAVE') || banner.includes('WIN') || banner === 'GOAL!' ? '#ffe066' : '#fff';
    ctx.fillText(banner, 450, 320);
  }

  if (anim && ++anim.t >= anim.dur + 40) { const d = anim.onDone; anim = null; d(); }
  requestAnimationFrame(draw);
}

function drawKeeper(x, y, lean, jersey) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(lean * 0.9);
  // arms
  ctx.strokeStyle = jersey; ctx.lineWidth = 9; ctx.lineCap = 'round';
  const spread = 26 + Math.abs(lean) * 30;
  ctx.beginPath(); ctx.moveTo(-spread - 14, -18); ctx.lineTo(-8, -6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(spread + 14, -18); ctx.lineTo(8, -6); ctx.stroke();
  // legs
  ctx.strokeStyle = '#222';
  ctx.beginPath(); ctx.moveTo(-10, 26); ctx.lineTo(-4, 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 26); ctx.lineTo(4, 6); ctx.stroke();
  // body
  ctx.fillStyle = jersey;
  ctx.beginPath(); ctx.ellipse(0, -2, 15, 22, 0, 0, 7); ctx.fill();
  // head
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath(); ctx.arc(0, -32, 10, 0, 7); ctx.fill();
  ctx.restore();
}

function drawBall(x, y, r) {
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(x, y, r * 0.38, 0, 7); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5 - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.38, y + Math.sin(a) * r * 0.38);
    ctx.lineTo(x + Math.cos(a) * r * 0.95, y + Math.sin(a) * r * 0.95); ctx.stroke();
  }
}

document.getElementById('restart').addEventListener('click', reset);
reset();
requestAnimationFrame(draw);

  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":48,"label":"Penalty goals","goals":[2,4,5],"note":"Beat the goalkeeper in different zones; saves alone cannot earn goal medals."}, { read: () => { return (myScore || 0); } });
</script>
