<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fireworks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; }
  canvas { display: block; cursor: crosshair; }
  #hud {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 255, 255, 0.55);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-align: center;
    pointer-events: none;
    user-select: none;
    transition: opacity 1.5s;
  }
  #hud.hidden { opacity: 0; }
  #auto {
    position: fixed;
    bottom: 14px;
    right: 16px;
    color: rgba(255, 255, 255, 0.4);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">CLICK / TAP TO LAUNCH &nbsp;&middot;&nbsp; A = AUTO SHOW</div>
<div id="auto"></div>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var autoLabel = document.getElementById('auto');

  var W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStars();
  }

  // ---- Night sky stars ----
  var stars = [];
  function buildStars() {
    stars = [];
    var n = Math.floor((W * H) / 2500);
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.75,
        r: Math.random() * 1.3 + 0.3,
        base: Math.random() * 0.5 + 0.25,
        tw: Math.random() * Math.PI * 2,
        ts: Math.random() * 0.03 + 0.005
      });
    }
  }

  // ---- Moon ----
  function drawMoon() {
    var mx = W * 0.85, my = H * 0.16, mr = Math.min(W, H) * 0.045;
    var g = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 3.2);
    g.addColorStop(0, 'rgba(230,235,255,0.28)');
    g.addColorStop(0.4, 'rgba(200,210,255,0.08)');
    g.addColorStop(1, 'rgba(200,210,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(mx - mr * 3.2, my - mr * 3.2, mr * 6.4, mr * 6.4);
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fillStyle = '#e8ebf5';
    ctx.fill();
    ctx.fillStyle = '#cfd4e4';
    [[-0.3, -0.2, 0.22], [0.25, 0.15, 0.16], [0.05, -0.4, 0.12]].forEach(function (c) {
      ctx.beginPath();
      ctx.arc(mx + c[0] * mr, my + c[1] * mr, c[2] * mr, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  // ---- Entities ----
  var rockets = [];
  var particles = [];

  var GRAVITY = 0.045;
  var AIR = 0.985;

  function pickHue() { return Math.floor(Math.random() * 360); }

  function launch(tx, ty) {
    var startX = (tx !== undefined) ? tx + (Math.random() - 0.5) * 40 : W * (0.2 + Math.random() * 0.6);
    var targetY = (ty !== undefined) ? Math.min(ty, H * 0.8) : H * (0.15 + Math.random() * 0.35);
    rockets.push({
      x: startX,
      y: H + 5,
      vx: (tx !== undefined ? (tx - startX) * 0.012 : (Math.random() - 0.5) * 0.6),
      vy: -(9.5 + Math.random() * 2.5),
      targetY: targetY,
      hue: pickHue(),
      trail: []
    });
  }

  function explode(r) {
    var count = 70 + Math.floor(Math.random() * 60);
    var type = Math.random();
    var i, a, sp;
    for (i = 0; i < count; i++) {
      a = (i / count) * Math.PI * 2 + Math.random() * 0.15;
      if (type < 0.45) {
        // sphere shell
        sp = 2.5 + Math.random() * 3.5;
      } else if (type < 0.7) {
        // ring
        sp = 4.6 + Math.random() * 0.6;
      } else if (type < 0.9) {
        // double burst speeds
        sp = (i % 2 === 0) ? 2 + Math.random() : 4.5 + Math.random();
      } else {
        // willow / long droop
        sp = 1.8 + Math.random() * 3;
      }
      var life = 70 + Math.random() * 50;
      particles.push({
        x: r.x, y: r.y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        hue: r.hue + (Math.random() - 0.5) * 30,
        life: life,
        maxLife: life,
        drag: type >= 0.9 ? 0.965 : 0.985,
        grav: type >= 0.9 ? 0.06 : 0.04,
        size: Math.random() * 1.6 + 1.1,
        flicker: Math.random() < 0.4,
        trail: []
      });
    }
    // flash
    flashes.push({ x: r.x, y: r.y, r: 10, max: 130 + Math.random() * 60, a: 0.55 });
  }

  var flashes = [];

  // ---- Input ----
  var auto = false;
  var interacted = false;

  function onTap(x, y) {
    launch(x, y);
    if (!interacted) { interacted = true; setTimeout(function () { hud.classList.add('hidden'); }, 1200); }
  }

  canvas.addEventListener('mousedown', function (e) { onTap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      onTap(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    }
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'a' || e.key === 'A') {
      auto = !auto;
      autoLabel.textContent = auto ? 'AUTO SHOW ON' : '';
    }
  });

  // ---- Loop ----
  var frame = 0;
  function tick() {
    frame++;

    // trail fade instead of clear — this is what makes the streaks
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,6,15,0.22)';
    ctx.fillRect(0, 0, W, H);

    // stars twinkle (drawn dim so they leave soft trails too)
    ctx.fillStyle = '#ffffff';
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      st.tw += st.ts;
      var al = st.base + Math.sin(st.tw) * 0.25;
      ctx.globalAlpha = Math.max(0.05, al);
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawMoon();

    // auto show
    if (auto && frame % 45 === 0 && rockets.length < 4) {
      launch(undefined, undefined);
    }

    ctx.globalCompositeOperation = 'lighter';

    // flashes
    for (var f = flashes.length - 1; f >= 0; f--) {
      var fl = flashes[f];
      fl.r += (fl.max - fl.r) * 0.25;
      fl.a *= 0.75;
      var fg = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, fl.r);
      fg.addColorStop(0, 'rgba(255,255,240,' + fl.a + ')');
      fg.addColorStop(1, 'rgba(255,255,240,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, fl.r, 0, Math.PI * 2);
      ctx.fill();
      if (fl.a < 0.01) flashes.splice(f, 1);
    }

    // rockets
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 10) r.trail.shift();
      r.vy += 0.06; // slight gravity while climbing
      r.x += r.vx;
      r.y += r.vy;

      // trail
      ctx.strokeStyle = 'hsla(' + r.hue + ',90%,70%,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var t = 0; t < r.trail.length; t++) {
        if (t === 0) ctx.moveTo(r.trail[t].x, r.trail[t].y);
        else ctx.lineTo(r.trail[t].x, r.trail[t].y);
      }
      ctx.stroke();
      // head
      ctx.fillStyle = 'hsl(' + r.hue + ',100%,80%)';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // exhaust sparks
      if (Math.random() < 0.6) {
        particles.push({
          x: r.x, y: r.y,
          vx: (Math.random() - 0.5) * 0.8,
          vy: Math.random() * 1 + 0.5,
          hue: 40, life: 20, maxLife: 20,
          drag: 0.95, grav: 0.03, size: 1, flicker: false, trail: []
        });
      }

      if (r.y <= r.targetY || r.vy > -1.2) {
        explode(r);
        rockets.splice(i, 1);
      }
    }

    // particles
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.trail.push({ x: pt.x, y: pt.y });
      if (pt.trail.length > 4) pt.trail.shift();
      pt.vx *= pt.drag;
      pt.vy *= pt.drag;
      pt.vy += pt.grav;
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.life--;

      var k = pt.life / pt.maxLife;
      if (pt.flicker && Math.random() < 0.25) continue; // strobing sparks
      var alpha = Math.max(0, k) * 0.9;
      ctx.strokeStyle = 'hsla(' + pt.hue + ',100%,' + (55 + k * 25) + '%,' + alpha + ')';
      ctx.lineWidth = pt.size;
      ctx.beginPath();
      ctx.moveTo(pt.trail[0].x, pt.trail[0].y);
      for (var q = 1; q < pt.trail.length; q++) ctx.lineTo(pt.trail[q].x, pt.trail[q].y);
      ctx.stroke();

      if (pt.life <= 0 || pt.y > H + 20) particles.splice(p, 1);
    }

    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();

  // opening volley so it is alive even before a click
  setTimeout(function () { launch(W * 0.5, H * 0.3); }, 400);
  tick();
})();
</script>
</body>
</html>
