<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- daylight:early -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">
<script src="../assets/audio-lifecycle.js?v=daylight1"></script>
<script src="../assets/stage-light.js?v=daylight1"></script>
<!-- /daylight:early -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Space Invaders</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(80,220,140,.1), transparent 55%),
      linear-gradient(160deg, #0d141f 0%, #05080e 75%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.3rem, 5vw, 1.9rem);
    letter-spacing: 4px;
    font-weight: 800;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(80,220,140,.4);
  }
  h1 span { color: #50dc8c; }

  .hud { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    padding: 5px 14px;
    min-width: 76px;
    text-align: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .58rem; text-transform: uppercase; letter-spacing: 1.5px; color: #7dc89e; }
  .stat .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  #score { color: #50dc8c; }
  #lives { color: #ff9aa8; }

  #wrap {
    position: relative;
    width: min(96vw, 560px);
  }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    background: #04070d;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(80,220,140,.1);
    touch-action: none;
  }

  #screen {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: rgba(4,7,13,.85);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 18px;
  }
  #screen.hidden { display: none; }
  #screen h2 { font-size: clamp(1.5rem, 6vw, 2.2rem); color: #50dc8c; text-shadow: 0 0 24px rgba(80,220,140,.6); margin-bottom: 10px; }
  #screen p { color: #b8d8c4; margin-bottom: 8px; line-height: 1.55; font-size: .98rem; }
  #screen .best-line { color: #ffd166; font-size: .88rem; margin-bottom: 18px; }
  #screen button {
    background: linear-gradient(135deg, #50dc8c, #2fae64);
    color: #04120a; border: none; border-radius: 999px;
    padding: 13px 36px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 0 22px rgba(80,220,140,.45), 0 3px 0 #1f7a46;
    transition: transform .12s;
  }
  #screen button:hover { transform: scale(1.05); }

  .hint { margin-top: 8px; font-size: .78rem; color: #6a8a78; text-align: center; }
 .hint .karr { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; }
  @media (pointer: coarse) { .hint .kb { display: none; } }
  @media (pointer: fine) { .hint .tc { display: none; } }
</style>
<!-- daylight:late -->
<link rel="stylesheet" href="../assets/stage-light.css?v=daylight1">
<!-- /daylight:late -->
</head>
<body>

<h1>SPACE <span>INVADERS</span></h1>
<div class="hud">
  <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label">Wave</span><span class="value" id="wave">1</span></div>
  <div class="stat"><span class="label">Lives</span><span class="value" id="lives">3</span></div>
  <div class="stat"><span class="label">Best</span><span class="value" id="best">0</span></div>
</div>
<div id="wrap">
  <canvas id="game" width="560" height="640"></canvas>
  <div id="screen">
    <h2>SPACE INVADERS</h2>
    <p>Defend Earth! Clear each wave before the<br>invaders reach the bottom.</p>
    <p class="best-line" id="screenBest"></p>
    <button id="startBtn">LAUNCH (Space)</button>
  </div>
</div>
<div class="hint"><span class="kb"><svg class="karr" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><svg class="karr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg> move · Space fire</span><span class="tc">Drag to move · Tap to fire</span></div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var scoreEl = document.getElementById('score');
  var waveEl = document.getElementById('wave');
  var livesEl = document.getElementById('lives');
  var bestEl = document.getElementById('best');
  var screen = document.getElementById('screen');
  var screenBest = document.getElementById('screenBest');

  var best = 0;
  try { best = parseInt(localStorage.getItem(('invaders_best' + (new URLSearchParams(location.search).get('mode')==='plus'?'_plus':''))) || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;
  screenBest.textContent = best > 0 ? 'Best: ' + best : '';

const arcadePlus = (new URLSearchParams(location.search).get('mode') === 'plus');
  var COLS = 8, ROWS = 4;
  var IW = 40, IH = 28, IGAP = 14;

  var ship, bullets, eBullets, invaders, invDir, invSpeed, invDrop;
  var score, lives, wave, playing, ufo, ufoTimer;
  var parts, shake;
  var keys = {};
  var touchX = null, touchFire = false;

  // ---------- audio ----------
  var ACX = null;
  function ac() {
    try {
      if (!ACX) ACX = new (window.AudioContext || window.webkitAudioContext)();
      if (ACX.state === 'suspended') ACX.resume();
    } catch (e) {}
    return ACX;
  }
  function tone(f, d, type, v, slide, delay) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (delay || 0);
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, slide), t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v || 0.05, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + d + 0.03);
    } catch (e) {}
  }
  function noiseSfx(d, v, type, f) {
    var c = ac(); if (!c) return;
    var t = c.currentTime;
    var len = Math.floor(c.sampleRate * d);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var ch = buf.getChannelData(0);
    for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var fl = c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.frequency.value = f || 800;
    var g = c.createGain(); g.gain.setValueAtTime(v || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(c.destination); src.start(t);
  }
  var sfx = {
    shoot:   function () { tone(900, 0.08, 'square', 0.04, 300); },
    kill:    function () { noiseSfx(0.12, 0.07, 'bandpass', 1200); tone(320, 0.1, 'square', 0.04, 90); },
    ufoKill: function () { [880, 1100, 1320, 1760].forEach(function (f, i) { tone(f, 0.07, 'square', 0.045, null, i * 0.05); }); },
    hit:     function () { noiseSfx(0.35, 0.12, 'lowpass', 400); tone(140, 0.3, 'sawtooth', 0.07, 60); },
    eShoot:  function () { tone(500, 0.06, 'square', 0.025, 240); },
    wave:    function () { [392, 523, 659, 784].forEach(function (f, i) { tone(f, 0.12, 'square', 0.05, null, i * 0.08); }); },
    over:    function () { [330, 262, 208, 165, 131].forEach(function (f, i) { tone(f, 0.22, 'sawtooth', 0.05, null, i * 0.13); }); }
  };
  // menacing descending march
  var march = {
    notes: [110, 104.6, 98, 92.4],
    idx: 0, last: 0,
    tick: function (now, urgency) {
      var interval = Math.max(140, 620 - urgency * 480);
      if (now - this.last > interval) {
        this.last = now;
        var c = ac(); if (!c || c.state !== 'running') return;
        try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
        tone(this.notes[this.idx % 4], 0.11, 'triangle', 0.055);
        tone(this.notes[this.idx % 4] / 2, 0.11, 'sine', 0.04);
        this.idx++;
      }
    }
  };

  // ---------- sprites (hand-drawn pixel invaders) ----------
  var SPRITES = [
    [ // squid
      '...XX...',
      '..XXXX..',
      '.XXXXXX.',
      'XX.XX.XX',
      'XXXXXXXX',
      '.X.XX.X.',
      'X.X..X.X',
      '..X..X..'
    ],
    [ // crab
      '..X....X..',
      '...X..X...',
      '..XXXXXX..',
      '.XX.XX.XX.',
      'XXXXXXXXXX',
      'X.XXXXXX.X',
      'X.X....X.X',
      '...XX.XX..'
    ],
    [ // octopus
      '....XXXX....',
      '.XXXXXXXXXX.',
      'XXXXXXXXXXXX',
      'XXX..XX..XXX',
      'XXXXXXXXXXXX',
      '...XX..XX...',
      '..XX.XX.XX..',
      'XX........XX'
    ]
  ];
  var INV_COLORS = ['#ff8ad8', '#ffd166', '#50dc8c'];

  function drawSprite(rows, x, y, w, h, color, frame) {
    var cols = rows[0].length;
    var cw = w / cols, ch = h / rows.length;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < cols; c++) {
        var bit = rows[r][c] === 'X';
        // legs alternate per frame
        if (r >= rows.length - 2 && frame === 1) bit = rows[r][cols - 1 - c] === 'X';
        if (bit) ctx.fillRect(x + c * cw, y + r * ch, cw + 0.5, ch + 0.5);
      }
    }
    ctx.shadowBlur = 0;
  }

  var stars = [];
  for (var i = 0; i < 3; i++) {
    var layer = [];
    var n = [40, 25, 14][i];
    for (var j = 0; j < n; j++) layer.push({ x: Math.random() * W, y: Math.random() * H, s: 0.4 + i * 0.4 });
    stars.push({ pts: layer, speed: 8 + i * 16 });
  }

  function spawnWave() {
    invaders = [];
    invDir = 1;
    invSpeed = 18 + wave * 5;
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        invaders.push({
          x: 60 + c * (IW + IGAP),
          y: 70 + r * (IH + IGAP),
          type: r === 0 ? 0 : r < 3 ? 1 : 2,
          alive: true, armor: arcadePlus && r === 0 ? 1 : 0, col: c,
          frame: 0
        });
      }
    }
  }

  function reset() {
    ship = { x: W / 2, y: H - 60, w: 44, h: 20, cd: 0, inv: 0 };
    bullets = []; eBullets = []; parts = [];
    score = 0; lives = 3; wave = 1; shake = 0;
    ufo = null; ufoTimer = arcadePlus ? 13 + Math.random()*8 : 400 + Math.random()*600;
    spawnWave();
    scoreEl.textContent = '0';
    livesEl.textContent = '3';
    waveEl.textContent = '1';
  }

  function boom(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 190;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4 + Math.random() * .5, color: color, r: 1.5 + Math.random() * 2.5 });
    }
  }

  function addScore(v) {
    score += v;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(('invaders_best' + (new URLSearchParams(location.search).get('mode')==='plus'?'_plus':'')), String(best)); } catch (e) {}
    }
  }

  function fire() {
    if (ship.cd > 0) return;
    ship.cd = 0.38;
    bullets.push({ x: ship.x, y: ship.y - 14, vy: -520 });
    sfx.shoot();
  }

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    requestAnimationFrame(loop);
    update(dt, now);
    draw(now);
  }

  function update(dt, now) {
    // starfield always scrolls
    stars.forEach(function (l) {
      l.pts.forEach(function (p) { p.y += l.speed * dt; if (p.y > H) { p.y = -2; p.x = Math.random() * W; } });
    });
    if (!playing) return;

    // ship movement
    var mv = 0;
    if (keys.ArrowLeft || keys.a) mv -= 1;
    if (keys.ArrowRight || keys.d) mv += 1;
    if (touchX !== null) {
      var dx = touchX - ship.x;
      mv = Math.max(-1, Math.min(1, dx / 30));
    }
    ship.x += mv * 340 * dt;
    ship.x = Math.max(28, Math.min(W - 28, ship.x));
    ship.cd -= dt;
    ship.inv -= dt;
    if ((keys[' '] || touchFire) && ship.cd <= 0) fire();

    // invader march
    var alive = invaders.filter(function (i) { return i.alive; });
    var urgency = 1 - alive.length / (COLS * ROWS);
    march.tick(now, urgency + (wave - 1) * 0.15);
    var edge = false;
    var speed = invSpeed * (1 + urgency * 2.2);
    alive.forEach(function (inv) {
      inv.x += invDir * speed * dt;
      if (inv.x < 24 || inv.x > W - 24) edge = true;
      if (inv.y > ship.y - 30) loseLife(true);
    });
    if (edge) {
      invDir *= -1;
      alive.forEach(function (inv) { inv.y += 14; inv.frame = 1 - inv.frame; });
    }

    // invader fire
    if (alive.length && Math.random() < dt * (0.7 + wave * 0.25 + urgency)) {
      var front = arcadePlus ? alive.filter(inv=>!alive.some(other=>other.col===inv.col && other.y>inv.y)) : alive;
      var s = front[Math.floor(Math.random() * front.length)];
      eBullets.push({ x: s.x, y: s.y + IH / 2, vy: 150 + wave * 20 });
      sfx.eShoot();
    }

    // UFO
    ufoTimer -= dt;
    if (!ufo && ufoTimer <= 0) {
      ufo = { x: -40, y: 40, vx: 80 + wave * 10 };
    }
    if (ufo) {
      ufo.x += ufo.vx * dt;
      tone(0, 0, 'sine', 0); // keep ctx warm
      if (ufo.x > W + 50) { ufo = null; ufoTimer = arcadePlus ? 17 + Math.random()*8 : 500 + Math.random()*700; }
    }

    // bullets
    bullets.forEach(function (b) { b.y += b.vy * dt; });
    bullets = bullets.filter(function (b) { return b.y > -10; });
    bullets.forEach(function (b) {
      if (ufo && Math.abs(b.x - ufo.x) < 24 && Math.abs(b.y - ufo.y) < 14) {
        var bonus = [100, 150, 300][Math.floor(Math.random() * 3)];
        addScore(bonus);
        boom(ufo.x, ufo.y, '#ff6a6a', 26);
        sfx.ufoKill();
        ufo = null; ufoTimer = arcadePlus ? 17 + Math.random()*8 : 500 + Math.random()*700;
        b.y = -99;
      }
      invaders.forEach(function (inv) {
        if (inv.alive && Math.abs(b.x - inv.x) < IW / 2 && Math.abs(b.y - inv.y) < IH / 2) {
          b.y = -99;
          if (inv.armor) { inv.armor = 0; sfx.kill(); boom(inv.x,inv.y,'#f4cf60',7); return; }
          inv.alive = false;
          addScore(10 * (3 - inv.type));
          boom(inv.x, inv.y, INV_COLORS[inv.type], 14);
          sfx.kill();
          shake = Math.max(shake, 4);
        }
      });
    });
    bullets = bullets.filter(function (b) { return b.y > -10; });

    eBullets.forEach(function (b) { b.y += b.vy * dt; });
    eBullets = eBullets.filter(function (b) {
      if (b.y > H + 10) return false;
      if (ship.inv <= 0 && Math.abs(b.x - ship.x) < 18 && Math.abs(b.y - ship.y) < 14) {
        loseLife(false);
        return false;
      }
      return true;
    });

    // particles
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 22);

    // wave cleared
    if (!invaders.some(function (i) { return i.alive; })) {
      wave++;
      waveEl.textContent = wave;
      addScore(100);
      sfx.wave();
      spawnWave();
    }
  }

  function loseLife(crushed) {
    if (!playing) return;
    boom(ship.x, ship.y, '#7df0ff', 30);
    sfx.hit();
    shake = 10;
    lives--;
    livesEl.textContent = Math.max(0, lives);
    ship.inv = 1.6;
    eBullets = [];
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    playing = false;
    sfx.over();
    screen.querySelector('h2').textContent = 'GAME OVER';
    screen.querySelector('p').innerHTML = 'Final score: <b style="color:#50dc8c">' + score + '</b> · Reached wave ' + wave;
    screenBest.textContent = score >= best && score > 0 ? 'NEW BEST!' : 'Best: ' + best;
    screen.querySelector('button').textContent = 'RETRY (Space)';
    screen.classList.remove('hidden');
  }

  function draw(now) {
    ctx.fillStyle = '#04070d';
    ctx.fillRect(0, 0, W, H);
    // stars
    stars.forEach(function (l, li) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + li * 0.25) + ')';
      l.pts.forEach(function (p) { ctx.fillRect(p.x, p.y, p.s, p.s); });
    });
    // ground line
    ctx.strokeStyle = 'rgba(80,220,140,.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H - 30);
    ctx.lineTo(W, H - 30);
    ctx.stroke();

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    // invaders
    invaders.forEach(function (inv) {
      if (!inv.alive) return;
      if (inv.armor) { ctx.fillStyle = '#ffe686'; ctx.fillRect(inv.x-IW/3,inv.y-IH/2-7,IW*2/3,3); }
      drawSprite(SPRITES[inv.type], inv.x - IW / 2, inv.y - IH / 2, IW, IH, INV_COLORS[inv.type], inv.frame);
    });

    // ufo
    if (ufo) {
      ctx.fillStyle = '#ff6a6a';
      ctx.shadowColor = '#ff6a6a'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.ellipse(ufo.x, ufo.y, 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd0d0';
      ctx.beginPath();
      ctx.ellipse(ufo.x, ufo.y - 5, 9, 6, 0, Math.PI, 0);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ship
    if (playing && (ship.inv <= 0 || Math.floor(now / 90) % 2 === 0)) {
      ctx.fillStyle = '#50dc8c';
      ctx.shadowColor = '#50dc8c'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 14);
      ctx.lineTo(ship.x + 20, ship.y + 10);
      ctx.lineTo(ship.x - 20, ship.y + 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#0a2a18';
      ctx.fillRect(ship.x - 6, ship.y - 2, 12, 6);
      ctx.shadowBlur = 0;
    }

    // bullets
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#7df0ff'; ctx.shadowBlur = 8;
    bullets.forEach(function (b) { ctx.fillRect(b.x - 1.5, b.y - 8, 3, 12); });
    ctx.fillStyle = '#ff9aa8';
    ctx.shadowColor = '#ff5f7a'; ctx.shadowBlur = 8;
    eBullets.forEach(function (b) {
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - 4, b.y - 10);
      ctx.lineTo(b.x + 4, b.y - 10);
      ctx.closePath();
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    // particles
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- input ----------
  document.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if ((e.key === ' ' || e.key === 'Enter') && !playing && !screen.classList.contains('hidden')) {
      startGame(); e.preventDefault();
    }
    if (e.key === ' ') e.preventDefault();
  });
  document.addEventListener('keyup', function (e) { keys[e.key] = false; });

  var firing = false;
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ac();
    var r = canvas.getBoundingClientRect();
    touchX = (e.clientX - r.left) / r.width * W;
    touchFire = true;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (touchX === null) return;
    var r = canvas.getBoundingClientRect();
    touchX = (e.clientX - r.left) / r.width * W;
  });
  canvas.addEventListener('pointerup', function () { touchX = null; touchFire = false; });
  canvas.addEventListener('pointercancel', function () { touchX = null; touchFire = false; });

  function startGame() {
    ac();
    reset();
    playing = true;
    screen.classList.add('hidden');
    sfx.wave();
  }

  screen.querySelector('button').addEventListener('click', startGame);

  reset();
  requestAnimationFrame(loop);
