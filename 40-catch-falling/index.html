<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Falling Items</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#101826;
       font-family:system-ui,'Segoe UI',sans-serif;overflow:hidden}
  #wrap{position:relative;line-height:0}
  canvas{display:block;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);
         width:min(96vw,72vh,480px);height:auto;touch-action:none}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:14px;background:rgba(8,14,28,.74);backdrop-filter:blur(3px);
           border-radius:14px;color:#eaf2ff;text-align:center;line-height:1.4;padding:20px}
  #overlay.hidden{display:none}
  #overlay h1{font-size:30px;margin:0}
  #overlay p{margin:0;max-width:82%;color:#b9c7e2;font-size:15px}
  #final{font-size:20px;font-weight:700;color:#ffd76a;min-height:24px}
  #btn{font:inherit;font-size:17px;font-weight:700;padding:12px 34px;border:0;border-radius:999px;
       background:linear-gradient(180deg,#ffd76a,#f5a623);color:#3a2503;cursor:pointer;
       box-shadow:0 6px 20px rgba(245,166,35,.35);transition:transform .12s}
  #btn:hover{transform:translateY(-2px) scale(1.04)}
  .hint{font-size:12.5px;color:#7f92b8}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="ovTitle">🧺 Catch Falling Items</h1>
    <p id="ovMsg">Catch falling fruit for +10 points.<br>Avoid the 💣 bombs &mdash; you have 3 lives!</p>
    <div id="final"></div>
    <button id="btn">▶ Start</button>
    <p class="hint">Move with the mouse or ← → / A D keys &middot; Space to start</p>
  </div>
</div>
<script>
(() => {
'use strict';
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg   = document.getElementById('ovMsg');
const finalEl = document.getElementById('final');
const btn     = document.getElementById('btn');

const W = 480, H = 640;
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

const BASKET_W = 84, BASKET_Y = H - 78;
const R = 20; // item radius
const FRUITS = ['🍎','🍌','🍊','🍉','🍇','🍓','🍑','🍒','🍍','🥝'];
const EFONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

let state = 'menu'; // menu | play | over
let score = 0, lives = 3, best = 0;
let elapsed = 0, spawnT = 0, shake = 0, flash = 0;
let items = [], parts = [];
let bx = W / 2, tx = W / 2;
const keys = { l: false, r: false };

try { best = +localStorage.getItem('catchBest') || 0; } catch (e) {}

const stars = Array.from({ length: 70 }, () => ({
  x: Math.random() * W, y: Math.random() * H * .8,
  r: Math.random() * 1.6 + .4, p: Math.random() * 6.28
}));

function reset() {
  score = 0; lives = 3; elapsed = 0; spawnT = 600;
  shake = 0; flash = 0; items = []; parts = [];
  bx = tx = W / 2;
}

function startGame() {
  reset();
  state = 'play';
  overlay.classList.add('hidden');
  btn.blur();
}

function gameOver() {
  state = 'over';
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('catchBest', best); } catch (e) {} }
  ovTitle.textContent = '💥 Game Over';
  finalEl.textContent = 'Score: ' + score + '  ·  Best: ' + best;
  ovMsg.innerHTML = isBest && score > 0 ? 'New best score!' : 'The bomb got you!';
  btn.textContent = '↻ Play again';
  overlay.classList.remove('hidden');
}

/* ---------- input ---------- */
function ptr(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) * W / r.width;
}
canvas.addEventListener('pointermove', e => { tx = ptr(e); });
canvas.addEventListener('pointerdown', e => { tx = ptr(e); });

window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.l = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.r = true; e.preventDefault(); }
  else if ((k === ' ' || k === 'Enter') && state !== 'play') { e.preventDefault(); startGame(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});
btn.addEventListener('click', startGame);

/* ---------- game logic ---------- */
function spawn() {
  const bomb = Math.random() < Math.min(.3, .12 + elapsed * .003);
  items.push({
    x: R + Math.random() * (W - 2 * R), y: -R - 10,
    vy: 150 + Math.min(340, elapsed * 6) + Math.random() * 90,
    bomb,
    e: bomb ? '💣' : FRUITS[(Math.random() * FRUITS.length) | 0],
    rot: (Math.random() - .5) * .7, vr: (Math.random() - .5) * 3
  });
}

function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 60 + Math.random() * 260;
    const t = .5 + Math.random() * .4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120,
                 life: t, t, c, r: 2 + Math.random() * 3 });
  }
}

function update(dt) {
  elapsed += dt;
  const sp = 440;
  if (keys.l) tx -= sp * dt;
  if (keys.r) tx += sp * dt;
  tx = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, tx));
  bx += (tx - bx) * Math.min(1, dt * 20);

  spawnT -= dt * 1000;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(260, 830 - elapsed * 12); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt; it.rot += it.vr * dt;
    if (it.y > BASKET_Y - 8 && it.y < BASKET_Y + 34 &&
        Math.abs(it.x - bx) < BASKET_W / 2 + R * .45) {
      if (it.bomb) {
        lives--; shake = .4; flash = .45;
        burst(it.x, it.y, '#ff6b5e', 18);
        items.splice(i, 1);
        if (lives <= 0) { gameOver(); return; }
      } else {
        score += 10;
        burst(it.x, it.y, '#ffd76a', 10);
        items.splice(i, 1);
      }
      continue;
    }
    if (it.y > H + 40) items.splice(i, 1);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  if (shake > 0) shake -= dt;
  if (flash > 0) flash -= dt;
}

/* ---------- rendering ---------- */
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 24,
                               (Math.random() - .5) * shake * 24);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1631'); g.addColorStop(.65, '#22457c'); g.addColorStop(1, '#2f5aa0');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  const tw = performance.now() / 500;
  ctx.fillStyle = '#cfe0ff';
  for (const s of stars) {
    ctx.globalAlpha = .25 + .55 * (0.5 + 0.5 * Math.sin(tw + s.p));
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '40px ' + EFONT;
  ctx.fillText('🌙', W - 56, 60);

  ctx.font = '38px ' + EFONT;
  for (const it of items) {
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
    ctx.fillText(it.e, 0, 0); ctx.restore();
  }

  ctx.font = '64px ' + EFONT;
  ctx.fillText('🧺', bx, BASKET_Y + 30);

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.t);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,60,50,' + (flash * .35).toFixed(3) + ')';
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  ctx.font = '700 22px system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#eaf2ff';
  ctx.fillText('Score  ' + score, 16, 34);
  ctx.textAlign = 'right';
  ctx.font = '22px ' + EFONT;
  ctx.fillText('❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives)), W - 14, 34);

  ctx.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (state === 'play') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
