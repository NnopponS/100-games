<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0f1220;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: min(96vw, 900px);
  }
  canvas {
    display: block;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    background: #1a1f35;
  }
  .hint {
    margin-top: 10px;
    text-align: center;
    color: #8b93b8;
    font-size: 13px;
    letter-spacing: .5px;
  }
  kbd {
    background: #262c48; color: #dfe3ff;
    border-radius: 4px; padding: 1px 6px;
    border: 1px solid #3a4170; border-bottom-width: 2px;
    font-family: inherit; font-size: 12px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="360"></canvas>
  <div class="hint"><kbd>Space</kbd> / <kbd>&uarr;</kbd> / click to jump &nbsp;&middot;&nbsp; press again mid-air for double jump &nbsp;&middot;&nbsp; <kbd>R</kbd> restart</div>
</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var GROUND_Y = H - 60;

  // ---------- state ----------
  var STATE = { READY: 0, RUNNING: 1, DEAD: 2 };
  var state = STATE.READY;

  var player, obstacles, clouds, particles, groundTicks;
  var dist, best = 0, speed, spawnTimer, tGlobal, deadTimer;

  try { best = parseInt(localStorage.getItem('er_best') || '0', 10) || 0; } catch (e) {}

  function reset() {
    player = {
      x: 90, y: GROUND_Y, w: 34, h: 46,
      vy: 0, jumps: 0, ducking: false,
      runPhase: 0, dead: false
    };
    obstacles = [];
    particles = [];
    clouds = [];
    for (var i = 0; i < 6; i++) {
      clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 90, s: .5 + Math.random() * .8 });
    }
    groundTicks = [];
    for (var j = 0; j < 14; j++) {
      groundTicks.push({ x: j * (W / 13) });
    }
    dist = 0;
    speed = 340;          // px/sec, grows over time
    spawnTimer = 1.2;
    tGlobal = 0;
    deadTimer = 0;
  }

  function start() {
    reset();
    state = STATE.RUNNING;
  }

  function saveBest() {
    if (dist > best) {
      best = Math.floor(dist);
      try { localStorage.setItem('er_best', String(best)); } catch (e) {}
    }
  }

  // ---------- input ----------
  function jump() {
    if (state === STATE.READY) { start(); return; }
    if (state === STATE.DEAD) {
      if (deadTimer > 0.4) start();
      return;
    }
    if (player.jumps < 2) {
      player.vy = player.jumps === 0 ? -640 : -560;
      player.jumps++;
      for (var i = 0; i < 6; i++) {
        particles.push({
          x: player.x + player.w / 2, y: player.y,
          vx: -40 - Math.random() * 80, vy: -Math.random() * 60,
          life: .35, max: .35, r: 2 + Math.random() * 2
        });
      }
    }
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      jump();
    } else if (e.code === 'KeyR') {
      start();
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      player.ducking = true;
    }
  });
  document.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      player.ducking = false;
    }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', function (e) { e.preventDefault(); jump(); }, { passive: false });

  // ---------- obstacles ----------
  function spawnObstacle() {
    var r = Math.random();
    var type;
    // flying obstacles only appear once speed is up
    if (r < 0.18 && speed > 470) type = 'fly';
    else if (r < 0.55) type = 'tall';
    else if (r < 0.85) type = 'small';
    else type = 'double';

    var ob = { type: type, x: W + 40 };
    if (type === 'small') { ob.w = 26; ob.h = 30; ob.y = GROUND_Y; }
    else if (type === 'tall') { ob.w = 30; ob.h = 52; ob.y = GROUND_Y; }
    else if (type === 'double') { ob.w = 56; ob.h = 34; ob.y = GROUND_Y; }
    else { ob.w = 36; ob.h = 24; ob.y = GROUND_Y - 52; ob.flyPhase = Math.random() * 6; } // flyer
    obstacles.push(ob);
  }

  function rectsHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y - a.h < b.y && a.y > b.y - b.h;
  }

  // ---------- update ----------
  function update(dt) {
    tGlobal += dt;

    // clouds always drift
    for (var c = 0; c < clouds.length; c++) {
      clouds[c].x -= dt * 20 * clouds[c].s * (state === STATE.RUNNING ? speed / 340 : 1);
      if (clouds[c].x < -90) {
        clouds[c].x = W + 40;
        clouds[c].y = 20 + Math.random() * 90;
        clouds[c].s = .5 + Math.random() * .8;
      }
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vy += 500 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    if (state !== STATE.RUNNING) {
      if (state === STATE.DEAD) deadTimer += dt;
      return;
    }

    dist += speed * dt / 60;               // ~meters
    speed = Math.min(340 + dist * 4.2, 780); // ramp then cap

    // player physics
    player.vy += 1900 * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.jumps = 0;
    }
    var onGround = player.y >= GROUND_Y;
    player.runPhase += dt * (speed / 34);
    var ph = player.ducking && onGround ? 26 : 46;
    player.h = ph;

    // ground texture ticks
    for (var g = 0; g < groundTicks.length; g++) {
      groundTicks[g].x -= speed * dt;
      if (groundTicks[g].x < -30) groundTicks[g].x += W + 60;
    }

    // spawn obstacles
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      var gap = 0.9 + Math.random() * 0.9;
      spawnTimer = Math.max(0.55, gap * (340 / speed) + 0.25);
    }

    // move & collide obstacles
    var pb = { x: player.x + 5, y: player.y - 4, w: player.w - 10, h: player.h - 8 };
    for (var i = obstacles.length - 1; i >= 0; i--) {
      var ob = obstacles[i];
      ob.x -= speed * dt;
      if (ob.type === 'fly') ob.y = GROUND_Y - 52 + Math.sin(tGlobal * 5 + ob.flyPhase) * 10;
      if (ob.x + ob.w < -20) { obstacles.splice(i, 1); continue; }
      var obb = { x: ob.x + 3, y: ob.y, w: ob.w - 6, h: ob.h - 4 };
      if (rectsHit(pb, obb)) {
        state = STATE.DEAD;
        deadTimer = 0;
        saveBest();
        for (var k = 0; k < 22; k++) {
          particles.push({
            x: player.x + player.w / 2, y: player.y - player.h / 2,
            vx: (Math.random() - .5) * 420, vy: -Math.random() * 380,
            life: .6 + Math.random() * .3, max: .9, r: 2 + Math.random() * 3
          });
        }
      }
    }
  }

  // ---------- draw ----------
  function drawBackground() {
    var skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#232a4d');
    skyGrad.addColorStop(0.65, '#3a3f6e');
    skyGrad.addColorStop(1, '#5a4a7a');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    // stars
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    for (var s = 0; s < 40; s++) {
      var sx = (s * 173) % W, sy = (s * 89) % 150;
      var tw = 0.5 + 0.5 * Math.sin(tGlobal * 2 + s);
      ctx.globalAlpha = 0.25 + 0.5 * tw;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // moon
    ctx.fillStyle = '#f4e9c8';
    ctx.beginPath(); ctx.arc(W - 110, 70, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(200,185,150,.5)';
    ctx.beginPath(); ctx.arc(W - 120, 62, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W - 100, 78, 4, 0, Math.PI * 2); ctx.fill();

    // far hills (parallax)
    ctx.fillStyle = '#2c3560';
    var off = (state === STATE.RUNNING ? (dist * 6) : 0) % W;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 2);
    for (var x = 0; x <= W; x += 4) {
      var wx = x + off;
      ctx.lineTo(x, GROUND_Y - 34 - Math.sin(wx * 0.011) * 22 - Math.sin(wx * 0.004) * 14);
    }
    ctx.lineTo(W, GROUND_Y + 2);
    ctx.fill();

    // clouds
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      ctx.fillStyle = 'rgba(220,225,255,' + (0.16 + cl.s * 0.14) + ')';
      ctx.beginPath();
      ctx.ellipse(cl.x, cl.y, 34 * cl.s, 12 * cl.s, 0, 0, Math.PI * 2);
      ctx.ellipse(cl.x + 20 * cl.s, cl.y + 4, 22 * cl.s, 9 * cl.s, 0, 0, Math.PI * 2);
      ctx.ellipse(cl.x - 20 * cl.s, cl.y + 4, 20 * cl.s, 8 * cl.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ground
    ctx.fillStyle = '#3b3050';
    ctx.fillRect(0, GROUND_Y + 2, W, H - GROUND_Y);
    ctx.fillStyle = '#5f517e';
    ctx.fillRect(0, GROUND_Y + 2, W, 4);

    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (var g = 0; g < groundTicks.length; g++) {
      ctx.fillRect(groundTicks[g].x, GROUND_Y + 14, 16, 3);
      ctx.fillRect(groundTicks[g].x + 40, GROUND_Y + 34, 10, 2);
    }
  }

  function drawPlayer() {
    var p = player;
    var onGround = p.y >= GROUND_Y - 0.5;
    var h = p.h, x = p.x, y = p.y;

    ctx.save();
    if (state === STATE.DEAD) {
      ctx.translate(x + p.w / 2, y - h / 2);
      ctx.rotate(Math.min(deadTimer * 3, 1.2));
      ctx.translate(-(x + p.w / 2), -(y - h / 2));
    }

    // body
    ctx.fillStyle = '#ffd75e';
    ctx.strokeStyle = '#c99a1e';
    ctx.lineWidth = 2;
    roundRect(x, y - h, p.w, h, 8);
    ctx.fill(); ctx.stroke();

    // eye
    ctx.fillStyle = '#1a1f35';
    ctx.beginPath();
    ctx.arc(x + p.w - 10, y - h + 14, 3.4, 0, Math.PI * 2);
    ctx.fill();

    // legs (simple animated stubs) when running on ground
    if (onGround && state === STATE.RUNNING) {
      var leg = Math.sin(p.runPhase) * 7;
      ctx.strokeStyle = '#ffd75e';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 10, y - 4); ctx.lineTo(x + 10 + leg, y + 4);
      ctx.moveTo(x + p.w - 10, y - 4); ctx.lineTo(x + p.w - 10 - leg, y + 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawObstacle(ob) {
    if (ob.type === 'fly') {
      ctx.fillStyle = '#ff6b81';
      ctx.strokeStyle = '#b23a50';
      ctx.lineWidth = 2;
      var flap = Math.sin(tGlobal * 14 + ob.flyPhase) * 8;
      // wings
      ctx.beginPath();
      ctx.ellipse(ob.x + ob.w / 2, ob.y - ob.h + 2 + flap * .3, ob.w * .5, 8, -0.3, 0, Math.PI * 2);
      ctx.fill();
      // body
      roundRect(ob.x, ob.y - ob.h, ob.w, ob.h, 10);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ob.x + 9, ob.y - ob.h + 9, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1f35';
      ctx.beginPath(); ctx.arc(ob.x + 10, ob.y - ob.h + 9, 1.4, 0, Math.PI * 2); ctx.fill();
    } else {
      // cactus-like spike block
      ctx.fillStyle = '#54d17a';
      ctx.strokeStyle = '#2f8a4b';
      ctx.lineWidth = 2;
      roundRect(ob.x, ob.y - ob.h, ob.w, ob.h, 6);
      ctx.fill(); ctx.stroke();
      // spikes
      ctx.fillStyle = '#2f8a4b';
      for (var sx = ob.x + 5; sx < ob.x + ob.w - 4; sx += 10) {
        ctx.beginPath();
        ctx.moveTo(sx, ob.y - ob.h - 7);
        ctx.lineTo(sx - 4, ob.y - ob.h + 2);
        ctx.lineTo(sx + 4, ob.y - ob.h + 2);
        ctx.fill();
      }
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var pt = particles[i];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = '#ffd75e';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Segoe UI, Arial';
    ctx.textAlign = 'right';
    ctx.fillText(Math.floor(dist) + ' m', W - 20, 36);
    ctx.font = '14px Segoe UI, Arial';
    ctx.fillStyle = '#aab1d8';
    ctx.fillText('BEST ' + Math.max(best, Math.floor(dist)) + ' m', W - 20, 58);

    // speed bar
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(W - 20 - 120, 68, 120, 5);
    ctx.fillStyle = '#ffd75e';
    ctx.fillRect(W - 20 - 120, 68, 120 * (speed / 780), 5);
  }

  function overlayText() {
    ctx.textAlign = 'center';
    if (state === STATE.READY) {
      ctx.fillStyle = 'rgba(10,12,26,.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 42px Segoe UI, Arial';
      ctx.fillText('ENDLESS RUNNER', W / 2, H / 2 - 30);
      ctx.font = '18px Segoe UI, Arial';
      ctx.fillStyle = '#c9cfef';
      ctx.fillText('Press SPACE to start', W / 2, H / 2 + 12);
    } else if (state === STATE.DEAD) {
      ctx.fillStyle = 'rgba(10,12,26,.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff6b81';
      ctx.font = 'bold 42px Segoe UI, Arial';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 44);
      ctx.fillStyle = '#fff';
      ctx.font = '22px Segoe UI, Arial';
      ctx.fillText(Math.floor(dist) + ' m   ·   best ' + best + ' m', W / 2, H / 2);
      ctx.font = '16px Segoe UI, Arial';
      ctx.fillStyle = '#c9cfef';
      if (deadTimer > 0.4) {
        var blink = Math.sin(tGlobal * 5) > -0.4;
        if (blink) ctx.fillText('SPACE to run again', W / 2, H / 2 + 38);
      }
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- main loop ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.033);
    last = now;
    update(dt);
    drawBackground();
    for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);
    drawPlayer();
    drawParticles();
    drawHUD();
    overlayText();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
