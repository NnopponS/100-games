<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Missile Command</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;display:flex;align-items:center;justify-content:center;font-family:'Courier New',Courier,monospace;color:#cfe3ff;overflow:hidden}
  #wrap{position:relative}
  #hud{display:flex;justify-content:space-between;padding:6px 4px;font-size:15px;letter-spacing:1px;text-shadow:0 0 6px #4af}
  #hud .warn{color:#ff5964;text-shadow:0 0 6px #f00}
  canvas{display:block;background:#0a0f24;cursor:crosshair;touch-action:none;
    width:min(96vw,calc(92vh - 30px) * 1.3333);border:1px solid #1c2a4a;box-shadow:0 0 40px #0a1430}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="score">SCORE 0</span>
    <span id="msg"></span>
    <span id="wave">WAVE 1</span>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
</div>
<script>
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND_Y = H - 40;
const elScore = document.getElementById('score'), elWave = document.getElementById('wave'), elMsg = document.getElementById('msg');

const CITY_X = [150, 235, 320, 480, 565, 650];
const BAT_X  = [70, 400, 730];
const BAT_AMMO = 10;

let scene = 'title';           // title | playing | inter | gameover
let score = 0, wave = 0, interT = 0, interBonus = 0;
let hi = 0, newBest = false;
try { hi = parseInt(localStorage.getItem('mcommand-hi') || '0', 10) || 0; } catch (e) {}
let cities = [], batteries = [], missiles = [], counters = [], explosions = [], particles = [];
let spawnQueue = 0, spawnTimer = 0, spawnInterval = 1;
let shake = 0;

const stars = [];
for (let i = 0; i < 90; i++) stars.push({x: Math.random() * W, y: Math.random() * (GROUND_Y - 80), s: Math.random() * 1.6 + 0.4});

/* ---------- audio (tiny synth, no assets) ---------- */
let AC = null;
function initAudio(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function beep(freq, dur, type, vol){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
function noiseBurst(dur, vol){
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(AC.destination); s.start();
}

/* tension-pulse BGM — ducks while the shared overlay's music is enabled */
const bgm = {
  t: null, step: 0,
  roots: [55, 55, 65.4, 49],
  start(){ this.stop(); this.step = 0; this.t = setInterval(() => this.tick(), 300); },
  tick(){
    if (!AC || AC.state !== 'running') return;
    try { if (localStorage.getItem('aaa_bgm') === '1') return; } catch (e) {}
    const st = this.step++;
    if (st % 2 === 0) beep(this.roots[(st >> 3) % 4], 0.26, 'triangle', 0.05);
    if (st % 16 === 12) beep(220 + wave * 20, 0.12, 'square', 0.018);
  },
  stop(){ if (this.t) clearInterval(this.t); this.t = null; }
};

/* ---------- game setup ---------- */
function reset(){
  score = 0; wave = 0; interBonus = 0; newBest = false;
  cities = CITY_X.map(x => ({x, y: GROUND_Y - 8, alive: true}));
  batteries = BAT_X.map(x => ({x, y: GROUND_Y, alive: true, ammo: BAT_AMMO}));
  missiles = []; counters = []; explosions = []; particles = [];
  spawnQueue = 0; shake = 0;
}
function startWave(){
  wave++;
  bgm.start();
  batteries.forEach(b => { b.alive = true; b.ammo = BAT_AMMO; });
  spawnQueue = 9 + wave * 4;
  spawnInterval = Math.max(0.32, 1.5 - wave * 0.11);
  spawnTimer = 0.6;
  scene = 'playing';
}
function missileSpeed(){ return Math.min(45 + wave * 9, 250) * (0.85 + Math.random() * 0.4); }

function spawnMissile(){
  const targets = cities.filter(c => c.alive).concat(batteries.filter(b => b.alive));
  const t = targets.length ? targets[(Math.random() * targets.length) | 0] : {x: W / 2, y: GROUND_Y};
  const sx = Math.random() * W, sy = -12;
  const tx = t.x + (Math.random() * 14 - 7), ty = (t === undefined ? GROUND_Y : t.y);
  const dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1, sp = missileSpeed();
  missiles.push({x: sx, y: sy, sx, sy, vx: dx / d * sp, vy: dy / d * sp, tx, ty});
}

function fire(mx, my){
  let best = null, bd = Infinity;
  for (const b of batteries){
    if (!b.alive || b.ammo <= 0) continue;
    const d = Math.abs(b.x - mx);
    if (d < bd){ bd = d; best = b; }
  }
  if (!best){ beep(140, 0.12, 'sawtooth', 0.04); return; }
  my = Math.min(my, GROUND_Y - 4);
  best.ammo--;
  const sx = best.x, sy = best.y - 10, dx = mx - sx, dy = my - sy, d = Math.hypot(dx, dy) || 1, sp = 560;
  counters.push({x: sx, y: sy, sx, sy, vx: dx / d * sp, vy: dy / d * sp, tx: mx, ty: my});
  beep(880, 0.09, 'square', 0.04);
}

function boom(x, y, maxR, dur, hostile){
  explosions.push({x, y, r: 0, maxR, dur, t: 0, hostile: !!hostile});
  noiseBurst(0.35, 0.16);
  for (let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 140;
    particles.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: 0.5 + Math.random() * 0.5,
      col: Math.random() < 0.5 ? '#ffb347' : '#ff5e4d'});
  }
}

/* ---------- update ---------- */
function update(dt){
  shake = Math.max(0, shake - dt * 30);

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = explosions.length - 1; i >= 0; i--){
    const e = explosions[i];
    e.t += dt;
    e.r = e.maxR * Math.sin(Math.PI * Math.min(e.t / e.dur, 1));
    if (e.t >= e.dur){ explosions.splice(i, 1); continue; }
    // explosions kill missiles
    for (let j = missiles.length - 1; j >= 0; j--){
      const m = missiles[j];
      if (Math.hypot(m.x - e.x, m.y - e.y) < e.r + 2){
        missiles.splice(j, 1);
        score += 25;
        boom(m.x, m.y, 26, 0.7, false);
        beep(220 + Math.random() * 120, 0.08, 'sawtooth', 0.035);
      }
    }
    // hostile explosions destroy cities & batteries
    if (e.hostile){
      for (const c of cities)
        if (c.alive && Math.hypot(c.x - e.x, c.y - e.y) < e.r + 8){ c.alive = false; shake = 6; }
      for (const b of batteries)
        if (b.alive && Math.hypot(b.x - e.x, b.y - 6 - e.y) < e.r + 8){ b.alive = false; shake = 6; }
    }
  }

  for (let i = missiles.length - 1; i >= 0; i--){
    const m = missiles[i];
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (Math.hypot(m.tx - m.x, m.ty - m.y) < 8){ missiles.splice(i, 1); boom(m.tx, m.ty, 34, 0.8, true); }
  }

  for (let i = counters.length - 1; i >= 0; i--){
    const c = counters[i];
    c.x += c.vx * dt; c.y += c.vy * dt;
    if (Math.hypot(c.tx - c.x, c.ty - c.y) < 10){ counters.splice(i, 1); boom(c.tx, c.ty, 42, 0.9, false); }
  }

  if (scene === 'playing'){
    if (spawnQueue > 0){
      spawnTimer -= dt;
      if (spawnTimer <= 0 && missiles.length < 5 + wave){
        spawnMissile(); spawnQueue--; spawnTimer = spawnInterval * (0.5 + Math.random());
      }
    } else if (missiles.length === 0 && counters.length === 0 && explosions.length === 0){
      if (cities.every(c => !c.alive)){
        scene = 'gameover';
        bgm.stop();
        if (score > hi) {
          hi = score; newBest = true;
          try { localStorage.setItem('mcommand-hi', String(hi)); } catch (e) {}
        }
      } else {
        interBonus = cities.filter(c => c.alive).length * 100 + batteries.reduce((s, b) => s + (b.alive ? b.ammo : 0), 0) * 5;
        score += interBonus;
        interT = 2.4;
        scene = 'inter';
      }
    }
  } else if (scene === 'inter'){
    interT -= dt;
    if (interT <= 0) startWave();
  }

  // HUD
  elScore.textContent = 'SCORE ' + score + '  ·  BEST ' + Math.max(hi, score);
  elWave.textContent = 'WAVE ' + Math.max(wave, 1);
  const usable = batteries.some(b => b.alive && b.ammo > 0);
  elMsg.textContent = (scene === 'playing' && !usable && missiles.length) ? 'NO COUNTER-MISSILES' : '';
  elMsg.className = usable ? '' : 'warn';
}

/* ---------- draw ---------- */
function overlay(lines){
  ctx.fillStyle = 'rgba(4,7,18,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  lines.forEach(l => {
    ctx.fillStyle = l.c || '#cfe3ff';
    ctx.font = (l.s || 22) + 'px "Courier New",monospace';
    ctx.fillText(l.t, W / 2, l.y);
  });
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b1e'); g.addColorStop(1, '#101a3d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#9db4ff';
  for (const s of stars){ ctx.globalAlpha = 0.35 + 0.3 * Math.sin(s.x + s.y); ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;

  // ground
  ctx.fillStyle = '#1c1430'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#2b1f4a'; ctx.fillRect(0, GROUND_Y, W, 3);

  // cities
  for (const c of cities){
    if (c.alive){
      ctx.fillStyle = '#3ec6ff';
      ctx.fillRect(c.x - 14, c.y - 14, 28, 14);
      ctx.fillStyle = '#8fe6ff';
      ctx.fillRect(c.x - 8, c.y - 20, 6, 6);
      ctx.fillRect(c.x + 3, c.y - 17, 5, 3);
    } else {
      ctx.fillStyle = '#2a2438';
      ctx.fillRect(c.x - 14, c.y - 5, 28, 5);
      ctx.fillRect(c.x - 9, c.y - 9, 9, 4);
    }
  }

  // batteries
  for (const b of batteries){
    if (!b.alive){
      ctx.fillStyle = '#2a2438';
      ctx.beginPath(); ctx.moveTo(b.x - 18, b.y); ctx.lineTo(b.x - 8, b.y - 8); ctx.lineTo(b.x + 5, b.y - 4); ctx.lineTo(b.x + 18, b.y); ctx.fill();
    } else {
      ctx.fillStyle = b.ammo > 0 ? '#ffd76a' : '#6b5a2a';
      ctx.beginPath(); ctx.moveTo(b.x - 20, b.y); ctx.lineTo(b.x, b.y - 18); ctx.lineTo(b.x + 20, b.y); ctx.fill();
      ctx.fillStyle = '#05060f';
      ctx.font = '11px "Courier New",monospace'; ctx.textAlign = 'center';
      ctx.fillText(b.ammo, b.x, b.y - 4);
    }
  }

  // counter-missile target markers + trails
  for (const c of counters){
    ctx.strokeStyle = 'rgba(120,220,255,0.7)';
    ctx.beginPath(); ctx.moveTo(c.sx, c.sy); ctx.lineTo(c.x, c.y); ctx.stroke();
    ctx.strokeStyle = '#7fe8ff';
    ctx.beginPath();
    ctx.moveTo(c.tx - 5, c.ty - 5); ctx.lineTo(c.tx + 5, c.ty + 5);
    ctx.moveTo(c.tx + 5, c.ty - 5); ctx.lineTo(c.tx - 5, c.ty + 5);
    ctx.stroke();
    ctx.fillStyle = '#dffaff'; ctx.fillRect(c.x - 2, c.y - 2, 4, 4);
  }

  // enemy missiles
  for (const m of missiles){
    ctx.strokeStyle = 'rgba(255,110,80,0.55)';
    ctx.beginPath(); ctx.moveTo(m.sx, m.sy); ctx.lineTo(m.x, m.y); ctx.stroke();
    ctx.fillStyle = '#ff4b3e';
    ctx.fillRect(m.x - 2, m.y - 2, 4, 4);
  }

  // explosions
  for (const e of explosions){
    const a = Math.max(0, 1 - e.t / e.dur);
    const rg = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, Math.max(e.r, 1));
    rg.addColorStop(0, 'rgba(255,240,180,' + (0.9 * a + 0.1) + ')');
    rg.addColorStop(0.5, 'rgba(255,140,50,' + (0.7 * a) + ')');
    rg.addColorStop(1, 'rgba(255,60,30,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(e.x, e.y, Math.max(e.r, 1), 0, Math.PI * 2); ctx.fill();
  }

  // particles
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life * 1.4);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // scene overlays
  if (scene === 'title') overlay([
    {t: 'MISSILE COMMAND', y: 216, s: 40, c: '#7fe8ff'},
    {t: 'Enemy missiles are inbound.', y: 288},
    {t: 'Click or tap anywhere to launch a counter-missile.', y: 320},
    {t: 'Blast radius destroys missiles mid-flight — aim ahead of them.', y: 352},
    {t: 'Defend your 6 cities. Batteries re-arm each wave.', y: 384},
    hi > 0 ? {t: 'BEST: ' + hi, y: 424, s: 16, c: '#ffd76a'} : {t: '', y: 424, s: 16},
    {t: '— CLICK TO START —', y: 470, c: '#ffd76a'}
  ]);
  else if (scene === 'inter') overlay([
    {t: 'WAVE ' + wave + ' CLEARED', y: 270, s: 30, c: '#7fe8ff'},
    {t: 'BONUS +' + interBonus, y: 320, c: '#ffd76a'},
    {t: 'Click to continue', y: 380, s: 16}
  ]);
  else if (scene === 'gameover') overlay([
    {t: 'GAME OVER', y: 236, s: 44, c: '#ff5964'},
    {t: 'Final score: ' + score, y: 300, c: '#ffd76a'},
    newBest ? {t: '— NEW BEST! —', y: 336, s: 20, c: '#fde047'} : {t: 'Best: ' + hi, y: 336, s: 18, c: '#8fb8ff'},
    {t: 'You survived ' + wave + (wave === 1 ? ' wave' : ' waves'), y: 372, s: 16},
    {t: '— CLICK TO RESTART —', y: 430, c: '#7fe8ff'}
  ]);
}

/* ---------- input ---------- */
function canvasPoint(e){
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = canvasPoint(e);
  if (scene === 'title' || scene === 'gameover'){ reset(); startWave(); }
  else if (scene === 'inter'){ startWave(); }
  else fire(p.x, p.y);
});
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R'){ initAudio(); reset(); startWave(); }
});

/* ---------- main loop ---------- */
reset();
let last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  // Report native gameplay state to the optional mission engine.
  window.__arcadeMissionSource = Object.assign({"id":16,"label":"Waves survived","goals":[1,3,5],"note":"Protect at least one city and survive successive waves."}, { read: () => { return (Math.max(0, wave - (scene === 'inter' ? 0 : 1))); } });
</script>

<script src="../assets/aaa-arcade.js?v=3" defer></script>
<script src="../assets/missions.js" defer></script>
</body>
</html>
