<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0f1117;
    color: #e6e6e6;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  h1 { font-size: 1.6rem; letter-spacing: 0.2em; margin-bottom: 8px; color: #4ade80; }
  #scoreboard { font-size: 1.1rem; margin-bottom: 12px; }
  #scoreboard span { color: #4ade80; font-weight: bold; }
  #wrap { position: relative; }
  canvas {
    background: #151a24;
    border: 2px solid #2a3347;
    border-radius: 6px;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 18, 0.82);
    border-radius: 6px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.8rem; color: #f87171; margin-bottom: 10px; }
  #overlay p { margin-bottom: 14px; }
  #overlay button {
    padding: 10px 26px;
    font-size: 1rem;
    font-weight: bold;
    color: #0f1117;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #6ee7a0; }
  #hint { margin-top: 12px; font-size: 0.85rem; color: #8b93a7; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="scoreboard">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="hidden">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayText">Score: 0</p>
      <button id="restartBtn">Restart</button>
    </div>
  </div>
  <div id="hint">Arrow keys / WASD to move &middot; Space to start</div>

<script>
(function () {
  var GRID = 20;
  var SIZE = 400; // canvas px
  var CELL = SIZE / GRID;
  var TICK = 110; // ms per step

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var restartBtn = document.getElementById('restartBtn');

  var snake, dir, nextDir, food, score, best = 0, running = false, timer = null;

  try { best = parseInt(localStorage.getItem('snake_best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)};
      var onSnake = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!onSnake) { food = f; return; }
    }
  }

  function step() {
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      gameOver();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#151a24';
    ctx.fillRect(0, 0, SIZE, SIZE);

    // grid dots
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (var i = 1; i < GRID; i++) {
      for (var j = 1; j < GRID; j++) {
        ctx.fillRect(i * CELL - 1, j * CELL - 1, 2, 2);
      }
    }

    // food
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fill();

    // snake
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
      var inset = i === 0 ? 1 : 2;
      ctx.fillRect(s.x * CELL + inset, s.y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
    });
  }

  function start() {
    if (timer) clearInterval(timer);
    reset();
    overlay.classList.add('hidden');
    running = true;
    draw();
    timer = setInterval(step, TICK);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    timer = null;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake_best', best); } catch (e) {}
    }
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = 'Score: ' + score;
    overlay.classList.remove('hidden');
  }

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(key) !== -1) {
      e.preventDefault();
    }
    if (!running) {
      if (key === ' ' || key === 'Enter') start();
      return;
    }
    var d = null;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') d = {x: 0, y: -1};
    else if (key === 'ArrowDown' || key === 's' || key === 'S') d = {x: 0, y: 1};
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') d = {x: -1, y: 0};
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') d = {x: 1, y: 0};
    if (d && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
  });

  restartBtn.addEventListener('click', start);

  // initial attract screen
  reset();
  draw();
  overlayTitle.textContent = 'Snake';
  overlayText.textContent = 'Press Space or click Restart';
  overlay.classList.remove('hidden');
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
