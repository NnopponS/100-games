<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darts — 301</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  body {
    background:
      radial-gradient(1100px 700px at 50% -10%, rgba(224,83,61,.10), transparent 60%),
      radial-gradient(900px 620px at 85% 110%, rgba(46,125,70,.12), transparent 60%),
      radial-gradient(circle at 50% 42%, #1d2129 0%, #0d0f13 78%);
    color: #e8e6df;
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  canvas {
    background: radial-gradient(circle at 50% 45%, #23272e, #14171c 75%);
    border-radius: 12px;
    cursor: crosshair;
    display: block;
    max-width: min(92vw, 560px);
    height: auto;
    touch-action: none;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .panel {
    width: 250px;
    background: linear-gradient(180deg, rgba(38,43,54,.92), rgba(22,25,32,.94));
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter: blur(8px);
  }
  h1 { font-size: 20px; letter-spacing: 3px; font-weight: 800; }
  h1 span {
    color: #e0533d;
    text-shadow: 0 0 16px rgba(224,83,61,.6);
  }
  .score-big {
    font-size: 46px;
    font-weight: 800;
    line-height: 1;
    color: #ffd75e;
    text-shadow: 0 0 22px rgba(255,215,94,.4), 0 2px 0 rgba(0,0,0,.4);
    font-variant-numeric: tabular-nums;
  }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #8b919c; }
  .darts { display: flex; gap: 8px; }
  .dart-pip {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #262b33;
    border: 1px solid #3a404b;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all .15s;
  }
  .dart-pip.used { background: linear-gradient(160deg,#f0644d,#c33a2b); border-color: #f0644d; box-shadow: 0 0 12px rgba(224,83,61,.5); }
  #log {
    font-size: 13px;
    line-height: 1.5;
    color: #b8bdc7;
    min-height: 90px;
    max-height: 130px;
    overflow-y: auto;
  }
  #log .bust { color: #ff6b5e; font-weight: 600; }
  #log .win { color: #7ee08a; font-weight: 600; }
  #msg {
    font-size: 14px;
    min-height: 40px;
    color: #ffd75e;
    font-weight: 600;
  }
  button {
    background: linear-gradient(160deg, #f0644d, #c33a2b);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .5px;
    box-shadow: 0 6px 18px rgba(224,83,61,.3), inset 0 1px 0 rgba(255,255,255,.2);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  button:hover { filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(224,83,61,.45), inset 0 1px 0 rgba(255,255,255,.2); }
  button:active { transform: translateY(1px); }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b8bdc7; cursor: pointer; }
  .hint { font-size: 12px; color: #6d747f; }
  kbd {
    background: #2c313a; border-radius: 4px; padding: 1px 6px;
    font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="board" width="600" height="600"></canvas>
  <div class="panel">
    <h1>DARTS <span>301</span></h1>
    <div>
      <div class="label">Score remaining</div>
      <div class="score-big" id="remaining">301</div>
    </div>
    <div>
      <div class="label">Darts this turn</div>
      <div class="darts" id="darts">
        <div class="dart-pip">1</div>
        <div class="dart-pip">2</div>
        <div class="dart-pip">3</div>
      </div>
    </div>
    <div id="msg">Aim with the moving reticle — click or press <kbd>Space</kbd> to throw.</div>
    <div id="log"></div>
    <label class="opt"><input type="checkbox" id="doubleOut"> Classic double-out finish</label>
    <button id="restart">Restart game</button>
    <div class="hint">Rings: treble = &times;3, double ring = &times;2, bull = 25, inner bull = 50. Bust if you go below 0.</div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('board');
  const ctx = cv.getContext('2d');
  const W = cv.width, CX = W / 2, CY = W / 2, R = 225;
  const NUMBERS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
  // Ring boundaries as fraction of R
  const BULL_IN = 0.065, BULL_OUT = 0.16, TRIP_IN = 0.47, TRIP_OUT = 0.55, DBL_IN = 0.93;

  // ===== AAA audio kit (procedural; honors overlay prefs) =====
  let AC=null;
  function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
  function sfxOn(){try{return localStorage.getItem('aaa_sfx')!=='0'}catch(e){return true}}
  function bgmOn(){try{return localStorage.getItem('aaa_bgm')!=='0'}catch(e){return true}}
  function tone(f,d,ty,v,sl,t){if(!sfxOn())return;const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);g.gain.setValueAtTime(.0008,n);g.gain.linearRampToValueAtTime(v||.08,n+.012);g.gain.exponentialRampToValueAtTime(.0006,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
  function nz(d,v,f,q,ty,t){if(!sfxOn())return;const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),L=Math.ceil(c.sampleRate*d),b=c.createBuffer(1,L,c.sampleRate),dd=b.getChannelData(0);for(let i=0;i<L;i++)dd[i]=(Math.random()*2-1)*(1-i/L);const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type=ty||'bandpass';fl.frequency.value=f||1400;fl.Q.value=q||.8;const g=c.createGain();g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.0006,n+d);s.connect(fl);fl.connect(g);g.connect(c.destination);s.start(n)}catch(e){}}
  function mtone(f,d,ty,v,sl,t){const c=ac();if(!c)return;try{const n=c.currentTime+(t||0),o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);g.gain.setValueAtTime(.0008,n);g.gain.linearRampToValueAtTime(v||.05,n+.02);g.gain.exponentialRampToValueAtTime(.0006,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.05)}catch(e){}}
  function stinger(w){(w?[523,659,784,1047]:[392,349,311,262]).forEach(function(f,i){(w?mtone:tone)(f,w?.2:.24,w?'triangle':'sawtooth',w?.09:.05,null,i*(w?.1:.12))})}
  // pub-room groove
  let bgmI=0,bgmNext=-1;const BSTEP=60/100/2;const BASS=[55,55,65.41,73.42],ARP=[220,261.63,329.63,392];
  setInterval(()=>{if(!bgmOn()){bgmNext=-1;return}const c=ac();if(!c||c.state!=='running')return;if(bgmNext<0)bgmNext=c.currentTime+.06;const a=c.currentTime+.32;while(bgmNext<a){const s=bgmI%16,t=bgmNext;
    if(s===0||s===8)mtone(110,.16,'sine',.12,48,t);
    if(s%2===0)mtone(BASS[(bgmI>>1)%4]*.5,.26,'triangle',.04,null,t);
    if(s%4===0)mtone(ARP[(bgmI>>2)%4],.16,'sine',.018,null,t);
    bgmNext+=BSTEP;bgmI++}},80);
  let shakeT=0,puffs=[],popups=[],bestDarts=0;
  try{bestDarts=+localStorage.getItem('darts_best')||0}catch(e){}

  const scoreEl = document.getElementById('remaining');
  const logEl = document.getElementById('log');
  const msgEl = document.getElementById('msg');
  const pips = document.querySelectorAll('.dart-pip');
  const doubleOutEl = document.getElementById('doubleOut');

  let score, turnStart, dartsUsed, marks, flying, gameOver, totalDarts;

  function reset() {
    score = 301; turnStart = 301; dartsUsed = 0; marks = []; flying = null;
    gameOver = false; totalDarts = 0;
    scoreEl.textContent = score;
    logEl.innerHTML = '';
    msgEl.textContent = 'Aim with the moving reticle — click or press Space to throw.';
    pips.forEach(p => p.classList.remove('used'));
  }

  // ---- dartboard drawing ----
  function drawBoard() {
    ctx.clearRect(0, 0, W, W);
    // outer rim
    ctx.beginPath(); ctx.arc(CX, CY, R + 28, 0, Math.PI * 2);
    ctx.fillStyle = '#0b0d10'; ctx.fill();
    for (let i = 0; i < 20; i++) {
      const a0 = -Math.PI / 2 - Math.PI / 20 + i * Math.PI / 10;
      const a1 = a0 + Math.PI / 10;
      const dark = i % 2 === 0;
      const single = dark ? '#1c1c1c' : '#e8dfc8';
      const ring = dark ? '#c33a2b' : '#2e7d46';
      // single segments (bull-out -> treble-in, treble-out -> double-in)
      seg(BULL_OUT * R, TRIP_IN * R, a0, a1, single);
      seg(TRIP_OUT * R, DBL_IN * R, a0, a1, single);
      // treble + double rings
      seg(TRIP_IN * R, TRIP_OUT * R, a0, a1, ring);
      seg(DBL_IN * R, R, a0, a1, ring);
    }
    // bulls
    circle(BULL_OUT * R, '#2e7d46');
    circle(BULL_IN * R, '#c33a2b');
    // wire rings
    ctx.strokeStyle = 'rgba(200,200,200,0.35)';
    ctx.lineWidth = 1.2;
    [BULL_IN, BULL_OUT, TRIP_IN, TRIP_OUT, DBL_IN, 1].forEach(f => ringStroke(f * R));
    for (let i = 0; i < 20; i++) {
      const a = -Math.PI / 2 - Math.PI / 20 + i * Math.PI / 10;
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a) * BULL_OUT * R, CY + Math.sin(a) * BULL_OUT * R);
      ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
      ctx.stroke();
    }
    // numbers
    ctx.fillStyle = '#e8e6df';
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 20; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 10;
      ctx.fillText(NUMBERS[i], CX + Math.cos(a) * (R + 15), CY + Math.sin(a) * (R + 15));
    }
  }
  function seg(r0, r1, a0, a1, fill) {
    ctx.beginPath();
    ctx.arc(CX, CY, r1, a0, a1);
    ctx.arc(CX, CY, r0, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }
  function circle(r, fill) {
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function ringStroke(r) {
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
  }

  // ---- reticle (moving crosshair) ----
  function reticlePos(t) {
    const s = R * 0.98;
    const x = CX + s * (0.55 * Math.sin(t * 0.9) + 0.28 * Math.sin(t * 1.7 + 1.3) + 0.17 * Math.sin(t * 2.9 + 4.1));
    const y = CY + s * (0.55 * Math.sin(t * 1.1 + 2.0) + 0.28 * Math.sin(t * 2.3 + 0.6) + 0.17 * Math.sin(t * 3.7 + 5.2));
    const jx = (Math.random() - 0.5) * 4, jy = (Math.random() - 0.5) * 4;
    // clamp just outside the double ring
    let dx = x + jx - CX, dy = y + jy - CY;
    const d = Math.hypot(dx, dy), max = R * 1.12;
    if (d > max) { dx *= max / d; dy *= max / d; }
    return { x: CX + dx, y: CY + dy };
  }

  function drawReticle(p, t) {
    const pulse = 13 + Math.sin(t * 6) * 2.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(224,83,61,0.95)';
    ctx.lineWidth = 2;
    const g = 6, L = 22;
    ctx.beginPath();
    ctx.moveTo(p.x - L, p.y); ctx.lineTo(p.x - g, p.y);
    ctx.moveTo(p.x + g, p.y); ctx.lineTo(p.x + L, p.y);
    ctx.moveTo(p.x, p.y - L); ctx.lineTo(p.x, p.y - g);
    ctx.moveTo(p.x, p.y + g); ctx.lineTo(p.x, p.y + L);
    ctx.stroke();
    ctx.fillStyle = '#e0533d';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
  }

  // ---- darts stuck in the board ----
  function drawMark(m) {
    const { x, y, ang } = m;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // dart body leaning toward the board
    ctx.strokeStyle = '#d8d3c3'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-14, -6); ctx.stroke();
    ctx.strokeStyle = '#e0533d'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-22, -10); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawFlying(f) {
    const k = f.t / f.dur;
    const e = 1 - Math.pow(1 - k, 3); // ease-out
    const x = f.sx + (f.tx - f.sx) * e;
    const y = f.sy + (f.ty - f.sy) * e - Math.sin(k * Math.PI) * 90; // slight arc
    const s = 1 - e * 0.55;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.atan2(f.ty - f.sy, f.tx - f.sx) + Math.sin(k * Math.PI) * 0.5);
    ctx.scale(s, s);
    ctx.strokeStyle = '#d8d3c3'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, 0); ctx.stroke();
    ctx.strokeStyle = '#e0533d'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-46, 0); ctx.stroke();
    ctx.restore();
  }

  // ---- scoring ----
  function scoreAt(x, y) {
    const dx = x - CX, dy = y - CY;
    const r = Math.hypot(dx, dy) / R;
    if (r <= BULL_IN) return { pts: 50, mult: 2, label: 'BULL 50', dbl: true };
    if (r <= BULL_OUT) return { pts: 25, mult: 1, label: '25', dbl: false };
    if (r > 1) return { pts: 0, mult: 0, label: 'MISS', dbl: false };
    let deg = Math.atan2(dy, dx) * 180 / Math.PI + 90; // 0 = top sector edge offset
    deg = ((deg + 9) % 360 + 360) % 360;
    const n = NUMBERS[Math.floor(deg / 18)];
    if (r >= TRIP_IN && r <= TRIP_OUT) return { pts: n * 3, mult: 3, label: 'T' + n, dbl: false };
    if (r >= DBL_IN) return { pts: n * 2, mult: 2, label: 'D' + n, dbl: true };
    return { pts: n, mult: 1, label: '' + n, dbl: false };
  }

  function throwDart() {
    if (flying || gameOver) return;
    const p = reticlePos(performance.now() / 1000);
    // release scatter
    const spread = 14;
    const tx = p.x + (Math.random() + Math.random() + Math.random() - 1.5) * spread;
    const ty = p.y + (Math.random() + Math.random() + Math.random() - 1.5) * spread;
    flying = { sx: CX, sy: W + 40, tx, ty, t: 0, dur: 16 };
    nz(.18,.09,1500,1.2); tone(320,.08,'sine',.04,600);
  }

  function landDart(f) {
    const res = scoreAt(f.tx, f.ty);
    marks.push({ x: f.tx, y: f.ty, ang: Math.atan2(CY - f.ty, CX - f.tx) * 0.3 - 0.4 });
    dartsUsed++; totalDarts++;
    pips[dartsUsed - 1].classList.add('used');

    const dblOut = doubleOutEl.checked;
    const next = score - res.pts;
    let bust = false, win = false;
    if (next < 0) bust = true;
    else if (dblOut && (next === 1 || (next === 0 && !res.dbl))) bust = true;
    else if (next === 0) win = true;

    log(`${res.label} — ${res.pts}`);

    // impact feedback
    if (res.pts > 0) {
      nz(.07,.16,2400,2); tone(180+res.pts*4,.07,'triangle',.09);
      if (res.pts >= 40) { shakeT = 10; nz(.12,.12,700,1,'lowpass'); }
      if (res.pts === 50) { tone(880,.16,'sine',.08,null,.05); tone(1174,.2,'sine',.07,null,.13); if (window.AAA) AAA.flash(0.16); }
      popups.push({x:f.tx,y:f.ty-14,txt:res.label==='BULL 50'?'BULLSEYE!':res.label,t:0});
      for(let i=0;i<7;i++)puffs.push({x:f.tx,y:f.ty,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:0});
    } else {
      nz(.15,.1,300,.8,'lowpass'); tone(120,.15,'triangle',.05);
      popups.push({x:f.tx,y:f.ty-14,txt:'MISS',t:0});
    }

    if (bust) {
      score = turnStart;
      logEl.innerHTML += `<div class="bust">BUST! Back to ${turnStart}.</div>`;
      msgEl.textContent = `Bust on ${res.label}. Score stays ${turnStart}.`;
      [392,330,262].forEach((f,i)=>tone(f,.18,'sawtooth',.05,null,i*.1));
      endTurn();
    } else if (win) {
      score = 0; gameOver = true;
      const nb=!bestDarts||totalDarts<bestDarts;
      if(nb){bestDarts=totalDarts;try{localStorage.setItem('darts_best',String(bestDarts))}catch(e){}}
      logEl.innerHTML += `<div class="win">CHECKOUT on ${res.label}!${nb?' NEW BEST!':''}</div>`;
      msgEl.textContent = `You win in ${totalDarts} darts${bestDarts?` (best ${bestDarts})`:''}! Hit Restart to play again.`;
      stinger(true);
      if (window.AAA) { AAA.flash(0.3); shakeT = 14; }
    } else {
      score = next;
      msgEl.textContent = `${res.label} scored ${res.pts}. ${dartsUsed}/3 darts thrown.`;
      if (dartsUsed >= 3) endTurn();
    }
    scoreEl.textContent = score;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function endTurn() {
    setTimeout(() => {
      marks = [];
      dartsUsed = 0;
      turnStart = score;
      pips.forEach(p => p.classList.remove('used'));
    }, 650);
  }

  function log(txt) {
    const d = document.createElement('div');
    d.textContent = `› ${txt}`;
    logEl.appendChild(d);
  }

  // ---- input ----
  function canvasPoint(e) {
    const r = cv.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: cx * W / r.width, y: cy * W / r.height };
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); throwDart(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); throwDart(); }
  });
  document.getElementById('restart').addEventListener('click', reset);

  // ---- main loop ----
  function frame() {
    const t = performance.now() / 1000;
    ctx.save();
    if (shakeT > 0) { shakeT--; ctx.translate((Math.random()-.5)*shakeT*.8,(Math.random()-.5)*shakeT*.8); }
    drawBoard();
    marks.forEach(drawMark);
    // cork puffs + score popups
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.x += p.vx/60; p.y += p.vy/60; p.vy += 60/60; p.t++;
      if (p.t > 30) { puffs.splice(i,1); continue; }
      ctx.globalAlpha = 1 - p.t/30; ctx.fillStyle = '#c9b89a';
      ctx.beginPath(); ctx.arc(p.x,p.y,2,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.t++;
      if (p.t > 55) { popups.splice(i,1); continue; }
      ctx.globalAlpha = Math.max(0,1-p.t/55);
      ctx.font='bold 19px "Segoe UI"'; ctx.textAlign='center';
      ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=4;
      ctx.strokeText(p.txt,p.x,p.y-p.t*.7);
      ctx.fillStyle='#ffd75e';ctx.fillText(p.txt,p.x,p.y-p.t*.7);
      ctx.globalAlpha=1;
    }
    if (flying) {
      flying.t++;
      drawFlying(flying);
      if (flying.t >= flying.dur) {
        const f = flying; flying = null;
        landDart(f);
      }
    }
    if (!gameOver) drawReticle(reticlePos(t), t);
    ctx.restore();
    requestAnimationFrame(frame);
  }

  reset();
  frame();
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
