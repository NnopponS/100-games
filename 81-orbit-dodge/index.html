<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orbit Dodge</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#070b18;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:12px}
  .wrap{position:relative;width:min(520px,100%);display:flex;flex-direction:column;gap:8px}
  .hud{display:flex;justify-content:space-between;background:#11172b;border:1px solid #2b3863;padding:9px 14px;border-radius:12px;font-weight:800}
  .hud span{color:#38bdf8}
  canvas{width:100%;height:auto;aspect-ratio:500/500;background:#090d1c;border-radius:16px;border:2px solid #2b3863;display:block;touch-action:none}
  .ov{position:absolute;inset:48px 0 0 0;background:rgba(7,11,24,.84);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
  .ov.hidden{display:none}
  .btn{padding:11px 28px;border:none;border-radius:999px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#060914;font-weight:900;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>
  <canvas id="c" width="500" height="500"></canvas>
  <div class="ov" id="ov">
    <h1 id="ovT" style="color:#38bdf8">ORBIT DODGE</h1>
    <p id="ovP" style="color:#cbd5e1;max-width:320px">Switch between the 3 orbital rings with Space / Up & Down Arrows / Tap to dodge incoming meteors and collect stars!</p>
    <button class="btn" id="startBtn">Launch Orbit</button>
  </div>
</div>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height, CX = W/2, CY = H/2;
  const RINGS = [95, 145, 195];
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), startBtn = document.getElementById('startBtn');

  let best = Number(localStorage.getItem('orbit_best') || 0);
  bestEl.textContent = best;

  let state = 'idle', ringIdx = 1, curR = RINGS[1], theta = 0, score = 0, meteors = [], stars = [], spawnT = 0, bgStars = [];
  for (let i = 0; i < 65; i++) bgStars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8 });

  function reset() {
    ringIdx = 1; curR = RINGS[1]; theta = 0; score = 0; meteors = []; stars = []; spawnT = 0.5;
    for (let i = 0; i < 3; i++) spawnStar();
    scoreEl.textContent = '0';
    state = 'play';
    ov.classList.add('hidden');
  }

  function spawnStar() {
    stars.push({ r: RINGS[Math.floor(Math.random()*3)], ang: Math.random()*Math.PI*2 });
  }

  function spawnMeteor() {
    const a = Math.random()*Math.PI*2;
    const spd = 115 + Math.min(130, score * 1.1);
    const tx = CX + Math.cos(a + (Math.random()-0.5)*0.6)*140;
    const ty = CY + Math.sin(a + (Math.random()-0.5)*0.6)*140;
    const sx = CX + Math.cos(a)*310, sy = CY + Math.sin(a)*310;
    const ang = Math.atan2(ty - sy, tx - sx);
    meteors.push({ x: sx, y: sy, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, r: 10 + Math.random()*5 });
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    theta += (2.1 + Math.min(1.5, score * 0.01)) * dt;
    curR += (RINGS[ringIdx] - curR) * Math.min(1, dt * 14);
    const sx = CX + Math.cos(theta)*curR, sy = CY + Math.sin(theta)*curR;

    score += dt * 10;
    const disp = Math.floor(score);
    scoreEl.textContent = disp;
    if (disp > best) { best = disp; bestEl.textContent = best; localStorage.setItem('orbit_best', String(best)); }

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnMeteor();
      spawnT = Math.max(0.32, 1.1 - score * 0.003);
    }

    for (let i = stars.length - 1; i >= 0; i--) {
      const st = stars[i];
      const px = CX + Math.cos(st.ang)*st.r, py = CY + Math.sin(st.ang)*st.r;
      if (Math.hypot(sx - px, sy - py) < 22) {
        score += 25;
        stars.splice(i, 1);
        spawnStar();
      }
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (Math.hypot(sx - m.x, sy - m.y) < m.r + 10) {
        state = 'over';
        ovT.textContent = 'SHIP DESTROYED!';
        ovP.textContent = `Final Score: ${Math.floor(score)}`;
        startBtn.textContent = 'Orbit Again';
        ov.classList.remove('hidden');
        return;
      }
      if (Math.hypot(m.x - CX, m.y - CY) > 350 || Math.hypot(m.x - CX, m.y - CY) < 42) {
        meteors.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#090d1c';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    for (const b of bgStars) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); }

    // Planet
    const pGrad = ctx.createRadialGradient(CX-15, CY-15, 8, CX, CY, 48);
    pGrad.addColorStop(0, '#60a5fa'); pGrad.addColorStop(1, '#1e3a8a');
    ctx.fillStyle = pGrad;
    ctx.beginPath(); ctx.arc(CX, CY, 46, 0, Math.PI*2); ctx.fill();

    // Rings
    ctx.strokeStyle = 'rgba(148,163,184,.22)'; ctx.lineWidth = 2;
    for (const r of RINGS) { ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI*2); ctx.stroke(); }

    // Stars
    for (const st of stars) {
      const px = CX + Math.cos(st.ang)*st.r, py = CY + Math.sin(st.ang)*st.r;
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
    }

    // Meteors
    for (const m of meteors) {
      ctx.fillStyle = '#fb7185';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI*2); ctx.fill();
    }

    // Ship
    const sx = CX + Math.cos(theta)*curR, sy = CY + Math.sin(theta)*curR;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(theta + Math.PI/2);
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-10, -8); ctx.lineTo(-6, 0); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function shift(dir) {
    if (state !== 'play') return;
    ringIdx = (ringIdx + dir + 3) % 3;
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); shift(1); }
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); ringIdx = Math.min(2, ringIdx + 1); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); ringIdx = Math.max(0, ringIdx - 1); }
  });
  c.addEventListener('pointerdown', () => shift(1));
  startBtn.onclick = reset;
  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
