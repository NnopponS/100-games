<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Planet Defender</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px;
    background:
      radial-gradient(900px 620px at 50% -10%, rgba(14,116,144,.35), transparent 60%),
      radial-gradient(700px 500px at 92% 110%, rgba(30,41,80,.5), transparent 60%),
      #060914;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{position:relative;width:min(520px,100%);display:flex;flex-direction:column;gap:9px}
  .hud{
    display:flex;justify-content:space-between;gap:8px;
    background:rgba(16,23,43,.85);border:1px solid rgba(56,189,248,.3);
    padding:9px 15px;border-radius:13px;font-weight:800;font-size:.9rem;
    box-shadow:0 10px 28px rgba(0,0,0,.45);backdrop-filter:blur(6px);
  }
  .hud .lab{font-size:.56rem;letter-spacing:.14em;color:#7f93b8;display:block;text-transform:uppercase}
  .hud b{color:#38bdf8;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(56,189,248,.5)}
  .hud .hp{color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.5)}
  .hud .cm{color:#fdba74;text-shadow:0 0 10px rgba(253,186,116,.5)}
  .hud .bb{color:#fde047;text-shadow:0 0 10px rgba(253,224,71,.5)}
  .stage{position:relative;width:100%;aspect-ratio:1}
  canvas#c{
    width:100%;height:100%;border-radius:15px;display:block;
    border:1px solid rgba(56,189,248,.35);touch-action:none;
    box-shadow:0 20px 55px rgba(0,0,0,.6),0 0 50px -14px rgba(34,211,238,.35);
  }
  #planet3d{
    position:absolute;left:50%;top:50%;width:19.6%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;
    pointer-events:none;z-index:2;display:none;
    box-shadow:0 0 30px rgba(56,189,248,.5),inset -8px -8px 24px rgba(0,0,0,.55);
  }
  #planet3d canvas{width:100%!important;height:100%!important;display:block}
  .ov{
    position:absolute;inset:0;border-radius:15px;z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:22px;gap:14px;
    background:radial-gradient(ellipse at 50% 40%, rgba(20,40,80,.55), rgba(5,8,18,.92) 75%);
    backdrop-filter:blur(4px);transition:opacity .3s,visibility .3s;
  }
  .ov.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .title{
    font-size:clamp(2rem,8vw,3rem);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(180deg,#fff,#67e8f9 45%,#0e7490);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(34,211,238,.5));
  }
  .title.hot{background:linear-gradient(180deg,#fff,#fda4af 55%,#dc2626);filter:drop-shadow(0 0 22px rgba(220,38,38,.45))}
  .ov p{color:#b8cdec;max-width:340px;font-size:.93rem;line-height:1.55}
  .statline{display:flex;gap:18px;font-weight:800;font-size:1.02rem}
  .statline b{color:#fde047}
  .btn{
    padding:13px 36px;border:none;border-radius:999px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#04121f;
    font-weight:900;font-size:1rem;letter-spacing:.05em;
    box-shadow:0 12px 30px -8px rgba(34,211,238,.6),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s;
  }
  .btn:active{transform:scale(.96)}
  .hint{font-size:.75rem;color:#5f7a9e;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div><span class="lab">Blocked</span><b id="score">0</b></div>
    <div><span class="lab">Shield HP</span><b class="hp" id="hp">5</b></div>
    <div><span class="lab">Combo</span><b class="cm" id="combo">x1</b></div>
    <div><span class="lab">Best</span><b class="bb" id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="c" width="500" height="500"></canvas>
    <div id="planet3d"></div>
    <div class="ov" id="ov">
      <h1 class="title" id="ovT">PLANET<br>DEFENDER</h1>
      <p id="ovP">A meteor storm is inbound! Sweep the energy shield around the planet with your finger or mouse — block rocks before they strike. Armored meteors need a direct face hit!</p>
      <div class="statline" id="ovStats" style="display:none"></div>
      <button class="btn" id="startBtn">ACTIVATE SHIELD</button>
      <div class="hint">Move pointer / drag around the planet · or Arrow keys to rotate</div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" defer></script>
<script>
(() => {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const W = c.width, H = c.height, CX = W/2, CY = H/2, SHIELD_R = 84, ARC_HALF = 0.68;
  const scoreEl = document.getElementById('score'), hpEl = document.getElementById('hp'), bestEl = document.getElementById('best'), comboEl = document.getElementById('combo');
  const ov = document.getElementById('ov'), ovT = document.getElementById('ovT'), ovP = document.getElementById('ovP'), ovStats = document.getElementById('ovStats'), startBtn = document.getElementById('startBtn');
  const p3dHost = document.getElementById('planet3d');

  let ac = null;
  const audio = () => { const A = window.AudioContext || window.webkitAudioContext; if (!ac && A) ac = new A(); if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); return ac; };
  const sfxOn = () => localStorage.getItem('aaa_sfx') !== '0';
  function tone(f, d, type='sine', vol=0.06, slide=null){
    if (!sfxOn()) return; const x = audio(); if (!x) return;
    try {
      const t = x.currentTime, o = x.createOscillator(), g = x.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + d);
      g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0006, t + d);
      o.connect(g); g.connect(x.destination); o.start(t); o.stop(t + d + 0.03);
    } catch {}
  }
  function boom(big){
    const x = audio(); if (!x || !sfxOn()) return;
    try {
      const n = x.createBufferSource(), b = x.createBuffer(1, x.sampleRate * (big ? .4 : .18), x.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, big ? 1.6 : 2.4);
      n.buffer = b;
      const f = x.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = big ? 900 : 1600;
      const g = x.createGain(); g.gain.value = big ? .22 : .15;
      n.connect(f); f.connect(g); g.connect(x.destination); n.start();
    } catch {}
  }

  let best = Number(localStorage.getItem('planet_best') || 0);
  bestEl.textContent = best;

  let state = 'idle', shieldAng = -Math.PI/2, targetAng = -Math.PI/2, meteors = [], sparks = [], score = 0, hp = 5, spawnT = 0, keys = {}, shake = 0, hitFlash = 0;
  let combo = 0, comboT = 0;
  const stars = Array.from({length: 90}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.6 + .3, tw: Math.random()*6 }));

  // ---------- guarded Three.js planet ----------
  let three = null;
  function init3d() {
    if (!window.THREE) return;
    try {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, 1, .1, 100);
      camera.position.z = 3;
      // procedural planet texture
      const tc = document.createElement('canvas'); tc.width = 256; tc.height = 128;
      const t2 = tc.getContext('2d');
      const oce = t2.createLinearGradient(0, 0, 0, 128);
      oce.addColorStop(0, '#075985'); oce.addColorStop(.5, '#0284c7'); oce.addColorStop(1, '#0c4a6e');
      t2.fillStyle = oce; t2.fillRect(0, 0, 256, 128);
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      for (let i = 0; i < 16; i++) { // continents
        const cx2 = rnd() * 256, cy2 = 20 + rnd() * 88, rw = 12 + rnd() * 30;
        t2.fillStyle = ['#16a34a','#15803d','#65a30d'][i % 3];
        t2.beginPath();
        for (let k = 0; k <= 10; k++) {
          const a = k / 10 * Math.PI * 2, rr = rw * (0.5 + rnd() * .6);
          const px = cx2 + Math.cos(a) * rr * 1.5, py = cy2 + Math.sin(a) * rr * .8;
          k === 0 ? t2.moveTo(px, py) : t2.lineTo(px, py);
        }
        t2.closePath(); t2.fill();
      }
      t2.fillStyle = 'rgba(255,255,255,.85)';
      t2.fillRect(0, 0, 256, 12); t2.fillRect(0, 116, 256, 12); // ice caps
      for (let i = 0; i < 30; i++) { // clouds
        t2.fillStyle = `rgba(255,255,255,${.08 + rnd() * .12})`;
        t2.beginPath();
        t2.ellipse(rnd() * 256, 14 + rnd() * 100, 10 + rnd() * 22, 4 + rnd() * 6, 0, 0, Math.PI * 2);
        t2.fill();
      }
      const tex = new THREE.CanvasTexture(tc);
      const planet = new THREE.Mesh(
        new THREE.SphereGeometry(1, 48, 48),
        new THREE.MeshStandardMaterial({ map: tex, roughness: .8, metalness: .05 })
      );
      planet.rotation.z = .3;
      scene.add(planet);
      scene.add(new THREE.AmbientLight(0x446688, 1.2));
      const sun = new THREE.DirectionalLight(0xfff4cc, 2.2);
      sun.position.set(3, 1.5, 2.5);
      scene.add(sun);
      const rim = new THREE.DirectionalLight(0x38bdf8, 1.1);
      rim.position.set(-3, -1, -2);
      scene.add(rim);
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(1.03, 48, 48),
        new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .12, roughness: 1 })
      );
      scene.add(clouds);
      three = { renderer, scene, camera, planet, clouds };
      p3dHost.appendChild(renderer.domElement);
      p3dHost.style.display = 'block';
      size3d();
      window.addEventListener('resize', size3d);
    } catch { three = null; }
  }
  function size3d() {
    if (!three) return;
    const r = p3dHost.getBoundingClientRect();
    three.renderer.setSize(Math.max(2, r.width), Math.max(2, r.height));
  }
  function render3d(t) {
    if (!three) return;
    three.planet.rotation.y = t * .35;
    three.clouds.rotation.y = t * .45;
    three.renderer.render(three.scene, three.camera);
  }

  function reset() {
    shieldAng = targetAng = -Math.PI/2; meteors = []; sparks = []; score = 0; hp = 5; spawnT = .4; shake = 0; hitFlash = 0; combo = 0; comboT = 0;
    scoreEl.textContent = '0'; hpEl.textContent = '5'; comboEl.textContent = 'x1';
    state = 'play';
    ov.classList.add('hidden');
    audio();
  }

  function spawnMeteor() {
    const a = Math.random() * Math.PI * 2;
    const armored = score >= 8 && Math.random() < .22;
    const fast = !armored && score >= 5 && Math.random() < .25;
    const spd = (fast ? 175 : 105) + Math.min(170, score * 2.4);
    meteors.push({
      x: CX + Math.cos(a) * 330, y: CY + Math.sin(a) * 330,
      vx: -Math.cos(a) * spd, vy: -Math.sin(a) * spd,
      r: armored ? 15 : fast ? 7 : 9 + Math.random() * 5,
      armored, spin: Math.random() * 6, trail: []
    });
  }

  function angDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return Math.abs(d);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.04, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    draw(now / 1000);
    render3d(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (keys.ArrowLeft || keys.KeyA) targetAng -= 4.6 * dt;
    if (keys.ArrowRight || keys.KeyD) targetAng += 4.6 * dt;
    // shield eases toward target for fluid feel
    let d = targetAng - shieldAng;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    shieldAng += d * Math.min(1, dt * 14);

    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; comboEl.textContent = 'x1'; } }
    if (shake > 0) shake -= dt * 3;
    if (hitFlash > 0) hitFlash -= dt * 2;

    spawnT -= dt;
    if (spawnT <= 0) {
      spawnMeteor();
      spawnT = Math.max(.26, 1.05 - score * .011);
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.spin += dt * 4;
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > 7) m.trail.shift();
      const dist = Math.hypot(m.x - CX, m.y - CY);

      if (dist <= SHIELD_R + m.r && dist >= SHIELD_R - 16) {
        const ma = Math.atan2(m.y - CY, m.x - CX);
        if (angDiff(ma, shieldAng) <= ARC_HALF) {
          combo = Math.min(5, combo + 1); comboT = 3;
          const mult = combo;
          const pts = (m.armored ? 2 : 1) * mult;
          score += pts;
          comboEl.textContent = 'x' + mult;
          scoreEl.textContent = score;
          if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('planet_best', String(best)); }
          tone(500 + mult * 90, .1, 'triangle', .07, 750);
          boom(false);
          for (let k = 0; k < 12; k++) sparks.push({ x: m.x, y: m.y, vx: (Math.random()-.5)*200, vy: (Math.random()-.5)*200, t: .4, col: m.armored ? '#facc15' : '#22d3ee' });
          meteors.splice(i, 1);
          continue;
        }
      }
      if (dist <= 46 + m.r) {
        hp -= m.armored ? 2 : 1;
        hpEl.textContent = Math.max(0, hp);
        meteors.splice(i, 1);
        combo = 0; comboT = 0; comboEl.textContent = 'x1';
        shake = 1; hitFlash = 1;
        boom(true);
        tone(150, .35, 'sawtooth', .11, 55);
        if (hp <= 0) {
          state = 'over';
          setTimeout(() => {
            ovT.textContent = 'PLANET LOST!';
            ovT.classList.add('hot');
            ovP.innerHTML = 'The shield collapsed under the barrage.';
            ovStats.style.display = 'flex';
            ovStats.innerHTML = `<div>Blocked <b>${score}</b></div><div>Best <b>${best}</b></div>`;
            startBtn.textContent = 'DEFEND AGAIN';
            ov.classList.remove('hidden');
          }, 600);
          return;
        }
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt;
      if (s.t <= 0) sparks.splice(i, 1);
    }
  }

  function drawMeteor(m, t) {
    // trail
    for (let i = 0; i < m.trail.length; i++) {
      const p = m.trail[i], a = i / m.trail.length;
      ctx.fillStyle = `rgba(251,146,60,${a * .3})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, m.r * a * .8, 0, Math.PI*2); ctx.fill();
    }
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.spin);
    if (m.armored) {
      // spiky rock
      ctx.fillStyle = '#78716c';
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * Math.PI * 2;
        const rr = m.r * (k % 2 ? .75 : 1.15);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
    } else {
      const g = ctx.createRadialGradient(-m.r * .3, -m.r * .3, 1, 0, 0, m.r);
      g.addColorStop(0, '#fdba74'); g.addColorStop(.6, '#ea580c'); g.addColorStop(1, '#7c2d12');
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let k = 0; k < 9; k++) {
        const a = k / 9 * Math.PI * 2;
        const rr = m.r * (0.85 + Math.sin(k * 5.3) * .18);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.arc(m.r * .3, m.r * .15, m.r * .28, 0, Math.PI*2); ctx.arc(-m.r * .25, m.r * .3, m.r * .2, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-.5) * shake * 10, (Math.random()-.5) * shake * 10);

    // space
    const bg = ctx.createRadialGradient(CX, CY, 60, CX, CY, 380);
    bg.addColorStop(0, '#0d1830'); bg.addColorStop(1, '#05070f');
    ctx.fillStyle = bg; ctx.fillRect(-12, -12, W + 24, H + 24);
    for (const s of stars) {
      ctx.globalAlpha = .3 + .6 * Math.abs(Math.sin(t * 1.3 + s.tw));
      ctx.fillStyle = '#dbeafe';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // faint orbit guide
    ctx.strokeStyle = 'rgba(56,189,248,.12)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 9]);
    ctx.beginPath(); ctx.arc(CX, CY, SHIELD_R, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);

    // planet (2D fallback — skipped when 3D is live)
    if (!three) {
      const g = ctx.createRadialGradient(CX - 12, CY - 12, 8, CX, CY, 44);
      g.addColorStop(0, '#4ade80'); g.addColorStop(.6, '#0284c7'); g.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(CX, CY, 44, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(74,222,128,.8)';
      ctx.beginPath(); ctx.ellipse(CX - 14, CY - 8, 12, 7, .4, 0, Math.PI*2); ctx.ellipse(CX + 12, CY + 12, 10, 6, -.3, 0, Math.PI*2); ctx.fill();
    }
    // atmosphere ring
    ctx.strokeStyle = `rgba(56,189,248,${.25 + .1 * Math.sin(t * 2)})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, 48, 0, Math.PI*2); ctx.stroke();

    // shield arc — glowing dual stroke + end caps
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(34,211,238,.25)'; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(CX, CY, SHIELD_R, shieldAng - ARC_HALF, shieldAng + ARC_HALF); ctx.stroke();
    const sg = ctx.strokeStyle = '#22d3ee';
    ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 18;
    ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(CX, CY, SHIELD_R, shieldAng - ARC_HALF, shieldAng + ARC_HALF); ctx.stroke();
    ctx.shadowBlur = 0;
    // arc end nodes
    for (const e of [-ARC_HALF, ARC_HALF]) {
      const a = shieldAng + e;
      ctx.fillStyle = '#a5f3fc';
      ctx.beginPath(); ctx.arc(CX + Math.cos(a) * SHIELD_R, CY + Math.sin(a) * SHIELD_R, 5.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // meteors + sparks
    for (const m of meteors) drawMeteor(m, t);
    for (const s of sparks) {
      ctx.globalAlpha = Math.min(1, s.t * 2.8);
      ctx.fillStyle = s.col;
      ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // impact flash
    if (hitFlash > 0) {
      ctx.fillStyle = `rgba(248,113,113,${hitFlash * .2})`;
      ctx.fillRect(-12, -12, W + 24, H + 24);
    }
    ctx.restore();
  }

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Enter' && state !== 'play') startBtn.click();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  const aimAt = e => {
    const r = c.getBoundingClientRect();
    const mx = (e.clientX - r.left) * W / r.width;
    const my = (e.clientY - r.top) * H / r.height;
    targetAng = Math.atan2(my - CY, mx - CX);
  };
  c.addEventListener('pointerdown', e => { e.preventDefault(); aimAt(e); });
  c.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') aimAt(e); });
  startBtn.onclick = () => { ovT.classList.remove('hot'); ovStats.style.display = 'none'; reset(); };

  // three.js may still be loading (defer) — init when ready
  const try3d = () => { if (window.THREE && !three) init3d(); };
  try3d();
  window.addEventListener('load', try3d);
  setTimeout(try3d, 1200);

  requestAnimationFrame(loop);
})();
</script>

<script src="../assets/aaa-arcade.js" defer></script>
</body>
</html>
